<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Car Value Studio</title>
  <style>
    :root {
      color-scheme: light;
      --bg:#f7f8f6;
      --surface:rgba(255,255,255,.78);
      --solid:#ffffff;
      --ink:#111416;
      --muted:#687178;
      --soft:#eef1ee;
      --line:rgba(20,24,26,.12);
      --line-strong:rgba(20,24,26,.2);
      --green:#2f6253;
      --blue:#355f8d;
      --gold:#9a6b20;
      --rose:#94515d;
      --good:#167253;
      --warn:#986a13;
      --bad:#a9443c;
      --shadow:0 22px 70px rgba(23,27,30,.1);
      --shadow-soft:0 12px 34px rgba(23,27,30,.08);
      --radius:8px;
      --pill:999px;
      --max:1180px;
      font-family:-apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", Inter, Segoe UI, ui-sans-serif, system-ui, sans-serif;
      color:var(--ink);
      background:var(--bg);
    }
    * { box-sizing:border-box; }
    html { min-width:320px; background:var(--bg); scroll-behavior:smooth; }
    body {
      margin:0;
      min-width:320px;
      color:var(--ink);
      background:
        linear-gradient(135deg, rgba(255,255,255,.95) 0%, rgba(244,247,248,.92) 42%, rgba(240,239,234,.92) 100%),
        repeating-linear-gradient(90deg, rgba(17,20,22,.025) 0 1px, transparent 1px 80px);
      font-size:15px;
      line-height:1.45;
    }
    body::before {
      content:"";
      position:fixed;
      inset:0;
      pointer-events:none;
      background:linear-gradient(180deg, rgba(255,255,255,.72), rgba(255,255,255,0) 360px);
      z-index:-1;
    }
    a { color:inherit; text-decoration:none; }
    button, input, select { font:inherit; }
    button { cursor:pointer; }
    h1, h2, h3, p { margin:0; }
    h1 { font-size:clamp(42px,7vw,82px); line-height:.92; letter-spacing:0; font-weight:690; }
    h2 { font-size:clamp(26px,4vw,44px); line-height:1; letter-spacing:0; font-weight:680; }
    h3 { font-size:18px; line-height:1.15; font-weight:670; }
    img { max-width:100%; display:block; }
    .shell { width:min(var(--max), calc(100% - clamp(22px,5vw,72px))); margin:0 auto; }
    .topbar {
      position:sticky;
      top:10px;
      z-index:30;
      margin:10px auto 18px;
      padding:8px;
      border:1px solid var(--line);
      border-radius:var(--pill);
      background:rgba(255,255,255,.72);
      box-shadow:0 8px 24px rgba(17,20,22,.06);
      backdrop-filter:blur(22px) saturate(1.18);
      -webkit-backdrop-filter:blur(22px) saturate(1.18);
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:8px;
    }
    .brand { display:flex; align-items:center; gap:9px; padding:8px 12px; font-weight:720; letter-spacing:0; }
    .brand-mark { width:24px; height:24px; border-radius:50%; background:linear-gradient(145deg,var(--ink),#49545c); box-shadow:inset 0 1px 0 rgba(255,255,255,.35); }
    .nav { display:flex; align-items:center; gap:3px; }
    .nav a, .mobile-nav a {
      min-height:36px;
      padding:8px 13px;
      border-radius:var(--pill);
      color:#3b4348;
      font-size:13px;
      font-weight:680;
    }
    .nav a.active, .mobile-nav a.active { background:var(--ink); color:white; }
    main { padding:8px 0 84px; }
    .page { animation:fadeUp .28s ease both; }
    @keyframes fadeUp { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
    .hero {
      min-height:min(740px, calc(100vh - 96px));
      display:grid;
      grid-template-columns:minmax(0,1fr) minmax(310px,.86fr);
      align-items:center;
      gap:26px;
      padding:28px 0 36px;
    }
    .hero-copy { display:grid; gap:24px; align-content:center; }
    .eyebrow { display:inline-flex; width:max-content; align-items:center; gap:8px; color:var(--green); font-size:12px; text-transform:uppercase; font-weight:760; letter-spacing:.08em; }
    .hero p, .section-lead { max-width:640px; color:#5e6870; font-size:clamp(16px,2vw,20px); line-height:1.45; }
    .actions { display:flex; flex-wrap:wrap; gap:10px; align-items:center; }
    .button, .icon-button, .chip, .mode-button {
      border:1px solid var(--line-strong);
      background:rgba(255,255,255,.82);
      color:var(--ink);
      box-shadow:0 1px 0 rgba(255,255,255,.8) inset;
      transition:transform .16s ease, box-shadow .16s ease, border-color .16s ease, background .16s ease;
    }
    .button {
      min-height:44px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:9px;
      padding:11px 16px;
      border-radius:var(--pill);
      font-weight:720;
    }
    .button.primary { background:var(--ink); border-color:var(--ink); color:white; }
    .button:hover, .icon-button:hover, .chip:hover, .mode-button:hover, .card:hover { transform:translateY(-2px); box-shadow:var(--shadow-soft); }
    .button:focus-visible, .icon-button:focus-visible, input:focus-visible, select:focus-visible, .card:focus-visible, .chip:focus-visible, .mode-button:focus-visible {
      outline:3px solid rgba(53,95,141,.2);
      outline-offset:2px;
      border-color:var(--blue);
    }
    .icon-button {
      width:42px;
      height:42px;
      display:inline-grid;
      place-items:center;
      border-radius:50%;
    }
    .icon-button svg, .button svg, .tool-icon svg, .eyebrow svg { width:18px; height:18px; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
    .glass {
      border:1px solid var(--line);
      background:var(--surface);
      box-shadow:var(--shadow-soft);
      backdrop-filter:blur(24px) saturate(1.16);
      -webkit-backdrop-filter:blur(24px) saturate(1.16);
    }
    .feature-stage {
      min-height:500px;
      border-radius:28px;
      overflow:hidden;
      display:grid;
      grid-template-rows:minmax(260px,1fr) auto;
    }
    .car-art {
      min-height:260px;
      background:#eef1ef;
      display:grid;
      place-items:center;
      position:relative;
      overflow:hidden;
    }
    .car-art img { width:100%; height:100%; object-fit:cover; }
    .feature-caption { padding:18px; display:grid; gap:12px; }
    .caption-top { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; }
    .muted { color:var(--muted); }
    .mini { color:var(--muted); font-size:12px; font-weight:560; }
    .stats { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px; }
    .stat, .score-card, .metric {
      border:1px solid var(--line);
      border-radius:var(--radius);
      background:rgba(255,255,255,.64);
      padding:12px;
      min-width:0;
    }
    .stat span, .metric span { display:block; color:var(--muted); font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; }
    .stat strong, .metric strong { display:block; margin-top:4px; font-size:17px; line-height:1.12; letter-spacing:0; overflow-wrap:anywhere; }
    .section { padding:42px 0; }
    .section-head { display:flex; align-items:end; justify-content:space-between; gap:18px; margin-bottom:18px; }
    .grid { display:grid; gap:14px; }
    .cards { grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); }
    .car-grid { grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); }
    .card {
      border:1px solid var(--line);
      border-radius:var(--radius);
      background:rgba(255,255,255,.72);
      box-shadow:0 1px 0 rgba(255,255,255,.85) inset;
      overflow:hidden;
      transition:transform .16s ease, box-shadow .16s ease, border-color .16s ease;
    }
    .card-body { padding:15px; display:grid; gap:13px; }
    .card-art { height:150px; background:#edf0ef; }
    .card-art img { width:100%; height:100%; object-fit:cover; }
    .card-title { display:flex; align-items:flex-start; justify-content:space-between; gap:10px; }
    .tag-row { display:flex; flex-wrap:wrap; gap:7px; }
    .tag, .chip {
      display:inline-flex;
      align-items:center;
      min-height:28px;
      border-radius:var(--pill);
      padding:6px 10px;
      font-size:12px;
      font-weight:650;
    }
    .tag { color:#4b555c; background:#edf1f0; border:1px solid rgba(17,20,22,.06); }
    .tag.green { background:#e6f2ed; color:var(--green); }
    .tag.blue { background:#e8eef7; color:var(--blue); }
    .tag.gold { background:#f5eddd; color:var(--gold); }
    .tag.rose { background:#f3e8eb; color:var(--rose); }
    .toolbar {
      display:grid;
      grid-template-columns:minmax(180px,1fr) minmax(150px,240px) auto;
      gap:10px;
      align-items:center;
      margin:0 0 16px;
    }
    input, select {
      width:100%;
      min-height:44px;
      border:1px solid var(--line-strong);
      border-radius:var(--pill);
      padding:10px 14px;
      background:rgba(255,255,255,.84);
      color:var(--ink);
      box-shadow:0 1px 0 rgba(255,255,255,.8) inset;
    }
    select { appearance:auto; }
    label { display:grid; gap:7px; color:#333c42; font-size:13px; font-weight:650; }
    .label-row { display:flex; align-items:center; justify-content:space-between; gap:10px; }
    .form-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:12px; }
    .panel {
      border:1px solid var(--line);
      border-radius:var(--radius);
      background:rgba(255,255,255,.72);
      padding:16px;
      box-shadow:var(--shadow-soft);
    }
    .wide-layout { display:grid; grid-template-columns:minmax(0,.82fr) minmax(0,1.18fr); gap:16px; align-items:start; }
    .tool-layout { display:grid; grid-template-columns:minmax(260px,.78fr) minmax(0,1.22fr); gap:16px; align-items:start; }
    .compact-row { display:grid; grid-template-columns:1fr auto; gap:10px; align-items:center; }
    .compare-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px; }
    .comparison-table { display:grid; gap:8px; }
    .compare-line {
      display:grid;
      grid-template-columns:minmax(110px,.7fr) repeat(var(--cols,2),minmax(0,1fr));
      gap:8px;
      align-items:stretch;
    }
    .compare-line > div {
      min-width:0;
      min-height:42px;
      border:1px solid var(--line);
      border-radius:var(--radius);
      padding:10px;
      background:rgba(255,255,255,.64);
      overflow:hidden;
      text-overflow:ellipsis;
      overflow-wrap:anywhere;
    }
    .score-bar {
      height:8px;
      border-radius:var(--pill);
      background:#e7ebe9;
      overflow:hidden;
      margin-top:8px;
    }
    .score-bar i { display:block; height:100%; width:var(--w,50%); background:linear-gradient(90deg,var(--green),var(--blue)); border-radius:inherit; }
    .detail-hero {
      display:grid;
      grid-template-columns:minmax(0,1fr) minmax(300px,.92fr);
      gap:18px;
      align-items:stretch;
      padding:18px 0 24px;
    }
    .detail-title { display:grid; align-content:center; gap:18px; padding:28px; border-radius:28px; min-height:320px; }
    .detail-art { border-radius:28px; overflow:hidden; min-height:320px; }
    .spec-strip { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; }
    .ranking-list { display:grid; gap:10px; }
    .rank-row {
      display:grid;
      grid-template-columns:54px minmax(190px,1.1fr) repeat(4,minmax(110px,.7fr));
      gap:8px;
      align-items:center;
      border:1px solid var(--line);
      border-radius:var(--radius);
      background:rgba(255,255,255,.72);
      padding:10px;
    }
    .rank-num { font-size:22px; font-weight:720; color:var(--blue); }
    .mode-bar { display:flex; flex-wrap:wrap; gap:8px; }
    .mode-button { min-height:38px; border-radius:var(--pill); padding:8px 12px; font-weight:680; }
    .mode-button.active { background:var(--ink); border-color:var(--ink); color:white; }
    .mobile-nav {
      display:none;
      position:fixed;
      left:10px;
      right:10px;
      bottom:10px;
      z-index:35;
      padding:7px;
      border:1px solid var(--line);
      border-radius:var(--pill);
      background:rgba(255,255,255,.82);
      box-shadow:0 12px 32px rgba(17,20,22,.14);
      backdrop-filter:blur(22px);
      -webkit-backdrop-filter:blur(22px);
      justify-content:space-between;
    }
    .empty { padding:24px; text-align:center; color:var(--muted); }
    [hidden] { display:none !important; }
    @media (max-width:860px) {
      .nav { display:none; }
      .mobile-nav { display:flex; }
      .topbar { top:0; margin-top:0; border-radius:0 0 18px 18px; width:100%; }
      .hero, .wide-layout, .tool-layout, .detail-hero { grid-template-columns:1fr; }
      .hero { min-height:auto; padding-top:18px; }
      .feature-stage, .detail-title, .detail-art { min-height:300px; }
      .toolbar { grid-template-columns:1fr; }
      .compare-line { grid-template-columns:1fr; }
      .rank-row { grid-template-columns:42px minmax(0,1fr); }
      .rank-row .hide-mobile { display:none; }
      .section-head { display:grid; align-items:start; }
    }
    @media (max-width:520px) {
      .shell { width:min(100% - 20px, var(--max)); }
      h1 { font-size:42px; }
      .stats, .spec-strip { grid-template-columns:1fr 1fr; }
      .card-art { height:132px; }
      .actions .button { width:100%; }
    }
  </style>
</head>
<body>
  <header class="topbar shell" aria-label="Main navigation">
    <a class="brand" href="#home" aria-label="Car Value Studio home"><span class="brand-mark" aria-hidden="true"></span><span>Car Value Studio</span></a>
    <nav class="nav">
      <a href="#home" data-nav="home">Home</a>
      <a href="#cars" data-nav="cars">Cars</a>
      <a href="#tools" data-nav="tools">Tools</a>
      <a href="#ranking" data-nav="ranking">Ranking</a>
    </nav>
  </header>
  <main id="app" class="shell"></main>
  <nav class="mobile-nav" aria-label="Mobile navigation">
    <a href="#home" data-nav="home">Home</a>
    <a href="#cars" data-nav="cars">Cars</a>
    <a href="#tools" data-nav="tools">Tools</a>
    <a href="#ranking" data-nav="ranking">Rank</a>
  </nav>
  <datalist id="carChoices"></datalist>
  <script>
/* __MODEL_JS__ */
  </script>
  <script>
    const M = window.CarCompareModel;
    const cars = M.CAR_DATABASE;
    const byId = M.CAR_BY_ID;
    const categoryList = ["All"].concat([...new Set(cars.map((car) => car.categoryGroup || car.categoryLabel || car.category).filter(Boolean))].sort());
    const state = {
      route: parseRoute(),
      carSearch: "",
      carCategory: "All",
      carVisible: 48,
      carView: "grid",
      assumptions: Object.assign({}, M.DEFAULT_ASSUMPTIONS),
      financialCars: {
        car1: M.defaultCar("car1"),
        car2: M.defaultCar("car2"),
      },
      specIds: ["tesla-model-3", "volkswagen-golf", "toyota-corolla"].filter((id) => byId[id]),
      usedOffers: [
        { modelId:"tesla-model-3", mileage:65000, condition:8, batteryHealth:92, warranty:12, service:8, risk:2, repairs:600, offerPrice:25000 },
        { modelId:"volkswagen-golf", mileage:90000, condition:7, batteryHealth:100, warranty:3, service:7, risk:3, repairs:850, offerPrice:14500 },
      ],
      valueIds: ["tesla-model-3", "toyota-corolla", "skoda-octavia", "hyundai-kona-electric"].filter((id) => byId[id]),
      rankingMode: "value",
      rankingSearch: "",
      rankingCategory: "All",
      rankingLimit: 80,
      rankingRows: null,
    };

    const icons = {
      arrow:"M5 12h14M13 5l7 7-7 7",
      car:"M5 17h14M7 17l1.6-5.2A3 3 0 0 1 11.5 10h1A3 3 0 0 1 15.4 11.8L17 17M7 17a2 2 0 1 0 0 .1M17 17a2 2 0 1 0 0 .1",
      search:"M10.5 18a7.5 7.5 0 1 1 0-15 7.5 7.5 0 0 1 0 15ZM16 16l5 5",
      tools:"M14.7 6.3l3-3 3 3-3 3M4 20l8.5-8.5M7 17l-3 3M12 4h5M4 12h5",
      rank:"M7 20V10M12 20V4M17 20v-7",
      bolt:"M13 2 5 13h6l-2 9 8-12h-6l2-8",
      gauge:"M4 14a8 8 0 1 1 16 0M12 14l4-4",
    };

    function svgIcon(name) {
      return `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="${icons[name] || icons.arrow}"></path></svg>`;
    }

    function escapeHtml(value) {
      return String(value == null ? "" : value).replace(/[&<>"']/g, (char) => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[char]));
    }

    function normalize(value) {
      return String(value || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
    }

    function money(value) {
      return `€${Math.round(Number(value) || 0).toLocaleString("en-IE")}`;
    }

    function number(value, digits = 1) {
      return (Number(value) || 0).toLocaleString("en-IE", { maximumFractionDigits: digits });
    }

    function pct(value) {
      return `${Math.round((Number(value) || 0) * 100)}%`;
    }

    function avgScore(car) {
      const scores = car.scores || {};
      const values = [scores.reliability, scores.comfort, scores.safety, scores.practicality, scores.tech, scores.drivingEnjoyment].map(Number).filter(Number.isFinite);
      return values.length ? values.reduce((sum, value) => sum + value, 0) / values.length : 0;
    }

    function energyLabel(car) {
      if (car.energyType === "electricity") return `${number(car.realWorldKwhPer100km)} kWh/100km`;
      return `${number(car.realWorldLitersPer100km)} L/100km`;
    }

    function runningMonthly(car) {
      return Number(car.estimatedMonthlyRunningCost) || Math.round(((car.maintenancePerYear || 0) + (car.insurancePerYear || 0) + (car.repairsPerYear || 0) + (car.taxPerYear || 0)) / 12);
    }

    function artSvg(key, label) {
      const palettes = {
        ev:["#dfeaf2","#355f8d","#b7d2ec"],
        suv:["#e6ebe6","#2f6253","#ccd8d0"],
        sports:["#f2e8ea","#94515d","#e8c7cf"],
        supercar:["#ede8dd","#9a6b20","#ead8a8"],
        practical:["#e7ebee","#586774","#ccd6dc"],
        sedan:["#eef0f3","#20262b","#cbd3d8"],
        city:["#edf1ed","#5c7a66","#d8e5d9"],
        hatch:["#eceff1","#42505a","#d6dde2"],
      };
      const p = palettes[key] || palettes.hatch;
      const safeLabel = escapeHtml(label || "Car");
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="${p[0]}"/><stop offset="1" stop-color="#fff"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="24" stdDeviation="18" flood-color="#111416" flood-opacity=".16"/></filter></defs><rect width="900" height="560" fill="url(#g)"/><path d="M106 360c34-78 92-126 174-144h258c70 10 124 57 166 144h58c28 0 50 22 50 50v14H78v-16c0-26 21-48 48-48h-20Z" fill="${p[1]}" filter="url(#s)"/><path d="M265 238h240c50 10 90 42 118 90H188c20-46 46-75 77-90Z" fill="${p[2]}" opacity=".9"/><path d="M298 250h86v78H214c19-37 47-63 84-78Zm108 0h89c39 9 71 35 95 78H406v-78Z" fill="#f8fbfb" opacity=".72"/><circle cx="242" cy="421" r="51" fill="#15191d"/><circle cx="242" cy="421" r="22" fill="#dfe4e7"/><circle cx="648" cy="421" r="51" fill="#15191d"/><circle cx="648" cy="421" r="22" fill="#dfe4e7"/><path d="M132 389h646" stroke="#fff" stroke-opacity=".46" stroke-width="8" stroke-linecap="round"/><text x="50%" y="86" text-anchor="middle" fill="#111416" opacity=".68" font-family="Avenir Next, Arial" font-size="28" font-weight="700">${safeLabel}</text></svg>`;
      return `data:image/svg+xml;charset=utf-8,${encodeURIComponent(svg)}`;
    }

    function imageFor(car) {
      const src = car.image || (Array.isArray(car.gallery) && car.gallery[0]) || artSvg(car.fallbackCategoryImage, car.categoryGroup || car.powertrain);
      return escapeHtml(src);
    }

    function parseRoute() {
      const loc = typeof location !== "undefined" ? location : { hash:"#home" };
      const hash = (loc.hash || "#home").replace(/^#\/?/, "").split("?")[0];
      const parts = hash.split("/").filter(Boolean);
      return { page: parts[0] || "home", sub: parts[1] || "", id: parts[1] || "" };
    }

    function setActiveNav() {
      const page = state.route.page === "car" ? "cars" : state.route.page === "tools" ? "tools" : state.route.page;
      document.querySelectorAll("[data-nav]").forEach((link) => link.classList.toggle("active", link.dataset.nav === page));
    }

    function fillDatalist() {
      const list = document.getElementById("carChoices");
      const fragment = document.createDocumentFragment();
      cars.forEach((car) => {
        const option = document.createElement("option");
        option.value = car.fullName || car.displayName;
        option.label = `${car.categoryGroup || car.category} · ${money(car.defaultUpfrontPrice || 0)}`;
        fragment.appendChild(option);
      });
      list.appendChild(fragment);
    }

    function findCarByInput(value) {
      const q = normalize(value);
      if (!q) return null;
      return cars.find((car) => normalize(car.fullName || car.displayName) === q)
        || byId[value]
        || cars.find((car) => car.searchText && car.searchText.includes(q))
        || null;
    }

    function carInput(name, value, placeholder = "Search car") {
      const car = byId[value] || findCarByInput(value);
      return `<input data-car-input="${escapeHtml(name)}" list="carChoices" type="search" placeholder="${escapeHtml(placeholder)}" value="${escapeHtml(car ? car.fullName || car.displayName : value || "")}">`;

    function toolSpec() {

      const fields = [
        ["Power", (car) => `${number(car.horsepower, 0)} hp`],

        ["Top speed", (car) => `${number(car.topSpeed, 0)} km/h`],

        ["Tech", (car) => `${number(car.scores.tech, 1)}/10`],
        ["Comfort", (car) => `${number(car.scores.comfort, 1)}/10`],
        ["Practicality", (car) => `${number(car.scores.practicality, 1)}/10`],

      return `<div class="page"><section class="section">

        <div class="tool-layout">${selectionPanel("spec", state.specIds)}<div class="panel"><div class="comparison-table" style="--cols:${chosen.length}">${compareHeader(chosen)}${fields.map(([label, fn]) => compareLine(label, chosen, fn)).join("")}</div></div></div>

    function compareLine(label, chosen, fn) {
      return `<div class="compare-line" style="--cols:${chosen.length}"><div><strong>${escapeHtml(label)}</strong></div>${chosen.map((car) => `<div>${escapeHtml(fn(car))}</div>`).join("")}</div>`;

    function toolUsed() {
      const offers = state.usedOffers.map((offer) => Object.assign({ car: byId[offer.modelId] }, offer)).filter((offer) => offer.car);
      const ranked = offers.map(scoreUsedOffer).sort((a, b) => b.score - a.score);
      return `<div class="page"><section class="section">
        <div class="section-head"><div><span class="eyebrow">${svgIcon("search")} Used Market Compare</span><h2>Is the used offer good?</h2><p class="section-lead">Offer price, mileage, condition, battery health, warranty, service history, risk, and expected repairs.</p></div></div>
        <div class="wide-layout">
          <div class="grid">${state.usedOffers.map((offer, index) => usedOfferPanel(offer, index)).join("")}</div>
          <div class="grid">${ranked.map((offer, index) => `<div class="panel"><div class="label-row"><h3>${index + 1}. ${escapeHtml(offer.car.fullName)}</h3><span class="tag ${offer.score >= 0 ? "green" : "rose"}">${money(offer.score)}</span></div><div class="spec-strip" style="margin-top:12px">${metric("Offer", money(offer.offerPrice))}${metric("Adjusted value", money(offer.adjustedValue))}${metric("Risk reserve", money(offer.riskReserve))}${metric("Verdict", offer.score >= 0 ? "Good offer" : "Overpriced")}</div></div>`).join("")}</div>
        </div>
      </section></div>`;
    }

    function usedOfferPanel(offer, index) {
      return `<div class="panel"><h3>Offer ${index + 1}</h3><div class="form-grid" style="margin-top:12px">
        <label>Model ${carInput(`used:${index}:modelId`, offer.modelId)}</label>
        ${usedInput(index, "offerPrice", "Offer price", 500)}
        ${usedInput(index, "mileage", "Mileage", 5000)}
        ${usedInput(index, "condition", "Condition 1-10", 1)}
        ${usedInput(index, "batteryHealth", "Battery health %", 1)}
        ${usedInput(index, "warranty", "Warranty months", 1)}
        ${usedInput(index, "service", "Service history 1-10", 1)}
        ${usedInput(index, "risk", "Accident/import risk 0-10", 1)}
        ${usedInput(index, "repairs", "Expected repairs", 100)}
      </div></div>`;
    }

    function usedInput(index, field, label, step) {
      return `<label>${escapeHtml(label)}<input data-used-field="${index}:${field}" type="number" step="${step}" value="${escapeHtml(state.usedOffers[index][field])}"></label>`;
    }

    function scoreUsedOffer(offer) {
      const car = offer.car;
      const mileageFactor = Math.max(.58, 1 - Math.max(0, Number(offer.mileage) - 30000) / 260000);
      const conditionFactor = .78 + Math.max(1, Math.min(10, Number(offer.condition))) * .028;
      const batteryFactor = car.energyType === "electricity" ? Math.max(.72, Math.min(1.04, Number(offer.batteryHealth) / 100)) : 1;
      const warrantyBonus = Math.min(1800, Number(offer.warranty) * 80);
      const servicePenalty = (10 - Math.max(1, Math.min(10, Number(offer.service)))) * 260;
      const riskReserve = Number(offer.repairs) + Number(offer.risk) * 420 + servicePenalty;
      const adjustedValue = Math.round((car.defaultUpfrontPrice * mileageFactor * conditionFactor * batteryFactor + warrantyBonus - riskReserve) / 100) * 100;
      return Object.assign({}, offer, { adjustedValue, riskReserve, score: adjustedValue - Number(offer.offerPrice || 0) });
    }

    function toolValue() {
      const chosen = selectedCars(state.valueIds);
      const rows = valueRows(chosen);
      return `<div class="page"><section class="section">
        <div class="section-head"><div><span class="eyebrow">${svgIcon("rank")} Value Compare</span><h2>Best total value</h2><p class="section-lead">Transparent normalized score: financial outcome, quality, spec value, and reliability/practicality.</p></div></div>
        <div class="tool-layout">${selectionPanel("value", state.valueIds)}<div class="grid">${rows.map((row, index) => `<div class="panel"><div class="label-row"><h3>${index + 1}. ${escapeHtml(row.car.fullName)}</h3><span class="tag green">${number(row.valueScore, 0)}</span></div><div class="spec-strip" style="margin-top:12px">${metric("Financial", `${number(row.financial, 0)}`)}${metric("Quality", `${number(row.quality, 0)}`)}${metric("Spec value", `${number(row.spec, 0)}`)}${metric("Reliable/practical", `${number(row.life, 0)}`)}</div><p class="mini" style="margin-top:10px">Formula: 40% financial, 25% quality, 20% performance per euro, 15% reliability and practicality.</p></div>`).join("")}</div></div>
      </section></div>`;
    }

    function performanceScore(car) {
      const accel = Math.max(0, 100 - (Number(car.acceleration0to100) || 10) * 7);
      const power = Math.min(100, (Number(car.horsepower) || 0) / 5);
      const range = car.rangeKm ? Math.min(100, car.rangeKm / 5) : Math.max(20, 100 - (Number(car.realWorldLitersPer100km) || 7) * 8);
      return (accel + power + range) / 3;
    }

    function normalizeRows(rows, field, invert = false) {
      const values = rows.map((row) => row[field]);
      const min = Math.min(...values);
      const max = Math.max(...values);
      rows.forEach((row) => {
        const raw = max === min ? 70 : (row[field] - min) / (max - min) * 100;
        row[`${field}Norm`] = invert ? 100 - raw : raw;
      });
    }

    function valueRows(chosen) {
      const ranked = M.rankCarDatabase(state.assumptions);
      const byModel = Object.fromEntries(ranked.map((row) => [row.modelId, row]));
      const rows = chosen.map((car) => {
        const financialRow = byModel[car.id] || {};
        return {
          car,
          finalMoney: Number(financialRow.finalMoney) || 0,
          totalPaid: Number(financialRow.totalPaid) || car.defaultUpfrontPrice,
          qualityBase: avgScore(car) * 10,
          specBase: performanceScore(car) / Math.max(1, car.defaultUpfrontPrice / 30000),
          lifeBase: ((car.scores.reliability || 0) + (car.scores.practicality || 0)) * 5,
        };
      });
      normalizeRows(rows, "finalMoney");
      normalizeRows(rows, "totalPaid", true);
      rows.forEach((row) => {
        row.financial = row.finalMoneyNorm * .7 + row.totalPaidNorm * .3;
        row.quality = row.qualityBase;
        row.spec = Math.min(100, row.specBase);
        row.life = row.lifeBase;
        row.valueScore = row.financial * .4 + row.quality * .25 + row.spec * .2 + row.life * .15;
      });
      return rows.sort((a, b) => b.valueScore - a.valueScore);
    }

    function pageRanking() {
      const rows = rankingRows();
      const filtered = rows.filter((row) => rankingMatches(row));
      const visible = filtered.slice(0, state.rankingLimit);
      return `<div class="page"><section class="section">
        <div class="section-head"><div><span class="eyebrow">${svgIcon("rank")} Ranking</span><h2>Rank cars</h2><p class="section-lead">${filtered.length.toLocaleString("en-IE")} matches. Rank follows the active mode.</p></div></div>
        <div class="panel" style="margin-bottom:14px">
          <div class="mode-bar">${[
            ["cheap", "Cheapest"],
            ["net", "Highest net worth"],
            ["score", "Highest score"],
            ["value", "Best value"],
          ].map(([id, label]) => `<button class="mode-button ${state.rankingMode === id ? "active" : ""}" data-ranking-mode="${id}" type="button">${escapeHtml(label)}</button>`).join("")}</div>
          <div class="toolbar" style="margin:14px 0 0">
            <input data-ranking-search type="search" placeholder="Search ranking" value="${escapeHtml(state.rankingSearch)}">
            <select data-ranking-category>${categoryList.map((cat) => `<option value="${escapeHtml(cat)}" ${cat === state.rankingCategory ? "selected" : ""}>${escapeHtml(cat)}</option>`).join("")}</select>
            <button class="button" data-ranking-more type="button">Show more</button>
          </div>
        </div>
        <div class="ranking-list">${visible.map(rankingRow).join("")}</div>
      </section></div>`;
    }

    function rankingRows() {
      if (!state.rankingRows) {
        const rows = M.rankCarDatabase(state.assumptions);
        const minNet = Math.min(...rows.map((row) => row.finalMoney));
        const maxNet = Math.max(...rows.map((row) => row.finalMoney));
        const minPaid = Math.min(...rows.map((row) => row.totalPaid));
        const maxPaid = Math.max(...rows.map((row) => row.totalPaid));
        rows.forEach((row) => {
          const car = byId[row.modelId] || {};
          row.qualityScore = row.qualityScore || avgScore(car);
          row.performanceScore = performanceScore(car);
          const net = maxNet === minNet ? 70 : (row.finalMoney - minNet) / (maxNet - minNet) * 100;
          const paid = maxPaid === minPaid ? 70 : 100 - (row.totalPaid - minPaid) / (maxPaid - minPaid) * 100;
          row.valueScore = net * .4 + row.qualityScore * 10 * .25 + row.performanceScore * .2 + paid * .15;
        });
        state.rankingRows = rows;
      }
      const sorted = state.rankingRows;
      const rows = sorted.slice().sort((a, b) => {
        if (state.rankingMode === "cheap") return a.totalPaid - b.totalPaid || a.carName.localeCompare(b.carName);
        if (state.rankingMode === "net") return b.finalMoney - a.finalMoney || a.carName.localeCompare(b.carName);
        if (state.rankingMode === "score") return b.qualityScore - a.qualityScore || a.carName.localeCompare(b.carName);
        return b.valueScore - a.valueScore || a.carName.localeCompare(b.carName);
      });
      rows.forEach((row, index) => row.activeRank = index + 1);
      state.rankingRows = rows;
      return rows;
    }

    function rankingMatches(row) {
      const car = byId[row.modelId] || {};
      if (state.rankingCategory !== "All" && (car.categoryGroup || row.categoryGroup) !== state.rankingCategory) return false;
      const terms = normalize(state.rankingSearch).split(/\s+/).filter(Boolean);
      if (!terms.length) return true;
      const haystack = car.searchText || normalize([row.carName, row.categoryGroup, car.brand, car.model, car.year].join(" "));
      return terms.every((term) => haystack.includes(term));
    }

    function rankingRow(row) {
      const car = byId[row.modelId] || {};
      return `<a class="rank-row" href="#car/${escapeHtml(row.modelId)}">
        <div class="rank-num">${row.activeRank}</div>
        <div><strong>${escapeHtml(row.carName)}</strong><p class="mini">${escapeHtml(row.categoryGroup || car.categoryGroup || "")}</p></div>
        <div class="hide-mobile">${metric("Total paid", money(row.totalPaid))}</div>
        <div class="hide-mobile">${metric("Net worth", money(row.finalMoney))}</div>
        <div class="hide-mobile">${metric("Score", `${number(row.qualityScore, 1)}/10`)}</div>
        <div>${metric("Value", number(row.valueScore, 0))}</div>
      </a>`;
    }

    function handleClick(event) {
      const target = event.target.closest("[data-home-explore],[data-view-toggle],[data-show-more-cars],[data-ranking-mode],[data-ranking-more]");
      if (!target) return;
      if (target.dataset.homeExplore !== undefined) {
        const search = document.querySelector("[data-home-search]");
        const category = document.querySelector("[data-home-category]");
        state.carSearch = search ? search.value : "";
        state.carCategory = category ? category.value : "All";
        state.carVisible = 48;
        location.hash = "#cars";
      }
      if (target.dataset.viewToggle !== undefined) {
        state.carView = state.carView === "grid" ? "compact" : "grid";
        render();
      }
      if (target.dataset.showMoreCars !== undefined) {
        state.carVisible += 48;
        render();
      }
      if (target.dataset.rankingMode) {
        state.rankingMode = target.dataset.rankingMode;
        state.rankingLimit = 80;
        render();
      }
      if (target.dataset.rankingMore !== undefined) {
        state.rankingLimit += 80;
        render();
      }
    }

    function handleInput(event) {
      const el = event.target;
      if (el.dataset.carsSearch !== undefined) {
        state.carSearch = el.value;
        state.carVisible = 48;
        render();
      }
      if (el.dataset.carsCategory !== undefined) {
        state.carCategory = el.value;
        state.carVisible = 48;
        render();
      }
      if (el.dataset.rankingSearch !== undefined) {
        state.rankingSearch = el.value;
        state.rankingLimit = 80;
        render();
      }
      if (el.dataset.rankingCategory !== undefined) {
        state.rankingCategory = el.value;
        state.rankingLimit = 80;
        render();
      }
      if (el.dataset.assumption) {
        state.assumptions[el.dataset.assumption] = Number(el.value);
        state.rankingRows = null;
        render();
      }
      if (el.dataset.finField) {
        const [key, field] = el.dataset.finField.split(":");
        state.financialCars[key] = M.markCustom(Object.assign({}, state.financialCars[key], { [field]: Number(el.value) }), field);
        render();
      }
      if (el.dataset.finMode) {
        const key = el.dataset.finMode;
        state.financialCars[key].paymentMode = el.value;
        render();
      }
      if (el.dataset.usedField) {
        const [index, field] = el.dataset.usedField.split(":");
        state.usedOffers[Number(index)][field] = Number(el.value);
        render();
      }
    }

    function handleChange(event) {
      const el = event.target;
      if (el.dataset.carInput) {
        const car = findCarByInput(el.value);
        if (!car) return;
        const [kind, a, field] = el.dataset.carInput.split(":");
        if (kind === "fin") state.financialCars[a] = M.applyCarModelDefaults(state.financialCars[a], car.id);
        if (kind === "spec") state.specIds[Number(a)] = car.id;
        if (kind === "value") state.valueIds[Number(a)] = car.id;
        if (kind === "used") state.usedOffers[Number(a)][field || "modelId"] = car.id;
        render();
      }
    }

    function render() {
      state.route = parseRoute();
      setActiveNav();
      let html = "";
      if (state.route.page === "home") html = pageHome();
      else if (state.route.page === "cars") html = pageCars();
      else if (state.route.page === "car") html = pageCarDetail(state.route.id);
      else if (state.route.page === "tools") html = pageTools();
      else if (state.route.page === "ranking") html = pageRanking();
      else html = pageHome();
      document.getElementById("app").innerHTML = html;
      window.scrollTo({ top:0, behavior:"instant" in window ? "instant" : "auto" });
    }

    document.addEventListener("click", handleClick);
    document.addEventListener("input", handleInput);
    document.addEventListener("change", handleChange);
    window.addEventListener("hashchange", render);
    fillDatalist();
    render();
  </script>
</body>
</html>
