<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Car Money Left Comparison</title>
  <style>
    :root {
      --bg:#f4f1ec;
      --panel:rgba(255,255,255,.88);
      --solid:#fffdfa;
      --ink:#171a1d;
      --muted:#65706c;
      --line:rgba(31,38,35,.13);
      --line-strong:rgba(31,38,35,.22);
      --accent:#315f52;
      --accent-soft:#e7efeb;
      --good:#14714f;
      --good-soft:#e8f4ee;
      --amber:#98610d;
      --amber-soft:#fff4dc;
      --red:#a93a32;
      --red-soft:#fff0ee;
      --shadow:0 18px 54px rgba(28,31,30,.08);
      --shadow-soft:0 9px 26px rgba(28,31,30,.06);
      --radius:20px;
      --max:1160px;
      color:var(--ink);
      background:var(--bg);
      font-family:Avenir Next, Optima, Candara, Segoe UI, sans-serif;
    }
    * { box-sizing:border-box; }
    html { background:var(--bg); scroll-behavior:smooth; }
    body {
      margin:0;
      min-width:320px;
      color:var(--ink);
      font-size:15px;
      line-height:1.45;
      background:
        radial-gradient(circle at 8% -8%, rgba(255,255,255,.96), transparent 36rem),
        radial-gradient(circle at 90% 8%, rgba(231,239,235,.9), transparent 28rem),
        linear-gradient(180deg, #fbfaf7 0%, var(--bg) 52%, #f8f5ef 100%);
    }
    body::before {
      content:"";
      position:fixed;
      inset:0;
      pointer-events:none;
      background-image:linear-gradient(rgba(23,26,29,.028) 1px, transparent 1px);
      background-size:100% 34px;
      mask-image:linear-gradient(to bottom, rgba(0,0,0,.7), transparent 430px);
    }
    header, main { width:min(var(--max), calc(100% - clamp(24px,5vw,72px))); margin:0 auto; }
    header { padding:34px 0 20px; }
    main { padding:0 0 54px; }
    h1 { margin:0; max-width:780px; font-size:clamp(34px,6vw,64px); line-height:.98; letter-spacing:-.035em; font-weight:760; }
    h2, h3, p { margin:0; }
    button, input, select { font:inherit; }
    .hero {
      display:grid;
      grid-template-columns:minmax(0,1.35fr) minmax(280px,.75fr);
      gap:22px;
      align-items:stretch;
      margin-bottom:22px;
    }
    .hero-copy, .hero-card, .panel {
      background:var(--panel);
      border:1px solid var(--line);
      box-shadow:var(--shadow-soft);
      backdrop-filter:blur(18px);
      -webkit-backdrop-filter:blur(18px);
    }
    .hero-copy {
      min-height:280px;
      border-radius:30px;
      padding:clamp(24px,4vw,42px);
      display:flex;
      flex-direction:column;
      justify-content:space-between;
    }
    .eyebrow { display:inline-flex; align-items:center; gap:8px; margin-bottom:18px; color:var(--accent); font-size:12px; font-weight:850; text-transform:uppercase; letter-spacing:.08em; }
    .hero-actions { display:flex; flex-wrap:wrap; gap:10px; margin-top:26px; }
    .button, .small-button {
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:8px;
      min-height:42px;
      padding:10px 14px;
      border-radius:999px;
      border:1px solid var(--line-strong);
      background:#fff;
      color:var(--ink);
      text-decoration:none;
      font-weight:820;
      cursor:pointer;
      transition:transform .16s ease, box-shadow .16s ease, border-color .16s ease, background .16s ease;
    }
    .button:hover, .small-button:hover { transform:translateY(-1px); box-shadow:var(--shadow-soft); border-color:rgba(49,95,82,.36); }
    .button.primary { background:var(--ink); border-color:var(--ink); color:#fff; }
    .small-button { min-height:34px; padding:7px 11px; font-size:12px; }
    .hero-card { border-radius:30px; padding:22px; display:flex; flex-direction:column; gap:14px; }
    .hero-metric { padding:16px; border-radius:17px; background:linear-gradient(180deg,#fff,#f8faf8); border:1px solid var(--line); }
    .hero-metric span { display:flex; align-items:center; gap:8px; color:var(--muted); font-size:12px; font-weight:850; text-transform:uppercase; letter-spacing:.04em; }
    .hero-metric strong { display:block; margin-top:7px; font-size:clamp(22px,3vw,34px); letter-spacing:-.025em; }
    .badge { display:inline-flex; align-items:center; gap:6px; align-self:flex-start; border-radius:999px; padding:7px 10px; background:var(--good-soft); color:var(--good); font-size:12px; font-weight:850; }
    .badge.warn { background:var(--amber-soft); color:var(--amber); }
    .badge.no { background:var(--red-soft); color:var(--red); }
    .panel { border-radius:var(--radius); padding:18px; margin-bottom:18px; overflow:hidden; animation:rise .34s ease both; }
    .panel > summary {
      display:flex;
      align-items:center;
      gap:10px;
      min-height:46px;
      list-style:none;
      cursor:pointer;
      font-size:18px;
      font-weight:850;
      margin:-4px -4px 16px;
      padding:4px;
      border-radius:14px;
      outline:none;
      transition:background .16s ease, transform .16s ease;
    }
    .panel > summary::-webkit-details-marker { display:none; }
    .panel > summary::after {
      content:"";
      width:9px;
      height:9px;
      margin-left:auto;
      border-right:2px solid var(--muted);
      border-bottom:2px solid var(--muted);
      transform:rotate(45deg);
      transition:transform .18s ease;
    }
    .panel[open] > summary::after { transform:rotate(225deg); }
    .panel > summary:hover, .help-target:hover { background:rgba(49,95,82,.06); }
    .panel > summary:hover + .help-panel { display:block; }
    .section-icon, .icon { display:inline-flex; align-items:center; justify-content:center; flex:0 0 auto; }
    .section-icon { width:32px; height:32px; border-radius:11px; background:var(--accent-soft); color:var(--accent); }
    .icon svg, .section-icon svg, [data-icon] > svg { width:18px; height:18px; stroke:currentColor; stroke-width:2; fill:none; stroke-linecap:round; stroke-linejoin:round; display:block; }
    .grid { display:grid; gap:16px; }
    .two { grid-template-columns:repeat(2,minmax(0,1fr)); }
    .controls { display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:14px; align-items:start; }
    .car-panel {
      background:linear-gradient(180deg,rgba(255,255,255,.97),rgba(253,251,247,.9));
      border:1px solid var(--line);
      border-radius:17px;
      padding:16px;
      box-shadow:0 1px 0 rgba(255,255,255,.7) inset;
    }
    .car-panel h3 { display:flex; align-items:center; gap:8px; margin-bottom:14px; font-size:16px; letter-spacing:-.01em; }
    label { display:grid; gap:6px; color:#303835; font-size:13px; font-weight:780; }
    .field-label {
      display:flex;
      align-items:center;
      gap:6px;
      color:#303835;
      font-size:13px;
      font-weight:780;
      border-radius:10px;
      padding:2px 4px;
      margin-left:-4px;
      cursor:help;
    }
    .field-row { display:grid; grid-template-columns:minmax(150px,1fr) minmax(120px,180px); gap:10px; align-items:start; margin-bottom:12px; }
    input, select {
      width:100%;
      min-height:42px;
      border:1px solid var(--line-strong);
      border-radius:12px;
      padding:10px 12px;
      background:rgba(255,255,255,.94);
      color:var(--ink);
      box-shadow:0 1px 0 rgba(255,255,255,.75) inset;
      transition:border-color .16s ease, box-shadow .16s ease, transform .16s ease, background .16s ease;
    }
    select { appearance:auto; color-scheme:light; }
    option { color:var(--ink); background:#fffdfa; }
    input:hover, select:hover { border-color:rgba(49,95,82,.34); background:#fff; }
    input:focus, select:focus, button:focus-visible, summary:focus-visible, a:focus-visible {
      outline:3px solid rgba(49,95,82,.2);
      outline-offset:2px;
      border-color:var(--accent);
      box-shadow:0 0 0 4px rgba(49,95,82,.09);
    }
    .hint { color:var(--muted); font-size:12px; line-height:1.35; font-weight:520; }
    .help-panel {
      display:none;
      margin:-4px 0 14px;
      padding:11px 13px;
      border:1px solid rgba(49,95,82,.2);
      border-radius:14px;
      background:rgba(255,255,255,.78);
      color:#45514d;
      font-size:13px;
    }
    .help-panel.show { display:block; }
    .warnings { display:grid; gap:8px; margin-bottom:14px; }
    .notice { display:flex; gap:9px; align-items:flex-start; padding:10px 12px; border-radius:14px; border:1px solid rgba(154,101,12,.25); background:var(--amber-soft); color:#5f4108; font-size:13px; }
    .notice.no { border-color:rgba(169,58,50,.24); background:var(--red-soft); color:#74241f; }
    .table-wrap { overflow-x:auto; border:1px solid var(--line); border-radius:16px; background:var(--solid); box-shadow:0 1px 0 rgba(255,255,255,.7) inset; -webkit-overflow-scrolling:touch; }
    table { width:100%; min-width:1080px; border-collapse:separate; border-spacing:0; }
    th, td { padding:12px 13px; border-bottom:1px solid var(--line); text-align:right; font-size:13px; vertical-align:top; }
    th:first-child, td:first-child { text-align:left; position:sticky; left:0; z-index:1; background:var(--solid); }
    th { background:#f0eee8; color:#3e4643; font-size:12px; font-weight:850; text-transform:uppercase; letter-spacing:.035em; white-space:nowrap; }
    th:first-child { background:#f0eee8; z-index:2; }
    tbody tr:hover td { background:#fbfaf6; }
    tbody tr:last-child td { border-bottom:0; }
    .winner { color:var(--good); font-weight:900; }
    .status-yes { color:var(--good); font-weight:900; }
    .status-warning { color:var(--amber); font-weight:900; }
    .status-no { color:var(--red); font-weight:900; }
    .mobile-card-list { display:none; }
    .meta { display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; }
    .pill { display:inline-flex; align-items:center; gap:6px; border:1px solid var(--line); border-radius:999px; padding:6px 9px; background:#fff; color:var(--muted); font-size:12px; font-weight:780; }
    .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
    @keyframes rise { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
    @media (prefers-reduced-motion:reduce) {
      *, *::before, *::after { animation-duration:.001ms !important; animation-iteration-count:1 !important; scroll-behavior:auto !important; transition-duration:.001ms !important; }
    }
    @media (max-width:980px) {
      .hero { grid-template-columns:1fr; }
      .two { grid-template-columns:1fr; }
      .field-row { grid-template-columns:1fr; }
      th:first-child, td:first-child { position:static; }
      table { min-width:960px; }
    }
    @media (max-width:680px) {
      header, main { width:min(100% - 24px, var(--max)); }
      header { padding-top:18px; }
      .hero-copy, .hero-card, .panel { border-radius:19px; }
      .hero-copy { min-height:auto; padding:22px; }
      .hero-card, .panel { padding:15px; }
      .controls { grid-template-columns:1fr; }
      .panel > summary { font-size:16px; }
      input, select { min-height:46px; font-size:16px; }
      .table-wrap { border-radius:14px; }
      table { min-width:920px; }
      th, td { padding:10px; font-size:12px; }
      .mobile-card-list { display:grid; gap:10px; margin-bottom:12px; }
      .mobile-card { border:1px solid var(--line); border-radius:16px; padding:13px; background:linear-gradient(180deg,#fff,#fbfaf6); box-shadow:var(--shadow-soft); }
      .mobile-card strong { display:block; margin-top:5px; font-size:20px; }
    }
  </style>
</head>
<body>
  <header>
    <section class="hero" aria-labelledby="pageTitle">
      <div class="hero-copy">
        <div>
          <div class="eyebrow"><span class="section-icon" data-icon="car"></span>Car money model</div>
          <h1 id="pageTitle">Which car leaves more money?</h1>
        </div>
        <div class="hero-actions">
          <a class="button primary" href="#results"><span data-icon="winner"></span>Winner</a>
          <a class="button" href="#setup"><span data-icon="budget"></span>Inputs</a>
        </div>
      </div>
      <aside class="hero-card" id="heroSummary" aria-label="Winner summary"></aside>
    </section>
  </header>

  <main>
    <details id="setup" class="panel" open>
      <summary class="help-target" data-help-key="setup"><span class="section-icon" data-icon="settings"></span>Setup</summary>
      <div class="help-panel" data-help-for="setup"></div>
      <div id="setupInputs" class="controls"></div>
    </details>

    <details id="cars" class="panel" open>
      <summary class="help-target" data-help-key="cars"><span class="section-icon" data-icon="car"></span>Cars</summary>
      <div class="help-panel" data-help-for="cars"></div>
      <div id="choiceInputs" class="grid two"></div>
    </details>

    <details id="payment" class="panel" open>
      <summary class="help-target" data-help-key="payment"><span class="section-icon" data-icon="loan"></span>Payment</summary>
      <div class="help-panel" data-help-for="payment"></div>
      <div id="financeInputs" class="grid two"></div>
    </details>

    <details id="costs" class="panel" open>
      <summary class="help-target" data-help-key="costs"><span class="section-icon" data-icon="fuel"></span>Costs</summary>
      <div class="help-panel" data-help-for="costs"></div>
      <div id="runningInputs" class="grid two"></div>
    </details>

    <details id="results" class="panel" open>
      <summary class="help-target" data-help-key="results"><span class="section-icon" data-icon="winner"></span>Results</summary>
      <div class="help-panel" data-help-for="results"></div>
      <div id="warningBox" class="warnings"></div>
      <div id="mobileResultCards" class="mobile-card-list"></div>
      <div id="primaryTable" class="table-wrap"></div>
    </details>
  </main>

  <script>
/* __MODEL_JS__ */
  </script>
  <script>
    const M = window.CarCompareModel;
    const state = {
      assumptions: structuredClone(M.DEFAULT_ASSUMPTIONS),
      cars: { car1: M.defaultCar("car1"), car2: M.defaultCar("car2") },
    };

    const HELP = {
      setup: "Initial cash is spent first. Unused cash and monthly budget are invested at a fixed 8% yearly return, compounded monthly.",
      cars: "Each option has one payment mode. Changing type updates untouched defaults only; fields you edited stay custom.",
      payment: "Upfront pays cash price now. Finance pays down payment now and monthly payments until the loan term ends.",
      costs: "Running costs are monthly energy/fuel plus annual maintenance, insurance, repairs, and tax divided by 12. Resale is estimated unless you override it.",
      results: "Final money = investment balance + resale - loan left - deficits. Highest final money wins.",
      initialCashBudget: "Cash available at month 0 before buying or financing.",
      monthlyBudget: "Each month, leftover budget after car costs is invested. If costs exceed budget, the deficit is subtracted at the end.",
      yearsOwned: "Any number of years. The simulation runs month by month for years owned x 12 months.",
      annualKm: "Used only for fuel or electricity cost. 0 km makes energy cost 0.",
      name: "Used as the option name in the hero and results.",
      type: "EV uses electricity. Hybrid and combustion use fuel. Hidden energy fields do not affect results.",
      paymentMode: "Upfront shows cash price only. Finance shows cash price, down payment, monthly payment, and months.",
      upfrontPrice: "Cash price / car value. Used for upfront payment, finance cost comparison, and default resale estimate.",
      downPayment: "Cash paid at month 0 for finance.",
      monthlyPayment: "Monthly finance payment. Finance total = down payment + monthly payment x months.",
      loanMonths: "If this is longer than years owned, loan left is subtracted from final money.",
      kwhPer100Km: "EV electricity use. Annual energy = annual km / 100 x kWh/100km x weighted electricity price.",
      litersPer100Km: "Fuel use. Annual fuel = annual km / 100 x L/100km x fuel price.",
      fuelPrice: "Used for hybrid and combustion fuel cost only.",
      homeElectricityPrice: "Home charging price per kWh. Set to 0 for free home charging.",
      publicElectricityPrice: "Public charging price per kWh.",
      homeChargingPct: "Home charging share. Home and public shares are normalized if they do not total 100.",
      publicChargingPct: "Public charging share. Home and public shares are normalized if they do not total 100.",
      annualMaintenance: "Annual maintenance estimate, divided monthly in the simulation.",
      annualInsurance: "Annual insurance estimate, divided monthly in the simulation.",
      annualRepairs: "Annual repair reserve, divided monthly in the simulation.",
      annualTax: "Annual road tax, divided monthly in the simulation.",
      resaleValue: "Estimated from cash price, vehicle type, and years owned unless marked custom.",
    };

    const ICON_PATHS = {
      budget: '<path d="M3 7h18v10H3z"/><path d="M7 7V5h10v2"/><path d="M7 12h.01M17 12h.01M12 12a2 2 0 1 0 0 .01"/>',
      car: '<path d="M5 17h14"/><path d="M6 17l1-5 3-4h4l3 4 1 5"/><path d="M8 17v1"/><path d="M16 17v1"/><path d="M8 12h8"/>',
      fuel: '<path d="M5 21V4h9v17"/><path d="M5 9h9"/><path d="M14 7h2l3 3v8a2 2 0 0 1-4 0v-5h-1"/>',
      loan: '<path d="M4 7h16v12H4z"/><path d="M4 11h16"/><path d="M8 15h4"/><path d="M16 15h.01"/>',
      winner: '<path d="M8 21h8"/><path d="M12 17v4"/><path d="M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M7 6H4a3 3 0 0 0 3 3"/><path d="M17 6h3a3 3 0 0 1-3 3"/>',
      warning: '<path d="M12 3 2.5 20h19z"/><path d="M12 9v4"/><path d="M12 17h.01"/>',
      settings: '<path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"/><path d="M19 12a7 7 0 0 0-.1-1l2-1.5-2-3.5-2.4 1a8 8 0 0 0-1.7-1L15.5 3h-4l-.3 3a8 8 0 0 0-1.7 1l-2.4-1-2 3.5 2 1.5a7 7 0 0 0 0 2l-2 1.5 2 3.5 2.4-1a8 8 0 0 0 1.7 1l.3 3h4l.3-3a8 8 0 0 0 1.7-1l2.4 1 2-3.5-2-1.5c.1-.3.1-.7.1-1z"/>',
    };

    const setupFields = [
      ["initialCashBudget", "Initial cash", 0, 300000, 100],
      ["monthlyBudget", "Monthly budget", 0, 5000, 10],
      ["yearsOwned", "Years owned", 1, 40, 1],
      ["annualKm", "Annual km", 0, 100000, 1000],
    ];
    const paymentFields = {
      upfront: [["upfrontPrice", "Upfront price", 100]],
      finance: [["upfrontPrice", "Cash price / car value", 100], ["downPayment", "Down payment", 100], ["monthlyPayment", "Monthly payment", 1], ["loanMonths", "Months", 1]],
    };
    const costFields = {
      ev: [["kwhPer100Km", "kWh/100km", 0.1], ["homeElectricityPrice", "Home €/kWh", 0.01], ["publicElectricityPrice", "Public €/kWh", 0.01], ["homeChargingPct", "Home %", 5], ["publicChargingPct", "Public %", 5]],
      hybrid: [["litersPer100Km", "L/100km", 0.1], ["fuelPrice", "Fuel €/L", 0.01]],
      combustion: [["litersPer100Km", "L/100km", 0.1], ["fuelPrice", "Fuel €/L", 0.01]],
    };
    const commonCostFields = [["annualMaintenance", "Maintenance/year", 50], ["annualInsurance", "Insurance/year", 50], ["annualRepairs", "Repairs/year", 50], ["annualTax", "Tax/year", 25], ["resaleValue", "Resale after years", 100]];

    function euro(value) {
      return new Intl.NumberFormat("en-IE", { style:"currency", currency:"EUR", maximumFractionDigits:0 }).format(finite(value));
    }
    function finite(value) { return Number.isFinite(Number(value)) ? Number(value) : 0; }
    function number(value, digits = 1) { return finite(value).toLocaleString("en-IE", { maximumFractionDigits:digits }); }
    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, (char) => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[char]));
    }
    function icon(name) {
      return `<span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24">${ICON_PATHS[name] || ICON_PATHS.car}</svg></span>`;
    }
    function iconOnly(name) {
      return `<svg viewBox="0 0 24 24" aria-hidden="true">${ICON_PATHS[name] || ICON_PATHS.car}</svg>`;
    }
    function renderStaticIcons() {
      if (!document.querySelectorAll) return;
      document.querySelectorAll("[data-icon]").forEach((node) => { node.innerHTML = iconOnly(node.dataset.icon); });
    }
    function helpText(key) { return HELP[key] || ""; }
    function helpAttrs(key) {
      const text = helpText(key);
      return text ? ` data-help-key="${key}" title="${escapeHtml(text)}"` : "";
    }
    function fieldLabel(carKey, field, label) {
      const id = `${carKey}-${field}`;
      return `<label class="field-label help-target" for="${id}"${helpAttrs(field)}>${escapeHtml(label)}</label>`;
    }
    function carTitle(carKey) {
      return escapeHtml(state.cars[carKey].name || "Unnamed option");
    }

    function init() {
      renderStaticIcons();
      renderHelpPanels();
      renderSetup();
      renderAllInputs();
      bindHelp();
      update();
    }

    function renderHelpPanels() {
      Object.entries(HELP).forEach(([key, text]) => {
        const panel = document.querySelector ? document.querySelector(`[data-help-for="${key}"]`) : null;
        if (panel) panel.textContent = text;
      });
    }

    function renderSetup() {
      document.getElementById("setupInputs").innerHTML = setupFields.map(([field, label, min, max, step]) => `
        <label class="help-target"${helpAttrs(field)}>${escapeHtml(label)}
          <input data-assumption="${field}" type="number" min="${min}" max="${max}" step="${step}" value="${state.assumptions[field]}">
          ${field === "yearsOwned" ? '<span class="hint">8% stock return fixed internally</span>' : ""}
        </label>
      `).join("");
      document.getElementById("setupInputs").querySelectorAll("[data-assumption]").forEach((input) => {
        input.addEventListener("input", () => {
          state.assumptions[input.dataset.assumption] = input.value === "" ? "" : Number(input.value);
          refreshAutoResale();
          renderCosts();
          update();
        });
      });
    }

    function renderAllInputs() {
      renderCars();
      renderPayment();
      renderCosts();
    }

    function carPanel(carKey, html) {
      return `<div class="car-panel"><h3>${icon("car")}${carTitle(carKey)}</h3>${html}</div>`;
    }

    function renderCars() {
      document.getElementById("choiceInputs").innerHTML = ["car1", "car2"].map((carKey) => {
        const car = state.cars[carKey];
        const html = `
          ${inputRow(carKey, "name", "Name", `<input id="${carKey}-name" data-car="${carKey}" data-field="name" type="text" value="${escapeHtml(car.name || "")}">`)}
          ${inputRow(carKey, "type", "Type", `<select id="${carKey}-type" data-car="${carKey}" data-field="type"><option value="ev" ${car.type === "ev" ? "selected" : ""}>EV</option><option value="hybrid" ${car.type === "hybrid" ? "selected" : ""}>Hybrid</option><option value="combustion" ${car.type === "combustion" ? "selected" : ""}>Combustion</option></select>`)}
          ${inputRow(carKey, "paymentMode", "Payment", `<select id="${carKey}-paymentMode" data-car="${carKey}" data-field="paymentMode"><option value="upfront" ${car.paymentMode === "upfront" ? "selected" : ""}>Upfront</option><option value="finance" ${car.paymentMode === "finance" ? "selected" : ""}>Finance</option></select>`)}
          <button class="small-button" type="button" data-reset-defaults="${carKey}">${icon("settings")}Reset type defaults</button>
        `;
        return carPanel(carKey, html);
      }).join("");
      bindCarInputs("choiceInputs");
      document.getElementById("choiceInputs").querySelectorAll("[data-reset-defaults]").forEach((button) => {
        button.addEventListener("click", () => {
          const carKey = button.dataset.resetDefaults;
          state.cars[carKey] = M.applyTypeDefaults(M.clearCustom(state.cars[carKey], M.TYPE_FIELDS), { respectCustom:false });
          refreshAutoResale();
          renderAllInputs();
          bindHelp();
          update();
        });
      });
    }

    function renderPayment() {
      document.getElementById("financeInputs").innerHTML = ["car1", "car2"].map((carKey) => {
        const car = state.cars[carKey];
        const fields = paymentFields[car.paymentMode] || paymentFields.upfront;
        const rows = fields.map(([field, label, step]) => numberInput(carKey, field, label, step)).join("");
        const finance = M.financeSummary(car);
        const meta = car.paymentMode === "finance"
          ? `<div class="meta"><span class="pill">${icon("loan")}Finance total ${euro(finance.financeTotal)}</span><span class="pill">Cost ${euro(finance.financingCost)}</span></div>`
          : "";
        return carPanel(carKey, rows + meta);
      }).join("");
      bindCarInputs("financeInputs");
    }

    function renderCosts() {
      refreshAutoResale();
      document.getElementById("runningInputs").innerHTML = ["car1", "car2"].map((carKey) => {
        const car = state.cars[carKey];
        const fields = (costFields[car.type] || costFields.combustion).concat(commonCostFields);
        const rows = fields.map(([field, label, step]) => numberInput(carKey, field, label, step)).join("");
        const source = car.resaleCustom ? "custom" : "estimated";
        return carPanel(carKey, `${rows}<div class="meta"><span class="pill">${icon("fuel")}Resale ${source}</span></div>`);
      }).join("");
      bindCarInputs("runningInputs");
    }

    function refreshAutoResale() {
      ["car1", "car2"].forEach((carKey) => {
        const car = state.cars[carKey];
        if (!car.resaleCustom) car.resaleValue = M.estimatedResaleValue(car, state.assumptions.yearsOwned);
      });
    }

    function numberInput(carKey, field, label, step) {
      return inputRow(carKey, field, label, `<input id="${carKey}-${field}" data-car="${carKey}" data-field="${field}" type="number" step="${step}" value="${state.cars[carKey][field] ?? ""}">`);
    }

    function inputRow(carKey, field, label, control) {
      return `<div class="field-row">${fieldLabel(carKey, field, label)}<div>${control}</div></div>`;
    }

    function bindCarInputs(rootId) {
      document.getElementById(rootId).querySelectorAll("[data-car]").forEach((input) => {
        input.addEventListener("input", () => {
          const carKey = input.dataset.car;
          const car = state.cars[carKey];
          const field = input.dataset.field;
          if (input.tagName === "SELECT" || input.type === "text") {
            car[field] = input.value;
            if (field === "type") {
              state.cars[carKey] = M.applyTypeDefaults(car, { respectCustom:true });
              refreshAutoResale();
              renderAllInputs();
              bindHelp();
            } else if (field === "paymentMode") {
              renderPayment();
              bindHelp();
            } else {
              renderCars();
              bindHelp();
            }
          } else {
            car[field] = input.value === "" ? "" : Number(input.value);
            if (field === "resaleValue") car.resaleCustom = true;
            else M.markCustom(car, field);
            if (field === "upfrontPrice" && !car.resaleCustom) refreshAutoResale();
            if (["upfrontPrice", "downPayment", "monthlyPayment", "loanMonths"].includes(field)) renderPayment();
            if (field === "upfrontPrice" || field === "resaleValue") renderCosts();
            bindHelp();
          }
          update();
        });
      });
    }

    function bindHelp() {
      if (!document.querySelectorAll) return;
      document.querySelectorAll(".help-target").forEach((node) => {
        if (node.dataset.helpBound) return;
        node.dataset.helpBound = "1";
        node.addEventListener("click", (event) => {
          const key = node.dataset.helpKey;
          if (!key) return;
          const local = document.querySelector(`[data-help-for="${key}"]`);
          if (local) {
            if (node.tagName === "SUMMARY") {
              setTimeout(() => {
                if (node.parentElement && node.parentElement.open) local.classList.add("show");
              }, 0);
            } else {
              local.classList.toggle("show");
            }
            return;
          }
          const existing = document.getElementById("floatingHelp");
          if (existing) existing.remove();
          const bubble = document.createElement("div");
          bubble.id = "floatingHelp";
          bubble.className = "help-panel show";
          bubble.textContent = helpText(key);
          node.parentNode.appendChild(bubble);
          event.preventDefault();
        });
      });
    }

    function update() {
      refreshAutoResale();
      const result = M.analyze(state);
      renderHero(result);
      renderWarnings(result);
      renderMobileResults(result);
      renderTable(result);
    }

    function renderHero(result) {
      const winner = result.winner;
      const runnerUp = result.runnerUp;
      const status = result.warnings.some((w) => w.severity === "no") ? "no" : (result.warnings.length ? "warn" : "");
      document.getElementById("heroSummary").innerHTML = winner ? `
        <span class="badge ${status}">${icon(status === "no" ? "warning" : "winner")}${status === "no" ? "Check inputs" : status ? "Warnings" : "Clean run"}</span>
        <div class="hero-metric"><span>${icon("winner")}Winner</span><strong>${escapeHtml(winner.option)}</strong></div>
        <div class="hero-metric"><span>${icon("budget")}Final money</span><strong>${euro(winner.finalMoney)}</strong></div>
        <div class="hero-metric"><span>${icon("car")}Difference</span><strong>${runnerUp ? `+${euro(result.difference)} vs ${escapeHtml(runnerUp.option)}` : euro(0)}</strong></div>
      ` : "";
    }

    function renderWarnings(result) {
      const warnings = result.warnings;
      document.getElementById("warningBox").innerHTML = warnings.length ? warnings.map((item) => `
        <div class="notice ${item.severity === "no" ? "no" : ""}">${icon("warning")}<span><strong>${escapeHtml(item.option || "Option")}:</strong> ${escapeHtml(item.message)}</span></div>
      `).join("") : "";
    }

    function renderMobileResults(result) {
      document.getElementById("mobileResultCards").innerHTML = result.rows.map((row) => `
        <article class="mobile-card">
          <span class="status-${row.possible.toLowerCase()}">${escapeHtml(row.possible)}</span>
          <strong class="${row.isWinner ? "winner" : ""}">${escapeHtml(row.option)}</strong>
          <p>${euro(row.finalMoney)} final</p>
          <p class="hint">${escapeHtml(row.summary)}</p>
        </article>
      `).join("");
    }

    function renderTable(result) {
      document.getElementById("primaryTable").innerHTML = `<table><thead><tr>
        <th>Option</th>
        <th>Possible?</th>
        <th>Car paid</th>
        <th>Extra/month</th>
        <th>Extra total</th>
        <th>Total paid</th>
        <th>Invested result</th>
        <th>Resale</th>
        <th>Loan left</th>
        <th>Final money</th>
        <th>Summary</th>
      </tr></thead><tbody>${result.rows.map((row) => `
        <tr>
          <td><strong class="${row.isWinner ? "winner" : ""}">${escapeHtml(row.option)}</strong></td>
          <td class="status-${row.possible.toLowerCase()}">${escapeHtml(row.possible)}</td>
          <td>${euro(row.carPaidDisplay)}<br><span class="hint">${escapeHtml(row.carPaidNote)}</span></td>
          <td>${euro(row.extraMonth)}</td>
          <td>${euro(row.extraTotal)}</td>
          <td>${euro(row.totalPaid)}</td>
          <td>${euro(row.investedResult)}</td>
          <td>${euro(row.resaleValue)}<br><span class="hint">${escapeHtml(row.resaleSource)}</span></td>
          <td>${euro(row.loanLeft)}</td>
          <td class="${row.isWinner ? "winner" : ""}">${euro(row.finalMoney)}</td>
          <td>${escapeHtml(row.summary)}</td>
        </tr>
      `).join("")}</tbody></table>`;
    }

    init();
  </script>
</body>
</html>
