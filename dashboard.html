<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Car Money Left Comparison</title>
  <style>
    :root {
      --bg:#f4f1ec;
      --panel:rgba(255,255,255,.88);
      --solid:#fffdfa;
      --ink:#171a1d;
      --muted:#65706c;
      --line:rgba(31,38,35,.13);
      --line-strong:rgba(31,38,35,.22);
      --accent:#315f52;
      --accent-soft:#e7efeb;
      --good:#14714f;
      --good-soft:#e8f4ee;
      --amber:#98610d;
      --amber-soft:#fff4dc;
      --red:#a93a32;
      --red-soft:#fff0ee;
      --shadow:0 18px 54px rgba(28,31,30,.08);
      --shadow-soft:0 9px 26px rgba(28,31,30,.06);
      --radius:20px;
      --max:1160px;
      color:var(--ink);
      background:var(--bg);
      font-family:Avenir Next, Optima, Candara, Segoe UI, sans-serif;
    }
    * { box-sizing:border-box; }
    html { background:var(--bg); scroll-behavior:smooth; }
    body {
      margin:0;
      min-width:320px;
      color:var(--ink);
      font-size:15px;
      line-height:1.45;
      background:
        radial-gradient(circle at 8% -8%, rgba(255,255,255,.96), transparent 36rem),
        radial-gradient(circle at 90% 8%, rgba(231,239,235,.9), transparent 28rem),
        linear-gradient(180deg, #fbfaf7 0%, var(--bg) 52%, #f8f5ef 100%);
    }
    body::before {
      content:"";
      position:fixed;
      inset:0;
      pointer-events:none;
      background-image:linear-gradient(rgba(23,26,29,.028) 1px, transparent 1px);
      background-size:100% 34px;
      mask-image:linear-gradient(to bottom, rgba(0,0,0,.7), transparent 430px);
    }
    header, main { width:min(var(--max), calc(100% - clamp(24px,5vw,72px))); margin:0 auto; }
    header { padding:34px 0 20px; }
    main { padding:0 0 54px; }
    h1 { margin:0; max-width:780px; font-size:clamp(34px,6vw,64px); line-height:.98; letter-spacing:-.035em; font-weight:760; }
    h2, h3, p { margin:0; }
    button, input, select { font:inherit; }
    .hero {
      display:grid;
      grid-template-columns:minmax(0,1.35fr) minmax(280px,.75fr);
      gap:22px;
      align-items:stretch;
      margin-bottom:22px;
    }
    .hero-copy, .hero-card, .panel {
      background:var(--panel);
      border:1px solid var(--line);
      box-shadow:var(--shadow-soft);
      backdrop-filter:blur(18px);
      -webkit-backdrop-filter:blur(18px);
    }
    .hero-copy {
      min-height:280px;
      border-radius:30px;
      padding:clamp(24px,4vw,42px);
      display:flex;
      flex-direction:column;
      justify-content:space-between;
    }
    .eyebrow { display:inline-flex; align-items:center; gap:8px; margin-bottom:18px; color:var(--accent); font-size:12px; font-weight:850; text-transform:uppercase; letter-spacing:.08em; }
    .hero-actions { display:flex; flex-wrap:wrap; gap:10px; margin-top:26px; }
    .button, .small-button {
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:8px;
      min-height:42px;
      padding:10px 14px;
      border-radius:999px;
      border:1px solid var(--line-strong);
      background:#fff;
      color:var(--ink);
      text-decoration:none;
      font-weight:820;
      cursor:pointer;
      transition:transform .16s ease, box-shadow .16s ease, border-color .16s ease, background .16s ease;
    }
    .button:hover, .small-button:hover { transform:translateY(-1px); box-shadow:var(--shadow-soft); border-color:rgba(49,95,82,.36); }
    .button.primary { background:var(--ink); border-color:var(--ink); color:#fff; }
    .small-button { min-height:34px; padding:7px 11px; font-size:12px; }
    .hero-card { border-radius:30px; padding:22px; display:flex; flex-direction:column; gap:14px; }
    .hero-metric {
      padding:16px;
      border-radius:17px;
      background:linear-gradient(180deg,rgba(255,255,255,.96),rgba(248,250,248,.86));
      border:1px solid var(--line);
      backdrop-filter:blur(14px);
      -webkit-backdrop-filter:blur(14px);
      transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease, background .18s ease;
    }
    .hero-metric:hover { transform:translateY(-2px); box-shadow:var(--shadow-soft); border-color:rgba(49,95,82,.28); }
    .hero-metric.flow { animation:softFlow .42s ease both; }
    .hero-metric span { display:flex; align-items:center; gap:8px; color:var(--muted); font-size:12px; font-weight:850; text-transform:uppercase; letter-spacing:.04em; }
    .hero-metric strong { display:block; margin-top:7px; font-size:clamp(22px,3vw,34px); letter-spacing:-.025em; transition:opacity .18s ease, transform .18s ease; }
    .badge { display:inline-flex; align-items:center; gap:6px; align-self:flex-start; border-radius:999px; padding:7px 10px; background:var(--good-soft); color:var(--good); font-size:12px; font-weight:850; }
    .badge.warn { background:var(--amber-soft); color:var(--amber); }
    .badge.no { background:var(--red-soft); color:var(--red); }
    .panel { border-radius:var(--radius); padding:18px; margin-bottom:18px; overflow:hidden; animation:rise .34s ease both; transition:box-shadow .2s ease, transform .2s ease, border-color .2s ease; }
    .panel:hover, .car-panel:hover { transform:translateY(-1px); box-shadow:var(--shadow-soft); border-color:rgba(49,95,82,.24); }
    .panel > summary {
      display:flex;
      align-items:center;
      gap:10px;
      min-height:46px;
      list-style:none;
      cursor:pointer;
      font-size:18px;
      font-weight:850;
      margin:-4px -4px 16px;
      padding:4px;
      border-radius:14px;
      outline:none;
      transition:background .16s ease, transform .16s ease;
    }
    .panel > summary::-webkit-details-marker { display:none; }
    .panel > summary::after {
      content:"";
      width:9px;
      height:9px;
      margin-left:auto;
      border-right:2px solid var(--muted);
      border-bottom:2px solid var(--muted);
      transform:rotate(45deg);
      transition:transform .18s ease;
    }
    .panel[open] > summary::after { transform:rotate(225deg); }
    .panel > summary:hover, .help-target:hover { background:rgba(49,95,82,.06); }
    .section-icon, .icon { display:inline-flex; align-items:center; justify-content:center; flex:0 0 auto; }
    .section-icon { width:32px; height:32px; border-radius:11px; background:var(--accent-soft); color:var(--accent); }
    .icon svg, .section-icon svg, [data-icon] > svg { width:18px; height:18px; stroke:currentColor; stroke-width:2; fill:none; stroke-linecap:round; stroke-linejoin:round; display:block; }
    .grid { display:grid; gap:16px; }
    .two { grid-template-columns:repeat(2,minmax(0,1fr)); }
    .controls { display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:14px; align-items:start; }
    .car-panel {
      background:linear-gradient(180deg,rgba(255,255,255,.97),rgba(253,251,247,.9));
      border:1px solid var(--line);
      border-radius:17px;
      padding:16px;
      box-shadow:0 1px 0 rgba(255,255,255,.7) inset;
      transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease, background .18s ease;
    }
    .car-panel h3 { display:flex; align-items:center; gap:8px; margin-bottom:14px; font-size:16px; letter-spacing:-.01em; }
    label { display:grid; gap:6px; color:#303835; font-size:13px; font-weight:780; }
    .field-label {
      display:flex;
      align-items:center;
      gap:6px;
      color:#303835;
      font-size:13px;
      font-weight:780;
      border-radius:10px;
      padding:2px 4px;
      margin-left:-4px;
      cursor:help;
    }
    .field-row { display:grid; grid-template-columns:minmax(150px,1fr) minmax(120px,180px); gap:10px; align-items:start; margin-bottom:12px; }
    .field-copy, .setup-field { display:grid; gap:7px; align-content:start; }
    input, select {
      width:100%;
      min-height:42px;
      border:1px solid var(--line-strong);
      border-radius:12px;
      padding:10px 12px;
      background:rgba(255,255,255,.94);
      color:var(--ink);
      box-shadow:0 1px 0 rgba(255,255,255,.75) inset;
      transition:border-color .16s ease, box-shadow .16s ease, transform .16s ease, background .16s ease;
    }
    select { appearance:auto; color-scheme:light; }
    option { color:var(--ink); background:#fffdfa; }
    input:hover, select:hover { border-color:rgba(49,95,82,.34); background:#fff; }
    input:focus, select:focus, button:focus-visible, summary:focus-visible, a:focus-visible {
      outline:3px solid rgba(49,95,82,.2);
      outline-offset:2px;
      border-color:var(--accent);
      box-shadow:0 0 0 4px rgba(49,95,82,.09);
    }
    .hint { color:var(--muted); font-size:12px; line-height:1.35; font-weight:520; }
    .help-bubble {
      position:fixed;
      z-index:20;
      width:min(260px,calc(100vw - 28px));
      padding:10px 12px;
      border:1px solid rgba(49,95,82,.18);
      border-radius:12px;
      background:rgba(255,253,250,.98);
      box-shadow:var(--shadow-soft);
      color:#45514d;
      font-size:12px;
      line-height:1.35;
      opacity:0;
      pointer-events:none;
      transform:translateY(4px);
      transition:opacity .14s ease, transform .14s ease;
    }
    .help-bubble.show { opacity:1; transform:translateY(0); pointer-events:auto; }
    .warnings { display:grid; gap:7px; margin:0 0 18px; }
    .notice {
      display:flex;
      gap:8px;
      align-items:center;
      min-height:32px;
      padding:6px 2px 7px;
      border-top:1px solid rgba(152,97,13,.28);
      color:#704b0a;
      font-size:12px;
      font-weight:720;
    }
    .notice.no { border-top-color:rgba(169,58,50,.28); color:#7c2b25; }
    .table-wrap { overflow-x:auto; border:1px solid var(--line); border-radius:16px; background:var(--solid); box-shadow:0 1px 0 rgba(255,255,255,.7) inset; -webkit-overflow-scrolling:touch; }
    table { width:100%; min-width:860px; border-collapse:separate; border-spacing:0; }
    th, td { padding:12px 13px; border-bottom:1px solid var(--line); text-align:right; font-size:13px; vertical-align:top; }
    th:first-child, td:first-child { text-align:left; position:sticky; left:0; z-index:1; background:var(--solid); }
    th { background:#f0eee8; color:#3e4643; font-size:12px; font-weight:850; text-transform:uppercase; letter-spacing:.035em; white-space:nowrap; }
    th:first-child { background:#f0eee8; z-index:2; }
    tbody tr:hover td { background:#fbfaf6; }
    tbody tr:last-child td { border-bottom:0; }
    .winner { color:var(--good); font-weight:900; }
    .status-yes { color:var(--good); font-weight:900; }
    .status-warning { color:var(--amber); font-weight:900; }
    .status-no { color:var(--red); font-weight:900; }
    .mobile-card-list { display:none; }
    .meta, .chip-row { display:flex; flex-wrap:wrap; gap:6px; }
    .meta { margin-top:10px; }
    .pill {
      display:inline-flex;
      align-items:center;
      gap:5px;
      min-height:24px;
      border:1px solid var(--line);
      border-radius:999px;
      padding:4px 8px;
      background:#fff;
      color:var(--muted);
      font-size:11px;
      font-weight:780;
      line-height:1;
      white-space:nowrap;
    }
    .pill.warn { border-color:rgba(152,97,13,.22); background:var(--amber-soft); color:var(--amber); }
    .pill.no { border-color:rgba(169,58,50,.2); background:var(--red-soft); color:var(--red); }
    .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
    @keyframes rise { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
    @keyframes softFlow {
      from { opacity:.64; transform:translateY(4px) scale(.992); }
      to { opacity:1; transform:translateY(0) scale(1); }
    }
    @media (prefers-reduced-motion:reduce) {
      *, *::before, *::after { animation-duration:.001ms !important; animation-iteration-count:1 !important; scroll-behavior:auto !important; transition-duration:.001ms !important; }
    }
    @media (max-width:980px) {
      .hero { grid-template-columns:1fr; }
      .two { grid-template-columns:1fr; }
      .field-row { grid-template-columns:1fr; }
      th:first-child, td:first-child { position:static; }
      table { min-width:820px; }
    }
    @media (max-width:680px) {
      header, main { width:min(100% - 24px, var(--max)); }
      header { padding-top:18px; }
      .hero-copy, .hero-card, .panel { border-radius:19px; }
      .hero-copy { min-height:auto; padding:22px; }
      .hero-card, .panel { padding:15px; }
      .controls { grid-template-columns:1fr; }
      .panel > summary { font-size:16px; }
      input, select { min-height:46px; font-size:16px; }
      .table-wrap { border-radius:14px; }
      table { min-width:780px; }
      th, td { padding:10px; font-size:12px; }
      .mobile-card-list { display:grid; gap:10px; margin-bottom:12px; }
      .mobile-card { border:1px solid var(--line); border-radius:16px; padding:13px; background:linear-gradient(180deg,#fff,#fbfaf6); box-shadow:var(--shadow-soft); }
      .mobile-card strong { display:block; margin-top:5px; font-size:20px; }
    }
  </style>
</head>
<body>
  <header>
    <section class="hero" aria-labelledby="pageTitle">
      <div class="hero-copy">
        <div>
          <div class="eyebrow"><span class="section-icon" data-icon="car"></span>Car money model</div>
          <h1 id="pageTitle">Which car leaves more money?</h1>
        </div>
        <div class="hero-actions">
          <a class="button primary" href="#results"><span data-icon="winner"></span>Winner</a>
          <a class="button" href="#setup"><span data-icon="budget"></span>Inputs</a>
        </div>
      </div>
      <aside class="hero-card" id="heroSummary" aria-label="Winner summary"></aside>
    </section>
  </header>

  <main>
    <div id="warningBox" class="warnings" aria-live="polite"></div>

    <details id="setup" class="panel" open>
      <summary class="help-target" data-help-key="setup"><span class="section-icon" data-icon="settings"></span>Setup</summary>
      <div id="setupInputs" class="controls"></div>
    </details>

    <details id="cars" class="panel" open>
      <summary class="help-target" data-help-key="cars"><span class="section-icon" data-icon="car"></span>Cars</summary>
      <div id="choiceInputs" class="grid two"></div>
    </details>

    <details id="payment" class="panel" open>
      <summary class="help-target" data-help-key="payment"><span class="section-icon" data-icon="loan"></span>Payment</summary>
      <div id="financeInputs" class="grid two"></div>
    </details>

    <details id="costs" class="panel" open>
      <summary class="help-target" data-help-key="costs"><span class="section-icon" data-icon="fuel"></span>Costs</summary>
      <div id="runningInputs" class="grid two"></div>
    </details>

    <details id="results" class="panel" open>
      <summary class="help-target" data-help-key="results"><span class="section-icon" data-icon="winner"></span>Results</summary>
      <div id="mobileResultCards" class="mobile-card-list"></div>
      <div id="primaryTable" class="table-wrap"></div>
    </details>
  </main>

  <script>
(function initCarMoneyModel(root, factory) {
  const api = factory();
  if (typeof module !== "undefined" && module.exports) module.exports = api;
  root.CarCompareModel = api;
})(typeof globalThis !== "undefined" ? globalThis : this, function buildModel() {
  "use strict";

  const STOCK_RETURN = 8;
  const PAYMENT_MODES = { upfront: "upfront", finance: "finance" };
  const VEHICLE_TYPES = { ev: "EV", hybrid: "Hybrid", combustion: "Combustion" };

  const DEFAULT_ASSUMPTIONS = {
    initialCashBudget: 20000,
    monthlyBudget: 300,
    yearsOwned: 7,
    annualKm: 15000,
  };

  const TYPE_DEFAULTS = {
    ev: {
      type: "ev",
      upfrontPrice: 20000,
      downPayment: 5000,
      monthlyPayment: 325,
      loanMonths: 84,
      // Conservative Portugal-like defaults: used Model 3 real use above WLTP, mostly home charging.
      kwhPer100Km: 15.8,
      litersPer100Km: 0,
      fuelPrice: 1.75,
      homeElectricityPrice: 0.20,
      publicElectricityPrice: 0.48,
      homeChargingPct: 85,
      publicChargingPct: 15,
      annualMaintenance: 380,
      annualInsurance: 650,
      annualRepairs: 450,
      annualTax: 0,
    },
    hybrid: {
      type: "hybrid",
      upfrontPrice: 22000,
      downPayment: 4000,
      monthlyPayment: 285,
      loanMonths: 72,
      kwhPer100Km: 0,
      // Toyota Corolla-like non-plug-in hybrid, adjusted above WLTP for mixed real use.
      litersPer100Km: 4.9,
      fuelPrice: 1.75,
      homeElectricityPrice: 0.18,
      publicElectricityPrice: 0.45,
      homeChargingPct: 0,
      publicChargingPct: 0,
      annualMaintenance: 520,
      annualInsurance: 560,
      annualRepairs: 520,
      annualTax: 110,
    },
    combustion: {
      type: "combustion",
      upfrontPrice: 10000,
      downPayment: 3000,
      monthlyPayment: 245,
      loanMonths: 60,
      kwhPer100Km: 0,
      // Used compact petrol/diesel blend for Portugal-like mixed driving at 15,000 km/year.
      litersPer100Km: 6.2,
      fuelPrice: 1.75,
      homeElectricityPrice: 0.18,
      publicElectricityPrice: 0.45,
      homeChargingPct: 0,
      publicChargingPct: 0,
      annualMaintenance: 650,
      annualInsurance: 500,
      annualRepairs: 760,
      annualTax: 170,
    },
  };

  const DEFAULT_CARS = {
    car1: Object.assign({ name: "Used Tesla", paymentMode: PAYMENT_MODES.upfront }, TYPE_DEFAULTS.ev),
    car2: Object.assign({ name: "Used Combustion", paymentMode: PAYMENT_MODES.upfront }, TYPE_DEFAULTS.combustion),
  };

  const TYPE_FIELDS = [
    "upfrontPrice",
    "downPayment",
    "monthlyPayment",
    "loanMonths",
    "kwhPer100Km",
    "litersPer100Km",
    "fuelPrice",
    "homeElectricityPrice",
    "publicElectricityPrice",
    "homeChargingPct",
    "publicChargingPct",
    "annualMaintenance",
    "annualInsurance",
    "annualRepairs",
    "annualTax",
  ];

  function clone(value) {
    return JSON.parse(JSON.stringify(value));
  }

  function num(value, fallback = 0) {
    const parsed = Number(value);
    return Number.isFinite(parsed) ? parsed : fallback;
  }

  function clamp(value, min, max) {
    return Math.min(max, Math.max(min, num(value)));
  }

  function cleanType(type) {
    if (type === "electric") return "ev";
    return Object.prototype.hasOwnProperty.call(TYPE_DEFAULTS, type) ? type : "combustion";
  }

  function monthlyInvestmentRate() {
    return Math.pow(1 + STOCK_RETURN / 100, 1 / 12) - 1;
  }

  function normalizeYears(years) {
    return Math.max(1 / 12, num(years, DEFAULT_ASSUMPTIONS.yearsOwned));
  }

  function analysisMonths(years) {
    return Math.max(1, Math.round(normalizeYears(years) * 12));
  }

  function defaultCar(carKey) {
    return clone(DEFAULT_CARS[carKey] || DEFAULT_CARS.car1);
  }

  function customSet(car) {
    return new Set(Array.isArray(car && car.customFields) ? car.customFields : []);
  }

  function applyTypeDefaults(carInput, options) {
    const car = Object.assign({}, carInput || {});
    const nextType = cleanType(car.type);
    const defaults = TYPE_DEFAULTS[nextType];
    const respectCustom = !options || options.respectCustom !== false;
    const custom = customSet(car);
    TYPE_FIELDS.forEach((field) => {
      if (!respectCustom || !custom.has(field) || field === "kwhPer100Km" || field === "litersPer100Km") {
        if (!respectCustom || !custom.has(field)) car[field] = defaults[field];
      }
    });
    car.type = nextType;
    car.customFields = Array.from(custom);
    if (!car.name) car.name = VEHICLE_TYPES[nextType];
    return car;
  }

  function withCarDefaults(carInput, carKey) {
    const base = defaultCar(carKey);
    const merged = Object.assign({}, base, clone(carInput || {}));
    merged.type = cleanType(merged.type);
    merged.paymentMode = merged.paymentMode === PAYMENT_MODES.finance ? PAYMENT_MODES.finance : PAYMENT_MODES.upfront;
    merged.customFields = Array.isArray(merged.customFields) ? merged.customFields.slice() : [];
    return merged;
  }

  function markCustom(car, field) {
    const custom = customSet(car);
    custom.add(field);
    car.customFields = Array.from(custom);
    return car;
  }

  function clearCustom(car, fields) {
    const custom = customSet(car);
    fields.forEach((field) => custom.delete(field));
    car.customFields = Array.from(custom);
    return car;
  }

  function retentionRate(typeInput, yearsInput) {
    const type = cleanType(typeInput);
    const years = normalizeYears(yearsInput);
    const firstYearDrop = { ev: 0.78, hybrid: 0.82, combustion: 0.80 }[type];
    const yearlyRetention = { ev: 0.905, hybrid: 0.915, combustion: 0.90 }[type];
    if (years <= 1) return Math.min(0.92, firstYearDrop + (1 - years) * 0.08);
    return clamp(firstYearDrop * Math.pow(yearlyRetention, years - 1), 0.08, 0.92);
  }

  function estimatedResaleValue(carInput, yearsInput) {
    const car = withCarDefaults(carInput);
    return Math.round(Math.max(0, num(car.upfrontPrice) * retentionRate(car.type, yearsInput)) / 100) * 100;
  }

  function effectiveResaleValue(carInput, yearsInput) {
    const car = withCarDefaults(carInput);
    if (car.resaleCustom) return Math.max(0, num(car.resaleValue));
    return estimatedResaleValue(car, yearsInput);
  }

  function financeSummary(carInput) {
    const car = withCarDefaults(carInput);
    const months = Math.max(0, Math.round(num(car.loanMonths)));
    const monthlyPayment = Math.max(0, num(car.monthlyPayment));
    const downPayment = Math.max(0, num(car.downPayment));
    const financeTotal = downPayment + monthlyPayment * months;
    return {
      downPayment,
      monthlyPayment,
      loanMonths: months,
      financeTotal,
      financeTotalPaid: financeTotal,
      financingCost: financeTotal - num(car.upfrontPrice),
    };
  }

  function loanBalance(carInput, monthsPaidInput) {
    const car = withCarDefaults(carInput);
    const finance = financeSummary(car);
    const totalMonths = finance.loanMonths;
    if (totalMonths <= 0) return 0;
    const paidMonths = clamp(Math.round(num(monthsPaidInput)), 0, totalMonths);
    const principal = Math.max(0, finance.financeTotal - finance.downPayment);
    const owed = principal - finance.monthlyPayment * paidMonths;
    return Math.max(0, owed);
  }

  function weightedElectricityPrice(carInput) {
    const car = withCarDefaults(carInput);
    const homePct = clamp(car.homeChargingPct, 0, 100) / 100;
    const publicPct = clamp(car.publicChargingPct, 0, 100) / 100;
    const total = homePct + publicPct;
    const homeShare = total > 0 ? homePct / total : 1;
    const publicShare = total > 0 ? publicPct / total : 0;
    return homeShare * Math.max(0, num(car.homeElectricityPrice)) + publicShare * Math.max(0, num(car.publicElectricityPrice));
  }

  function annualEnergyCost(carInput, assumptionsInput) {
    const car = withCarDefaults(carInput);
    const assumptions = Object.assign({}, DEFAULT_ASSUMPTIONS, assumptionsInput || {});
    const km = Math.max(0, num(assumptions.annualKm));
    if (car.type === "ev") return km / 100 * Math.max(0, num(car.kwhPer100Km)) * weightedElectricityPrice(car);
    return km / 100 * Math.max(0, num(car.litersPer100Km)) * Math.max(0, num(car.fuelPrice));
  }

  function annualRunningBreakdown(carInput, assumptions) {
    const car = withCarDefaults(carInput);
    const energy = annualEnergyCost(car, assumptions);
    const maintenance = Math.max(0, num(car.annualMaintenance));
    const insurance = Math.max(0, num(car.annualInsurance));
    const repairs = Math.max(0, num(car.annualRepairs));
    const tax = Math.max(0, num(car.annualTax));
    return {
      energy,
      maintenance,
      insurance,
      repairs,
      tax,
      total: energy + maintenance + insurance + repairs + tax,
    };
  }

  function scenarioLabel(row) {
    const name = String(row && row.carName ? row.carName : row && row.name ? row.name : "").trim() || "Unnamed option";
    const mode = row && row.mode === PAYMENT_MODES.finance ? "finance" : "upfront";
    return `${name} ${mode}`;
  }

  function possibleStatus(warnings) {
    if (warnings.some((warning) => warning.severity === "no")) return "No";
    if (warnings.length) return "Warning";
    return "Yes";
  }

  function shortSummary(row, winner) {
    if (row.possible === "No") return "Impossible: upfront exceeds cash";
    if (row.loanStillOwed > 0) return "Warning: loan not paid";
    if (row.budgetDeficit > 0) return "Loses: high monthly cost";
    if (winner && row.id === winner.id) {
      if (row.averageMonthlyInvested > 0 && row.resaleValue > row.upfrontPrice * 0.35) return "Strong: low cost + resale";
      return "Wins: more invested";
    }
    if (row.resaleRisk) return "Risk: resale assumption high";
    return row.averageMonthlyInvested < (winner ? winner.averageMonthlyInvested : row.averageMonthlyInvested) ? "Loses: high monthly cost" : "Loses: less invested";
  }

  function warning(id, severity, message, carKey, option) {
    return { id, severity, message, carKey, option };
  }

  function buildWarnings(row, car, assumptions, months) {
    const warnings = [];
    if (!String(car.name || "").trim()) warnings.push(warning("missing-name", "warning", "Car name is missing.", row.carKey, row.option));
    if (num(car.upfrontPrice) <= 0) warnings.push(warning("missing-price", "no", "Cash price is missing.", row.carKey, row.option));
    if (row.mode === PAYMENT_MODES.upfront && num(car.upfrontPrice) > num(assumptions.initialCashBudget)) {
      warnings.push(warning("upfront-cash", "no", "Upfront price exceeds initial cash.", row.carKey, row.option));
    }
    if (row.mode === PAYMENT_MODES.finance && num(car.downPayment) > num(assumptions.initialCashBudget)) {
      warnings.push(warning("down-cash", "no", "Down payment exceeds initial cash.", row.carKey, row.option));
    }
    if (row.maxMonthlyCarCost > num(assumptions.monthlyBudget)) {
      warnings.push(warning("monthly-budget", "warning", "Monthly cost exceeds monthly budget.", row.carKey, row.option));
    }
    if (row.mode === PAYMENT_MODES.finance && row.loanStillOwed > 0) {
      warnings.push(warning("loan-long", "warning", "Loan still active after selected years.", row.carKey, row.option));
    }
    if (row.resaleValue < 0 || !Number.isFinite(row.resaleValue)) {
      warnings.push(warning("resale-invalid", "no", "Resale value is missing or negative.", row.carKey, row.option));
    }
    if (row.resaleValue > num(car.upfrontPrice) * 0.9 && normalizeYears(assumptions.yearsOwned) >= 2) {
      warnings.push(warning("resale-high", "warning", "Resale value looks suspiciously high.", row.carKey, row.option));
    }
    return warnings;
  }

  function simulateScenario(carInput, assumptionsInput, modeInput, yearsInput, carKeyInput) {
    const assumptions = Object.assign({}, DEFAULT_ASSUMPTIONS, assumptionsInput || {});
    const years = normalizeYears(yearsInput === undefined ? assumptions.yearsOwned : yearsInput);
    const months = analysisMonths(years);
    const monthlyRate = monthlyInvestmentRate();
    const car = withCarDefaults(carInput, carKeyInput);
    const mode = modeInput === PAYMENT_MODES.finance ? PAYMENT_MODES.finance : PAYMENT_MODES.upfront;
    const finance = financeSummary(car);
    const isFinance = mode === PAYMENT_MODES.finance;
    const initialSpent = isFinance ? finance.downPayment : Math.max(0, num(car.upfrontPrice));
    let investmentBalance = Math.max(0, num(assumptions.initialCashBudget) - initialSpent);
    let totalDeficits = Math.max(0, initialSpent - num(assumptions.initialCashBudget));
    let monthlyInvestedTotal = 0;
    let carPaymentsPaid = initialSpent;
    let runningPaid = 0;
    let maxMonthlyCarCost = 0;
    const running = annualRunningBreakdown(car, assumptions);
    const monthlyRunning = running.total / 12;
    const yearly = [];

    for (let month = 1; month <= months; month += 1) {
      investmentBalance *= 1 + monthlyRate;
      const monthlyCarPayment = isFinance && month <= finance.loanMonths ? finance.monthlyPayment : 0;
      const monthlyTotalCarCost = monthlyCarPayment + monthlyRunning;
      const monthlyInvested = Math.max(0, num(assumptions.monthlyBudget) - monthlyTotalCarCost);
      const monthlyDeficit = Math.max(0, monthlyTotalCarCost - num(assumptions.monthlyBudget));
      investmentBalance += monthlyInvested;
      monthlyInvestedTotal += monthlyInvested;
      totalDeficits += monthlyDeficit;
      carPaymentsPaid += monthlyCarPayment;
      runningPaid += monthlyRunning;
      maxMonthlyCarCost = Math.max(maxMonthlyCarCost, monthlyTotalCarCost);

      if (month % 12 === 0) {
        const year = month / 12;
        const resaleAtYear = effectiveResaleValue(car, year);
        const loanAtYear = isFinance ? loanBalance(car, month) : 0;
        yearly.push({
          year,
          finalMoney: investmentBalance + resaleAtYear - loanAtYear - totalDeficits,
          investmentBalance,
          resaleValue: resaleAtYear,
          loanLeft: loanAtYear,
          totalDeficits,
          runningPaid,
          carPaymentsPaid,
        });
      }
    }

    const resaleValue = effectiveResaleValue(car, years);
    const loanStillOwed = isFinance ? loanBalance(car, months) : 0;
    const finalMoney = investmentBalance + resaleValue - loanStillOwed - totalDeficits;
    const totalRunningCost = runningPaid;
    const totalPaid = carPaymentsPaid + totalRunningCost;
    const paidByEnd = isFinance ? carPaymentsPaid : num(car.upfrontPrice);
    const row = {
      id: "",
      carKey: carKeyInput || "",
      carName: car.name,
      option: "",
      mode,
      type: car.type,
      years,
      months,
      possible: "Yes",
      warnings: [],
      upfrontPrice: num(car.upfrontPrice),
      initialSpent,
      carPaidDisplay: isFinance && finance.loanMonths > months ? paidByEnd : (isFinance ? finance.financeTotal : num(car.upfrontPrice)),
      carPaidNote: isFinance && finance.loanMonths > months ? "paid by selected year" : (isFinance ? "full finance term" : "paid upfront"),
      carMonthlyPaymentDisplay: isFinance ? finance.monthlyPayment : 0,
      carTotalDisplay: isFinance ? finance.financeTotal : num(car.upfrontPrice),
      carPaymentsPaid,
      financeTotal: finance.financeTotal,
      financingCost: isFinance ? finance.financingCost : 0,
      monthlyRunningCost: monthlyRunning,
      extraMonth: monthlyRunning,
      extraTotal: totalRunningCost,
      totalPaid,
      investedResult: investmentBalance,
      investmentBalance,
      resaleValue,
      resaleSource: car.resaleCustom ? "custom" : "estimated",
      loanLeft: loanStillOwed,
      loanStillOwed,
      finalMoney,
      finalMoneyLeft: finalMoney,
      totalDeficits,
      budgetDeficit: totalDeficits,
      averageMonthlyInvested: months > 0 ? monthlyInvestedTotal / months : 0,
      averageMonthlyCarCost: months > 0 ? (carPaymentsPaid - initialSpent + totalRunningCost) / months : 0,
      maxMonthlyCarCost,
      running,
      runningPaid,
      energyPaid: running.energy / 12 * months,
      maintenancePaid: running.maintenance / 12 * months,
      insurancePaid: running.insurance / 12 * months,
      repairsPaid: running.repairs / 12 * months,
      taxPaid: running.tax / 12 * months,
      monthlyPaymentUsed: isFinance ? finance.monthlyPayment : 0,
      finance,
      yearly,
      resaleRisk: resaleValue > num(car.upfrontPrice) * 0.9 && years >= 2,
    };
    row.option = scenarioLabel(row);
    row.warnings = buildWarnings(row, car, assumptions, months);
    row.possible = possibleStatus(row.warnings);
    row.summary = shortSummary(row, null);
    return row;
  }

  function compareRows(a, b) {
    return a.finalMoney - b.finalMoney;
  }

  function analyze(input) {
    const assumptions = Object.assign({}, DEFAULT_ASSUMPTIONS, input && input.assumptions ? input.assumptions : {});
    assumptions.yearsOwned = normalizeYears(assumptions.yearsOwned);
    const cars = {
      car1: withCarDefaults(input && input.cars && input.cars.car1, "car1"),
      car2: withCarDefaults(input && input.cars && input.cars.car2, "car2"),
    };
    Object.values(cars).forEach((car) => {
      if (!car.resaleCustom) car.resaleValue = estimatedResaleValue(car, assumptions.yearsOwned);
    });
    const rows = Object.entries(cars).map(([carKey, car]) => {
      const row = simulateScenario(car, assumptions, car.paymentMode, assumptions.yearsOwned, carKey);
      row.id = `${carKey}_${row.mode}`;
      row.option = scenarioLabel(row);
      return row;
    });
    const winner = rows.slice().sort((a, b) => compareRows(b, a))[0] || null;
    rows.forEach((row) => {
      row.isWinner = Boolean(winner && row.id === winner.id);
      row.summary = shortSummary(row, winner);
    });
    const runnerUp = winner ? rows.filter((row) => row.id !== winner.id).sort((a, b) => compareRows(b, a))[0] : null;
    const warnings = rows.flatMap((row) => row.warnings);
    return {
      assumptions,
      cars,
      rows,
      scenarios: rows,
      winner,
      runnerUp,
      difference: winner && runnerUp ? winner.finalMoney - runnerUp.finalMoney : 0,
      warnings,
      stockReturn: STOCK_RETURN,
    };
  }

  function formatEuro(value) {
    return `€${Math.round(num(value)).toLocaleString("en-IE")}`;
  }

  return {
    STOCK_RETURN,
    PAYMENT_MODES,
    VEHICLE_TYPES,
    DEFAULT_ASSUMPTIONS,
    TYPE_DEFAULTS,
    DEFAULT_CARS,
    TYPE_FIELDS,
    clone,
    num,
    defaultCar,
    applyTypeDefaults,
    markCustom,
    clearCustom,
    monthlyInvestmentRate,
    retentionRate,
    estimatedResaleValue,
    effectiveResaleValue,
    financeSummary,
    loanBalance,
    weightedElectricityPrice,
    annualEnergyCost,
    annualRunningBreakdown,
    simulateScenario,
    analyze,
    scenarioLabel,
    formatEuro,
  };
});

      const cars = result.cars || state.cars;
      const rows = Object.fromEntries((result.rows || []).map((row) => [row.carKey, row]));
      if (key === "heroWinner") return heroComparisonText("winner");
      if (key === "heroCostDiff") return heroComparisonText("cost");
      if (key === "heroNetWorthDiff") return heroComparisonText("net");
      if (key === "setup") return `You are comparing ${carName("car1", cars)} and ${carName("car2", cars)} over ${years} years with ${euro(result.assumptions.initialCashBudget)} initial cash and a ${budget}/month budget.`;
      if (key === "cars") return `${carName("car1", cars)} is ${typeLabel(cars.car1)} and ${carName("car2", cars)} is ${typeLabel(cars.car2)}. Names shown here are used everywhere in the results and help text.`;
      if (key === "payment") return `${carName("car1", cars)} is ${paymentLabel(cars.car1)} at ${euro(cars.car1.upfrontPrice)}. ${carName("car2", cars)} is ${paymentLabel(cars.car2)} at ${euro(cars.car2.upfrontPrice)}.`;
      if (key === "costs") return `${carName("car1", cars)} running cost is ${euro(rows.car1?.monthlyRunningCost || 0)}/month. ${carName("car2", cars)} running cost is ${euro(rows.car2?.monthlyRunningCost || 0)}/month at ${number(result.assumptions.annualKm, 0)} km/year.`;
      if (key === "results") return heroComparisonText("winner");
      if (key === "initialCashBudget") return `${euro(result.assumptions.initialCashBudget)} is available at the start. Upfront purchases or finance down payments are taken from this before leftover cash is invested.`;
      if (key === "monthlyBudget") return `${budget}/month is available for car payments and running costs. Anything left after those costs keeps working in the background.`;
      if (key === "yearsOwned") return `The model runs for ${years} years. Resale, loan left, total paid, and final money all update when this changes.`;
      if (key === "annualKm") return `${number(result.assumptions.annualKm, 0)} km/year drives the current electricity/fuel chips and running totals.`;
      const carField = key.match(/^(car[12])\.(.+)$/);
      if (carField) return carFieldHelp(carField[1], carField[2], cars, rows, result);
      const rowMatch = key.match(/^row\.(car[12])\.(.+)$/);
      if (rowMatch) return rowHelp(rowMatch[1], rowMatch[2], rows, result);
      return "";
    }

    function carName(carKey, cars = state.cars) {
      return String(cars[carKey]?.name || "Unnamed option").trim() || "Unnamed option";
    }

    function typeLabel(car) {
      return ({ ev:"an EV", hybrid:"a hybrid", combustion:"a combustion car" }[car?.type] || "a car");
    }

    function paymentLabel(car) {
      return car?.paymentMode === "finance"
        ? `financed with ${euro(car.downPayment)} down and ${euro(car.monthlyPayment)}/month for ${number(car.loanMonths, 0)} months`
        : `paid upfront`;
    }

    function carFieldHelp(carKey, field, cars, rows, result) {
      const car = cars[carKey];
      const row = rows[carKey];
      const name = carName(carKey, cars);
      const years = number(result.assumptions.yearsOwned, 1);
      const running = M.annualRunningBreakdown(car, result.assumptions);
      const map = {
        panel: `${name} is ${typeLabel(car)}, ${paymentLabel(car)}, and currently leaves ${euro(row?.finalMoney || 0)} after ${years} years.`,
        name: `This option is shown as ${name} in the hero, table, and all help bubbles.`,
        type: `${name} is set as ${typeLabel(car)}. Changing type updates untouched type defaults while preserving fields you edited.`,
        paymentMode: `${name} is currently ${paymentLabel(car)}.`,
        upfrontPrice: `${name} price is ${euro(car.upfrontPrice)}. This drives upfront cost, finance comparison, and resale estimate.`,
        downPayment: `${name} down payment is ${euro(car.downPayment)}.`,
        monthlyPayment: `${name} finance payment is ${euro(car.monthlyPayment)}/month while the loan is active.`,
        loanMonths: `${name} loan term is ${number(car.loanMonths, 0)} months. If it extends beyond ${years} years, loan left is subtracted from net worth.`,
        kwhPer100Km: `${name} uses ${number(car.kwhPer100Km, 1)} kWh/100 km. Current electricity cost is ${euro(running.energy / 12)}/month.`,
        litersPer100Km: `${name} uses ${number(car.litersPer100Km, 1)} L/100 km. Current fuel cost is ${euro(running.energy / 12)}/month.`,
        fuelPrice: `${name} fuel price is ${euroPrecise(car.fuelPrice)}/L. Current fuel cost is ${euro(running.energy / 12)}/month.`,
        homeElectricityPrice: `${name} home electricity is ${euroPrecise(car.homeElectricityPrice)}/kWh with ${number(car.homeChargingPct, 0)}% home charging.`,
        publicElectricityPrice: `${name} public electricity is ${euroPrecise(car.publicElectricityPrice)}/kWh with ${number(car.publicChargingPct, 0)}% public charging.`,
        homeChargingPct: `${name} currently charges ${number(car.homeChargingPct, 0)}% at home.`,
        publicChargingPct: `${name} currently charges ${number(car.publicChargingPct, 0)}% publicly.`,
        annualMaintenance: `${name} maintenance is ${euro(car.annualMaintenance)}/year.`,
        annualInsurance: `${name} insurance is ${euro(car.annualInsurance)}/year.`,
        annualRepairs: `${name} repair reserve is ${euro(car.annualRepairs)}/year.`,
        annualTax: `${name} road tax is ${euro(car.annualTax)}/year.`,
        resaleValue: `${name} resale after ${years} years is ${euro(car.resaleValue)}. Net worth includes this value.`,
      };
      return map[field] || "";
    }

    function rowHelp(carKey, field, rows, result) {
      const row = rows[carKey];
      const other = (result.rows || []).find((item) => item.carKey !== carKey);
      if (!row) return "";
      const name = row.option;
      const otherName = other?.option || "the other option";
      const map = {
        option: `${name} leaves ${euro(row.finalMoney)} after ${number(row.years, 1)} years. ${otherName} leaves ${euro(other?.finalMoney || 0)}.`,
        carMonth: `${name} car payment is ${euro(row.carMonthlyPaymentDisplay)}/month while active.`,
        carTotal: `${name} car total is ${euro(row.carTotalDisplay)}. Paid during selected years: ${euro(row.carPaymentsPaid)}.`,
        costsMonth: `${name} running costs are ${euro(row.monthlyRunningCost)}/month.`,
        costsTotal: `${name} running costs total ${euro(row.extraTotal)} over ${number(row.years, 1)} years.`,
        totalPaid: `${name} total paid during the selected years is ${euro(row.totalPaid)}.`,
        netWorth: `${name} leaves ${euro(row.finalMoney)} after resale, investments, deficits, and any loan left.`,
      };
      return map[field] || "";
    }

    function bindCarInputs(rootId) {
      document.getElementById(rootId).querySelectorAll("[data-car]").forEach((input) => {
        input.addEventListener("input", () => {
          const carKey = input.dataset.car;
          const car = state.cars[carKey];
          const field = input.dataset.field;
          if (input.tagName === "SELECT" || input.type === "text") {
            car[field] = input.value;
            if (field === "type") {
              state.cars[carKey] = M.applyTypeDefaults(car, { respectCustom:true });
              refreshAutoResale();
              renderAllInputs();
              bindHelp();
            } else if (field === "paymentMode") {
              renderPayment();
              bindHelp();
            } else {
              renderCars();
              bindHelp();
            }
          } else {
            car[field] = input.value === "" ? "" : Number(input.value);
            if (field === "resaleValue") car.resaleCustom = true;
            else M.markCustom(car, field);
            if (field === "upfrontPrice" && !car.resaleCustom) refreshAutoResale();
            if (["upfrontPrice", "downPayment", "monthlyPayment", "loanMonths"].includes(field)) renderPayment();
            if (["upfrontPrice", "resaleValue", "kwhPer100Km", "litersPer100Km", "fuelPrice", "homeElectricityPrice", "publicElectricityPrice", "homeChargingPct", "publicChargingPct", "annualMaintenance", "annualInsurance", "annualRepairs", "annualTax"].includes(field)) renderCosts();
            bindHelp();
          }
          update();
        });
      });
    }

    function bindHelp() {
      if (!document.querySelectorAll) return;
      document.querySelectorAll(".help-target").forEach((node) => {
        if (node.dataset.helpBound) return;
        node.dataset.helpBound = "1";
        const openOnHover = () => {
          if (!helpPinned) showHelp(node, false);
        };
        const closeOnLeave = () => {
          if (!helpPinned) hideHelp(true);
        };
        node.addEventListener("mouseenter", openOnHover);
        node.addEventListener("mouseover", openOnHover);
        node.addEventListener("mouseleave", closeOnLeave);
        node.addEventListener("mouseout", closeOnLeave);
        node.addEventListener("pointerdown", (event) => {
          const key = node.dataset.helpKey;
          if (!key) return;
          if (helpPinned && activeHelpKey === key) hideHelp(true);
          else showHelp(node, true);
          event.stopPropagation();
        });
      });
      if (document.body && !document.body.dataset.helpDismissBound) {
        document.body.dataset.helpDismissBound = "1";
        document.addEventListener("pointerdown", (event) => {
          const bubble = document.getElementById("floatingHelp");
          if (!bubble || !activeHelpTarget) return;
          if (bubble.contains(event.target) || activeHelpTarget.contains(event.target)) return;
          hideHelp(true);
        }, true);
        window.addEventListener("scroll", () => {
          if (activeHelpTarget) positionHelp(activeHelpTarget);
        }, { passive:true });
        window.addEventListener("resize", () => {
          if (activeHelpTarget) positionHelp(activeHelpTarget);
        });
      }
    }

    let activeHelpTarget = null;
    let activeHelpKey = "";
    let helpPinned = false;

    function showHelp(node, pinned) {
      const text = helpText(node.dataset.helpKey);
      if (!text || !document.createElement) return;
      let bubble = document.getElementById("floatingHelp");
      if (!bubble) {
        bubble = document.createElement("div");
        bubble.id = "floatingHelp";
        bubble.className = "help-bubble";
        (document.body || node.parentNode).appendChild(bubble);
      }
      activeHelpTarget = node;
      activeHelpKey = node.dataset.helpKey || "";
      helpPinned = pinned;
      bubble.textContent = text;
      positionHelp(node);
      bubble.classList.add("show");
    }

    function positionHelp(node) {
      const bubble = document.getElementById("floatingHelp");
      if (!bubble || !node.getBoundingClientRect) return;
      const rect = node.getBoundingClientRect();
      const bubbleRect = bubble.getBoundingClientRect ? bubble.getBoundingClientRect() : { width:260, height:50 };
      const margin = 12;
      const width = bubbleRect.width || 260;
      const height = bubbleRect.height || 50;
      const left = Math.min(window.innerWidth - width - margin, Math.max(margin, rect.left + rect.width / 2 - width / 2));
      const above = rect.top - height - 9;
      const top = above > margin ? above : Math.min(window.innerHeight - height - margin, rect.bottom + 9);
      bubble.style.left = `${left}px`;
      bubble.style.top = `${Math.max(margin, top)}px`;
    }

    function hideHelp(force = false) {
      if (helpPinned && !force) return;
      const bubble = document.getElementById("floatingHelp");
      if (bubble) bubble.classList.remove("show");
      activeHelpTarget = null;
      activeHelpKey = "";
      helpPinned = false;
    }

    function update() {
      refreshAutoResale();
      const result = M.analyze(state);
      latestResult = result;
      renderHero(result);
      renderWarnings(result);
      renderMobileResults(result);
      renderTable(result);
    }

    function renderHero(result) {
      const winner = result.winner;
      const runnerUp = result.runnerUp;
      document.getElementById("heroSummary").innerHTML = winner ? `
        <div class="hero-metric help-target flow" ${helpAttrs("heroWinner")}><span>${icon("winner")}Winner</span><strong>${escapeHtml(winner.option)}</strong></div>
        <div class="hero-metric help-target flow" ${helpAttrs("heroCostDiff")}><span>${icon("budget")}Cost difference</span><strong>${formatCostDifferencePct(winner, runnerUp)}</strong></div>
        <div class="hero-metric help-target flow" ${helpAttrs("heroNetWorthDiff")}><span>${icon("car")}Net worth difference</span><strong>${formatNetWorthDifferencePct(winner, runnerUp)}</strong></div>
      ` : "";
      bindHelp();
    }

    function formatPct(value) {
      return `${value >= 0 ? "+" : ""}${number(value, 1)}%`;
    }

    function percentageDifference(a, b) {
      const base = Math.abs(finite(b));
      return base > 0 ? (finite(a) - finite(b)) / base * 100 : 0;
    }

    function formatCostDifferencePct(winner, runnerUp) {
      if (!winner || !runnerUp) return "+0.0%";
      return formatPct(percentageDifference(winner.totalPaid, runnerUp.totalPaid));
    }

    function formatNetWorthDifferencePct(winner, runnerUp) {
      if (!winner || !runnerUp) return "+0.0%";
      return formatPct(percentageDifference(winner.finalMoney, runnerUp.finalMoney));
    }

    function euroDifference(a, b) {
      const diff = finite(a) - finite(b);
      const sign = diff >= 0 ? "+" : "";
      return `${sign}${euro(diff)}`;
    }

    function signedEuro(value) {
      const amount = finite(value);
      return `${amount >= 0 ? "+" : ""}${euro(amount)}`;
    }

    function heroComparisonText(topic) {
      const result = latestResult || M.analyze(state);
      const winner = result.winner;
      const other = result.runnerUp;
      if (!winner || !other) return "";
      const years = number(result.assumptions.yearsOwned, 1);
      const netDiff = winner.finalMoney - other.finalMoney;
      const paidDiff = winner.totalPaid - other.totalPaid;
      const paidDirection = paidDiff <= 0 ? "cheaper" : "more expensive";
      const base = `${winner.option} leaves ${euro(winner.finalMoney)} after ${years} years. ${other.option} leaves ${euro(other.finalMoney)}. Net worth difference: ${signedEuro(netDiff)}. Total paid: ${winner.option} ${euro(winner.totalPaid)}, ${other.option} ${euro(other.totalPaid)}. Cost difference: ${signedEuro(paidDiff)}.`;
      if (topic === "cost") return `${winner.option} is ${Math.abs(percentageDifference(winner.totalPaid, other.totalPaid)).toLocaleString("en-IE", { maximumFractionDigits:1 })}% ${paidDirection} on total paid. ${base}`;
      if (topic === "net") return `${winner.option} leaves ${formatNetWorthDifferencePct(winner, other)} more net worth than ${other.option}. ${base}`;
      return base;
    }

    function renderWarnings(result) {
      const seen = new Set();
      const warnings = result.warnings.filter((item) => {
        const key = `${item.option}-${item.message}`;
        if (seen.has(key)) return false;
        seen.add(key);
        return true;
      });
      document.getElementById("warningBox").innerHTML = warnings.length ? warnings.map((item) => `
        <div class="notice ${item.severity === "no" ? "no" : ""}">${icon("warning")}<span>${escapeHtml(item.message)}</span></div>
      `).join("") : "";
    }

    function renderMobileResults(result) {
      document.getElementById("mobileResultCards").innerHTML = result.rows.map((row) => `
        <article class="mobile-card help-target" ${helpAttrs(`row.${row.carKey}.option`)}>
          <strong class="${row.isWinner ? "winner" : ""}">${escapeHtml(row.option)}</strong>
          <p>${euro(row.finalMoney)} net worth</p>
          <div class="meta">${rowBadges(row)}</div>
        </article>
      `).join("");
    }

    function renderTable(result) {
      document.getElementById("primaryTable").innerHTML = `<table><thead><tr>
        <th>Option</th>
        <th>Car/month</th>
        <th>Car total</th>
        <th>Costs/month</th>
        <th>Costs total</th>
        <th>Total paid</th>
        <th>Net worth</th>
      </tr></thead><tbody>${result.rows.map((row) => `
        <tr>
          <td class="help-target" ${helpAttrs(`row.${row.carKey}.option`)}><strong class="${row.isWinner ? "winner" : ""}">${escapeHtml(row.option)}</strong><div class="meta">${rowBadges(row)}</div></td>
          <td class="help-target" ${helpAttrs(`row.${row.carKey}.carMonth`)}>${euro(row.carMonthlyPaymentDisplay)}/mo</td>
          <td class="help-target" ${helpAttrs(`row.${row.carKey}.carTotal`)}>${euro(row.carTotalDisplay)}${row.loanStillOwed > 0 ? `<br><span class="pill warn">loan continues</span>` : ""}</td>
          <td class="help-target" ${helpAttrs(`row.${row.carKey}.costsMonth`)}>${euro(row.monthlyRunningCost)}/mo</td>
          <td class="help-target" ${helpAttrs(`row.${row.carKey}.costsTotal`)}>${euro(row.extraTotal)}</td>
          <td class="help-target" ${helpAttrs(`row.${row.carKey}.totalPaid`)}>${euro(row.totalPaid)}</td>
          <td class="help-target ${row.isWinner ? "winner" : ""}" ${helpAttrs(`row.${row.carKey}.netWorth`)}>${euro(row.finalMoney)}</td>
        </tr>
      `).join("")}</tbody></table>`;
      bindHelp();
    }

    function rowBadges(row) {
      const badges = [];
      const warningIds = new Set(row.warnings.map((warning) => warning.id));
      if (warningIds.has("missing-name") || warningIds.has("missing-price") || warningIds.has("resale-invalid")) badges.push(chip("Missing value", "no"));
      if (warningIds.has("upfront-cash") || warningIds.has("down-cash")) badges.push(chip("Initial cash not enough", "no"));
      if (warningIds.has("monthly-budget")) badges.push(chip("Monthly budget exceeded", "warn"));
      if (warningIds.has("loan-long")) badges.push(chip("Loan continues", "warn"));
      return badges.join("");
    }

    init();
  </script>
</body>
</html>
