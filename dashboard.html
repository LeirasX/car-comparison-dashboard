<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Car Money Left Comparison</title>
  <style>
    :root {
      --bg:#f4f1ec;
      --panel:rgba(255,255,255,.88);
      --solid:#fffdfa;
      --ink:#171a1d;
      --muted:#65706c;
      --line:rgba(31,38,35,.13);
      --line-strong:rgba(31,38,35,.22);
      --accent:#315f52;
      --accent-soft:#e7efeb;
      --good:#14714f;
      --good-soft:#e8f4ee;
      --amber:#98610d;
      --amber-soft:#fff4dc;
      --red:#a93a32;
      --red-soft:#fff0ee;
      --shadow:0 18px 54px rgba(28,31,30,.08);
      --shadow-soft:0 9px 26px rgba(28,31,30,.06);
      --radius:20px;
      --max:1160px;
      color:var(--ink);
      background:var(--bg);
      font-family:Avenir Next, Optima, Candara, Segoe UI, sans-serif;
    }
    * { box-sizing:border-box; }
    html { background:var(--bg); scroll-behavior:smooth; }
    body {
      margin:0;
      min-width:320px;
      color:var(--ink);
      font-size:15px;
      line-height:1.45;
      background:
        radial-gradient(circle at 8% -8%, rgba(255,255,255,.96), transparent 36rem),
        radial-gradient(circle at 90% 8%, rgba(231,239,235,.9), transparent 28rem),
        linear-gradient(180deg, #fbfaf7 0%, var(--bg) 52%, #f8f5ef 100%);
    }
    body::before {
      content:"";
      position:fixed;
      inset:0;
      pointer-events:none;
      background-image:linear-gradient(rgba(23,26,29,.028) 1px, transparent 1px);
      background-size:100% 34px;
      mask-image:linear-gradient(to bottom, rgba(0,0,0,.7), transparent 430px);
    }
    header, main { width:min(var(--max), calc(100% - clamp(24px,5vw,72px))); margin:0 auto; }
    header { padding:34px 0 20px; }
    main { padding:0 0 54px; }
    h1 { margin:0; max-width:780px; font-size:clamp(34px,6vw,64px); line-height:.98; letter-spacing:-.035em; font-weight:760; }
    h2, h3, p { margin:0; }
    button, input, select { font:inherit; }
    .hero {
      display:grid;
      grid-template-columns:minmax(0,1.35fr) minmax(280px,.75fr);
      gap:22px;
      align-items:stretch;
      margin-bottom:22px;
    }
    .hero-copy, .hero-card, .panel {
      background:var(--panel);
      border:1px solid var(--line);
      box-shadow:var(--shadow-soft);
      backdrop-filter:blur(18px);
      -webkit-backdrop-filter:blur(18px);
    }
    .hero-copy {
      min-height:280px;
      border-radius:30px;
      padding:clamp(24px,4vw,42px);
      display:flex;
      flex-direction:column;
      justify-content:space-between;
    }
    .eyebrow { display:inline-flex; align-items:center; gap:8px; margin-bottom:18px; color:var(--accent); font-size:12px; font-weight:850; text-transform:uppercase; letter-spacing:.08em; }
    .hero-actions { display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-top:26px; }
    .button, .small-button {
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:8px;
      min-height:42px;
      padding:10px 14px;
      border-radius:999px;
      border:1px solid var(--line-strong);
      background:#fff;
      color:var(--ink);
      text-decoration:none;
      font-weight:820;
      cursor:pointer;
      transition:transform .16s ease, box-shadow .16s ease, border-color .16s ease, background .16s ease;
    }
    .button:hover, .small-button:hover { transform:translateY(-1px); box-shadow:var(--shadow-soft); border-color:rgba(49,95,82,.36); }
    .button.primary { background:var(--ink); border-color:var(--ink); color:#fff; }
    .small-button { min-height:34px; padding:7px 11px; font-size:12px; }
    .hero-card { border-radius:30px; padding:22px; display:flex; flex-direction:column; gap:14px; }
    .hero-metric {
      padding:16px;
      border-radius:17px;
      background:linear-gradient(180deg,rgba(255,255,255,.96),rgba(248,250,248,.86));
      border:1px solid var(--line);
      backdrop-filter:blur(14px);
      -webkit-backdrop-filter:blur(14px);
      transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease, background .18s ease;
    }
    .hero-metric:hover { transform:translateY(-2px); box-shadow:var(--shadow-soft); border-color:rgba(49,95,82,.28); }
    .hero-metric.flow { animation:softFlow .42s ease both; }
    .hero-metric span { display:flex; align-items:center; gap:8px; color:var(--muted); font-size:12px; font-weight:850; text-transform:uppercase; letter-spacing:.04em; }
    .hero-metric strong { display:block; margin-top:7px; font-size:clamp(22px,3vw,34px); letter-spacing:-.025em; transition:opacity .18s ease, transform .18s ease; }
    .badge { display:inline-flex; align-items:center; gap:6px; align-self:flex-start; border-radius:999px; padding:7px 10px; background:var(--good-soft); color:var(--good); font-size:12px; font-weight:850; }
    .badge.warn { background:var(--amber-soft); color:var(--amber); }
    .badge.no { background:var(--red-soft); color:var(--red); }
    .rank-toggle {
      min-height:34px;
      padding:7px 13px;
      border-radius:999px;
      border:1px solid var(--line-strong);
      background:var(--solid);
      color:var(--accent);
      font-size:12px;
      font-weight:850;
      cursor:pointer;
      margin-left:auto;
    }
    .panel { border-radius:var(--radius); padding:18px; margin-bottom:18px; overflow:hidden; animation:rise .34s ease both; transition:box-shadow .2s ease, transform .2s ease, border-color .2s ease; }
    .panel:hover, .car-panel:hover { transform:translateY(-1px); box-shadow:var(--shadow-soft); border-color:rgba(49,95,82,.24); }
    .panel > summary {
      display:flex;
      align-items:center;
      gap:10px;
      min-height:46px;
      list-style:none;
      cursor:pointer;
      font-size:18px;
      font-weight:850;
      margin:-4px -4px 16px;
      padding:4px;
      border-radius:14px;
      outline:none;
      transition:background .16s ease, transform .16s ease;
    }
    .panel > summary::-webkit-details-marker { display:none; }
    .panel > summary::after {
      content:"";
      width:9px;
      height:9px;
      margin-left:auto;
      border-right:2px solid var(--muted);
      border-bottom:2px solid var(--muted);
      transform:rotate(45deg);
      transition:transform .18s ease;
    }
    .panel[open] > summary::after { transform:rotate(225deg); }
    .panel > summary:hover, .help-target:hover { background:rgba(49,95,82,.06); }
    .section-icon, .icon { display:inline-flex; align-items:center; justify-content:center; flex:0 0 auto; }
    .section-icon { width:32px; height:32px; border-radius:11px; background:var(--accent-soft); color:var(--accent); }
    .icon svg, .section-icon svg, [data-icon] > svg { width:18px; height:18px; stroke:currentColor; stroke-width:2; fill:none; stroke-linecap:round; stroke-linejoin:round; display:block; }
    .grid { display:grid; gap:16px; }
    .two { grid-template-columns:repeat(2,minmax(0,1fr)); }
    .controls { display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:14px; align-items:start; }
    .car-panel {
      background:linear-gradient(180deg,rgba(255,255,255,.97),rgba(253,251,247,.9));
      border:1px solid var(--line);
      border-radius:17px;
      padding:16px;
      box-shadow:0 1px 0 rgba(255,255,255,.7) inset;
      transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease, background .18s ease;
    }
    .car-panel h3 { display:flex; align-items:center; gap:8px; margin-bottom:14px; font-size:16px; letter-spacing:-.01em; }
    label { display:grid; gap:6px; color:#303835; font-size:13px; font-weight:780; }
    .field-label {
      display:flex;
      align-items:center;
      gap:6px;
      color:#303835;
      font-size:13px;
      font-weight:780;
      border-radius:10px;
      padding:2px 4px;
      margin-left:-4px;
      cursor:help;
    }
    .field-row { display:grid; grid-template-columns:minmax(150px,1fr) minmax(120px,180px); gap:10px; align-items:start; margin-bottom:12px; }
    .field-copy, .setup-field { display:grid; gap:7px; align-content:start; }
    input, select {
      width:100%;
      min-height:42px;
      border:1px solid var(--line-strong);
      border-radius:12px;
      padding:10px 12px;
      background:rgba(255,255,255,.94);
      color:var(--ink);
      box-shadow:0 1px 0 rgba(255,255,255,.75) inset;
      transition:border-color .16s ease, box-shadow .16s ease, transform .16s ease, background .16s ease;
    }
    select { appearance:auto; color-scheme:light; }
    option { color:var(--ink); background:#fffdfa; }
    input:hover, select:hover { border-color:rgba(49,95,82,.34); background:#fff; }
    input:focus, select:focus, button:focus-visible, summary:focus-visible, a:focus-visible {
      outline:3px solid rgba(49,95,82,.2);
      outline-offset:2px;
      border-color:var(--accent);
      box-shadow:0 0 0 4px rgba(49,95,82,.09);
    }
    .hint { color:var(--muted); font-size:12px; line-height:1.35; font-weight:520; }
    .help-bubble {
      position:fixed;
      z-index:20;
      width:min(260px,calc(100vw - 28px));
      padding:10px 12px;
      border:1px solid rgba(49,95,82,.18);
      border-radius:12px;
      background:rgba(255,253,250,.98);
      box-shadow:var(--shadow-soft);
      color:#45514d;
      font-size:12px;
      line-height:1.35;
      opacity:0;
      pointer-events:none;
      transform:translateY(4px);
      transition:opacity .14s ease, transform .14s ease;
    }
    .help-bubble.show { opacity:1; transform:translateY(0); pointer-events:auto; }
    .warnings { display:grid; gap:7px; margin:0 0 18px; }
    .ranking-panel[hidden] { display:none; }
    .ranking-head { display:flex; align-items:flex-start; justify-content:space-between; gap:14px; margin-bottom:14px; }
    .ranking-head h2 { font-size:18px; font-weight:850; letter-spacing:-.01em; }
    .ranking-head p { margin-top:4px; color:var(--muted); font-size:12px; }
    .ranking-tools { display:flex; flex-wrap:wrap; justify-content:flex-end; gap:8px; min-width:min(360px,100%); }
    .info-block { margin-bottom:16px; }
    .info-block h3 { margin:0 0 10px; color:var(--accent); font-size:12px; font-weight:900; letter-spacing:.08em; text-transform:uppercase; }
    .offer-actions { display:flex; flex-wrap:wrap; gap:8px; justify-content:flex-end; margin-top:8px; }
    .notice {
      display:flex;
      gap:8px;
      align-items:center;
      min-height:32px;
      padding:6px 2px 7px;
      border-top:1px solid rgba(152,97,13,.28);
      color:#704b0a;
      font-size:12px;
      font-weight:720;
    }
    .notice.no { border-top-color:rgba(169,58,50,.28); color:#7c2b25; }
    .table-wrap { overflow-x:auto; border:1px solid var(--line); border-radius:16px; background:var(--solid); box-shadow:0 1px 0 rgba(255,255,255,.7) inset; -webkit-overflow-scrolling:touch; }
    table { width:100%; min-width:860px; border-collapse:separate; border-spacing:0; }
    th, td { padding:12px 13px; border-bottom:1px solid var(--line); text-align:right; font-size:13px; vertical-align:top; }
    th:first-child, td:first-child { text-align:left; position:sticky; left:0; z-index:1; background:var(--solid); }
    th { background:#f0eee8; color:#3e4643; font-size:12px; font-weight:850; text-transform:uppercase; letter-spacing:.035em; white-space:nowrap; }
    th:first-child { background:#f0eee8; z-index:2; }
    tbody tr:hover td { background:#fbfaf6; }
    tbody tr:last-child td { border-bottom:0; }
    .winner { color:var(--good); font-weight:900; }
    .status-yes { color:var(--good); font-weight:900; }
    .status-warning { color:var(--amber); font-weight:900; }
    .status-no { color:var(--red); font-weight:900; }
    .mobile-card-list { display:none; }
    .meta, .chip-row { display:flex; flex-wrap:wrap; gap:6px; }
    .meta { margin-top:10px; }
    .pill {
      display:inline-flex;
      align-items:center;
      gap:5px;
      min-height:24px;
      border:1px solid var(--line);
      border-radius:999px;
      padding:4px 8px;
      background:#fff;
      color:var(--muted);
      font-size:11px;
      font-weight:780;
      line-height:1;
      white-space:nowrap;
    }
    .pill.warn { border-color:rgba(152,97,13,.22); background:var(--amber-soft); color:var(--amber); }
    .pill.no { border-color:rgba(169,58,50,.2); background:var(--red-soft); color:var(--red); }
    .search-control { position:relative; display:block; }
    .search-control .icon {
      position:absolute;
      left:11px;
      top:50%;
      transform:translateY(-50%);
      color:var(--muted);
      pointer-events:none;
      z-index:1;
    }
    .search-control input { padding-left:38px; }
    .select-stack { display:grid; gap:8px; }
    .model-picker { position:relative; }
    .model-trigger {
      width:100%;
      min-height:42px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      border:1px solid var(--line-strong);
      border-radius:12px;
      padding:10px 12px;
      background:rgba(255,255,255,.94);
      color:var(--ink);
      text-align:left;
      font-weight:780;
      cursor:pointer;
      transition:border-color .16s ease, box-shadow .16s ease, background .16s ease;
    }
    .model-trigger:hover { border-color:rgba(49,95,82,.34); background:#fff; }
    .model-trigger::after {
      content:"";
      width:8px;
      height:8px;
      border-right:2px solid var(--muted);
      border-bottom:2px solid var(--muted);
      transform:rotate(45deg);
      transition:transform .16s ease;
      flex:0 0 auto;
    }
    .model-picker.open .model-trigger::after { transform:rotate(225deg); }
    .model-menu {
      position:absolute;
      z-index:12;
      top:calc(100% + 8px);
      left:0;
      right:0;
      display:grid;
      gap:8px;
      max-height:min(430px,70vh);
      padding:10px;
      border:1px solid var(--line);
      border-radius:16px;
      background:rgba(255,253,250,.98);
      box-shadow:var(--shadow-soft);
      overflow:auto;
    }
    .model-option {
      width:100%;
      display:grid;
      gap:2px;
      border:0;
      border-radius:12px;
      padding:10px 11px;
      background:transparent;
      color:var(--ink);
      text-align:left;
      cursor:pointer;
    }
    .model-option:hover, .model-option.selected { background:rgba(49,95,82,.08); }
    .model-option small { color:var(--muted); font-size:11px; font-weight:720; }
    .model-more { padding:4px 2px 0; color:var(--muted); font-size:12px; }
    .sort-button {
      display:inline-flex;
      align-items:center;
      justify-content:flex-end;
      width:100%;
      border:0;
      background:transparent;
      color:inherit;
      padding:0;
      font:inherit;
      font-weight:inherit;
      text-transform:inherit;
      letter-spacing:inherit;
      cursor:pointer;
    }
    th:first-child .sort-button { justify-content:flex-start; }
    .ranking-pager { display:flex; justify-content:space-between; gap:10px; padding:12px; border-top:1px solid var(--line); background:#fbfaf6; }
    .weight-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:10px; margin-bottom:14px; }
    .toast {
      position:fixed;
      left:50%;
      bottom:18px;
      z-index:30;
      transform:translate(-50%, 10px);
      min-height:34px;
      padding:8px 12px;
      border:1px solid var(--line);
      border-radius:999px;
      background:rgba(255,253,250,.98);
      color:var(--accent);
      box-shadow:var(--shadow-soft);
      font-size:12px;
      font-weight:850;
      opacity:0;
      pointer-events:none;
      transition:opacity .18s ease, transform .18s ease;
    }
    .toast.show { opacity:1; transform:translate(-50%, 0); }
    .button.is-feedback, .small-button.is-feedback, .rank-toggle.is-feedback { background:var(--good-soft); color:var(--good); border-color:rgba(20,113,79,.24); }
    .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
    @keyframes rise { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
    @keyframes softFlow {
      from { opacity:.64; transform:translateY(4px) scale(.992); }
      to { opacity:1; transform:translateY(0) scale(1); }
    }
    @media (prefers-reduced-motion:reduce) {
      *, *::before, *::after { animation-duration:.001ms !important; animation-iteration-count:1 !important; scroll-behavior:auto !important; transition-duration:.001ms !important; }
    }
    @media (max-width:980px) {
      .hero { grid-template-columns:1fr; }
      .two { grid-template-columns:1fr; }
      .field-row { grid-template-columns:1fr; }
      th:first-child, td:first-child { position:static; }
      table { min-width:820px; }
    }
    @media (max-width:680px) {
      header, main { width:min(100% - 24px, var(--max)); }
      header { padding-top:18px; }
      .hero-copy, .hero-card, .panel { border-radius:19px; }
      .hero-copy { min-height:auto; padding:22px; }
      .hero-card, .panel { padding:15px; }
      .controls { grid-template-columns:1fr; }
      .panel > summary { font-size:16px; }
      input, select { min-height:46px; font-size:16px; }
      .model-trigger { min-height:46px; font-size:16px; }
      .model-menu { position:fixed; inset:auto 12px 12px; max-height:min(72vh,560px); }
      .rank-toggle { margin-left:0; }
      .ranking-head { display:grid; }
      .ranking-tools { justify-content:stretch; min-width:0; }
      .ranking-tools .search-control { width:100%; }
      .table-wrap { border-radius:14px; }
      table { min-width:780px; }
      th, td { padding:10px; font-size:12px; }
      .mobile-card-list { display:grid; gap:10px; margin-bottom:12px; }
      .mobile-card { border:1px solid var(--line); border-radius:16px; padding:13px; background:linear-gradient(180deg,#fff,#fbfaf6); box-shadow:var(--shadow-soft); }
      .mobile-card strong { display:block; margin-top:5px; font-size:20px; }
    }
  </style>
</head>
<body>
  <header>
    <section class="hero" aria-labelledby="pageTitle">
      <div class="hero-copy">
        <div>
          <div class="eyebrow"><span class="section-icon" data-icon="car"></span>Car money model</div>
          <h1 id="pageTitle">Which car leaves more money?</h1>
        </div>
        <div class="hero-actions">
          <a class="button primary" href="#results"><span data-icon="winner"></span>Winner</a>
          <a class="button" href="#setup"><span data-icon="budget"></span>Inputs</a>
          <button class="rank-toggle" type="button" data-rank-toggle>Rank</button>
        </div>
      </div>
      <aside class="hero-card" id="heroSummary" aria-label="Winner summary"></aside>
    </section>
  </header>

  <main>
    <section id="rankingPanel" class="panel ranking-panel" hidden>
      <div class="ranking-head">
        <div>
          <h2>Ranking</h2>
          <p id="rankingSummary">Current setup.</p>
        </div>
        <div class="ranking-tools" id="rankingTools"></div>
      </div>
      <div id="rankingTable" class="table-wrap"></div>
    </section>

    <div id="warningBox" class="warnings" aria-live="polite"></div>

    <details id="setup" class="panel" open>
      <summary class="help-target" data-help-key="setup"><span class="section-icon" data-icon="settings"></span>Setup</summary>
      <div id="setupInputs" class="controls"></div>
    </details>

    <details id="cars" class="panel" open>
      <summary class="help-target" data-help-key="cars"><span class="section-icon" data-icon="car"></span>Cars</summary>
      <div id="choiceInputs" class="grid two"></div>
    </details>

    <details id="payment" class="panel" open>
      <summary class="help-target" data-help-key="payment"><span class="section-icon" data-icon="loan"></span>Offers</summary>
      <div id="financeInputs" class="grid two"></div>
    </details>

    <details id="costs" class="panel" open>
      <summary class="help-target" data-help-key="costs"><span class="section-icon" data-icon="fuel"></span>Info</summary>
      <div id="runningInputs"></div>
    </details>

    <details id="results" class="panel" open>
      <summary class="help-target" data-help-key="results"><span class="section-icon" data-icon="winner"></span>Results</summary>
      <div id="mobileResultCards" class="mobile-card-list"></div>
      <div id="primaryTable" class="table-wrap"></div>
    </details>
  </main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script>
(function initCarDatabase(root, factory) {
  const cars = factory();
  if (typeof module !== "undefined" && module.exports) module.exports = cars;
  root.CarCompareDatabase = cars;
})(typeof globalThis !== "undefined" ? globalThis : this, function buildCarDatabase() {
  "use strict";

  // Assumption basis, May 2026:
  // - Values are source-informed estimates, not scraped live listings. They use official/WLTP/EPA/spec baselines,
  //   EU real-world consumption evidence, Portugal used-market bands, and owner/reliability heuristics.
  // - Portuguese used-price sanity checks used Standvirtual/OLX/PiscaPisca/AutoScout24/AutoUncle-style market ranges.
  // - EV consumption uses WLTP/spec baselines adjusted toward EV Database/Green NCAP/owner-report mixed use.
  // - Portugal IUC is estimated from fuel type, displacement/CO2 bands, and EV exemption context; exact values vary
  //   by registration date, import status, engine, CO2, municipality, and legal changes.
  // - Insurance uses Portugal market ranges by value/class, then scales for luxury, repair complexity, theft, and performance.
  // - Maintenance/repairs are annual reserves, not guaranteed spend; older and exotic cars include age/parts availability risk.
  // - resaleRetentionEstimate is the approximate retained share after the app default 7-year ownership period.
  const SHARED_SOURCE_NOTES = {
    ev: "Official WLTP/spec baseline plus EV Database/Green NCAP/owner-report style real-world adjustment; Portugal EV IUC assumed exempt.",
    mainstream: "Official mixed-cycle baseline adjusted above brochure/WLTP using European real-world fuel-use evidence and owner reports; Portugal IUC estimated by typical trim band.",

  function generated(id, displayName, group, category, price, energyType, fuelType, kwh, liters, reliabilityBias = 0) {
    const ev = energyType === "electricity";
    const hybrid = category === "hybrid";
    const premium = group === "Premium cars" || group === "Premium EVs" || group === "Luxury cars";
    const sports = group === "Sports cars";
    const city = group === "Cheap city cars";
    const valueBand = Math.max(0, price / 10000);
    const maintenance = Math.round((ev ? 260 : city ? 380 : hybrid ? 520 : 500) + valueBand * (premium ? 130 : sports ? 115 : 42));
    const insurance = Math.round((city ? 260 : ev ? 390 : 330) + valueBand * (premium ? 145 : sports ? 120 : 45));
    const repairs = Math.round((ev ? 420 : city ? 380 : hybrid ? 460 : 500) + valueBand * (premium ? 170 : sports ? 150 : 55) - reliabilityBias * 30);
    const tax = ev ? 0 : Math.round((city ? 65 : hybrid ? 110 : 120) + valueBand * (premium ? 38 : sports ? 32 : 18));
    const first = ev ? 0.72 : hybrid ? 0.81 : premium ? 0.74 : sports ? 0.82 : 0.78;
    const annual = ev ? 0.875 : hybrid ? 0.915 : premium ? 0.89 : sports ? 0.93 : 0.90;
    const resale = Math.max(0.22, Math.min(0.52, first * Math.pow(annual, 6)));
    const source = ev ? SHARED_SOURCE_NOTES.ev : premium || sports ? SHARED_SOURCE_NOTES.luxury : SHARED_SOURCE_NOTES.mainstream;
    return extra(id, displayName, group, category, price, energyType, fuelType, kwh, liters, maintenance, insurance, repairs, tax, [first, annual, ev ? 0.09 : 0.14, `${group} estimate with conservative Portugal/EU ownership assumptions.`], Number(resale.toFixed(2)), "Generated daily-driver estimate from official/spec class baselines, European real-world adjustment, and Portugal ownership cost bands.", "medium", source);
  }

  function teslaPriorityCars() {
    const rows = [];
    const add = (modelName, trim, year, price2024, kwh, group = "Common EVs", reliabilityBias = 1) => {
      const factor = yearFactor(year) / yearFactor(2024);
      const price = roundTo(price2024 * factor, 500);
      const displayName = `Tesla ${modelName} ${trim} ${year}`;
      rows.push(generated(`tesla-${slug(modelName)}-${slug(trim)}-${year}`, displayName, group, "ev", price, "electricity", null, kwh, 0, reliabilityBias));
    };

    [2019, 2020].forEach((year) => {
      add("Model 3", "Standard Range Plus", year, 30000, 16.2);
      add("Model 3", "Long Range", year, 36000, 17.0);
      add("Model 3", "Performance", year, 41000, 18.4, "Premium EVs", 0);
    });
    [2021, 2022, 2023, 2024].forEach((year) => {
      add("Model 3", "RWD", year, 33000, year >= 2024 ? 15.5 : 16.0);
      add("Model 3", "Long Range", year, 39000, year >= 2024 ? 16.5 : 17.0);
      add("Model 3", "Performance", year, 45500, year >= 2024 ? 18.0 : 18.6, "Premium EVs", 0);
    });
    [2021, 2022, 2023, 2024].forEach((year) => {
      if (year >= 2022) add("Model Y", "RWD", year, 36000, 17.2);
      add("Model Y", "Long Range", year, 43000, 18.0);
      add("Model Y", "Performance", year, 50000, 19.2, "Premium EVs", 0);
    });
    [2016, 2018, 2020].forEach((year) => {
      add("Model S", "75D", year, 52000, 20.0, "Premium EVs", -1);
      add("Model S", "100D", year, 62000, 20.5, "Premium EVs", -1);
    });
    [2021, 2022, 2024].forEach((year) => {
      add("Model S", "Long Range", year, 72000, 19.8, "Premium EVs", 0);
      add("Model S", "Plaid", year, 88000, 21.0, "Premium EVs", -1);
    });
    [2017, 2019, 2021, 2024].forEach((year) => {
      add("Model X", year >= 2021 ? "Long Range" : "100D", year, 78000, 23.5, "Premium EVs", -1);
      if (year >= 2021) add("Model X", "Plaid", year, 95000, 24.8, "Premium EVs", -1);
    });
    return rows;
  }

  function clampNumber(value, min, max) {

  function reviewedScores(car) {
    const group = categoryGroup(car);
    const signals = brandSignals(car);
    const price = Number(car.defaultUpfrontPrice) || 0;
    const ev = car.energyType === "electricity";
    const hybrid = car.category === "hybrid";
    const supercar = car.category === "supercar";
    const luxury = car.category === "luxury" || /^Luxury/.test(group);

    const cheap = price <= 9000;

    const suvish = /SUV|Crossover|Estate|MPV|Van|Pickup|Off-road/.test(group);
    const city = group === "City car";

    let reliability = 6;
    if (signals.toyotaHonda) reliability += 2.2;
    if (signals.korean) reliability += 1.2;
    if (signals.simpleValue) reliability += 0.6;
    if (signals.germanPremium) reliability -= 0.4;
    if (signals.fragilePremium) reliability -= 1.4;
    if (oldCheap) reliability -= 1.3;
    if (supercar) reliability -= 2.0;
    if (ev && !signals.fragilePremium) reliability += 0.6;

    let comfort = 5.2 + (premium ? 2.0 : 0) + (luxury ? 1.0 : 0) + (suvish ? 0.8 : 0) + (/Sedan|Estate/.test(group) ? 0.5 : 0) - (city ? 1.2 : 0) - (oldCheap ? 0.6 : 0) - (supercar ? 1.3 : 0);
    let safety = 6.0 + (price > 25000 ? 1.0 : 0) + (price > 55000 ? 0.7 : 0) + (premium ? 0.5 : 0) + (ev ? 0.5 : 0) - (oldCheap ? 1.9 : 0) - (city && !ev ? 0.4 : 0);

    let tech = 5.0 + (ev ? 1.7 : 0) + (signals.tesla ? 1.5 : 0) + (signals.germanPremium ? 1.0 : 0) + (premium ? 0.8 : 0) - (oldCheap ? 2.2 : 0) - (/dacia-spring|smart-eq|twingo|c1|107|206|fiat-panda|fiat-punto/.test(car.id) ? 1.7 : 0);
    let driving = 5.1 + (signals.performance ? 2.2 : 0) + (premium ? 0.8 : 0) + (signals.tesla ? 1.4 : 0) - (city ? 1.0 : 0) - (/van|berlingo|rifter|combo|kangoo|caddy|citan|tourneo|jogger/.test(car.id) ? 1.3 : 0);
    if (supercar) {
      comfort = Math.max(4, comfort);
      practicality = Math.min(2, practicality);
      tech = Math.max(6, tech);
      driving = Math.max(9, driving);
    }

    return {
      reliability: Math.round(clampNumber(reliability, 2, 10)),
      comfort: Math.round(clampNumber(comfort, 2, 10)),
      safety: Math.round(clampNumber(safety, 2, 10)),
      practicality: Math.round(clampNumber(practicality, 1, 10)),

  function reviewedCosts(car) {

    if (signals.korean) repairs -= 80;

    if (Object.prototype.hasOwnProperty.call(assumptions, "electricityPrice")) return Math.max(0, num(assumptions.electricityPrice));
    return Math.max(0, num(car.electricityPrice, DEFAULT_ASSUMPTIONS.electricityPrice));
  }

  function annualEnergyCost(carInput, assumptionsInput) {
    const car = withCarDefaults(carInput);
    const assumptions = Object.assign({}, DEFAULT_ASSUMPTIONS, assumptionsInput || {});
    const km = Math.max(0, num(assumptions.annualKm));
    if (car.type === "ev") return km / 100 * Math.max(0, num(car.kwhPer100Km)) * weightedElectricityPrice(car, assumptions);
    const fuelPrice = assumptionsInput && Object.prototype.hasOwnProperty.call(assumptionsInput, "fuelPrice") ? assumptionsInput.fuelPrice : car.fuelPrice;
    return km / 100 * Math.max(0, num(car.litersPer100Km)) * Math.max(0, num(fuelPrice));
  }

  function annualRunningBreakdown(carInput, assumptions) {
    const car = withCarDefaults(carInput);
    const energy = annualEnergyCost(car, assumptions);
    const maintenance = Math.max(0, num(car.annualMaintenance));
    const insurance = Math.max(0, num(car.annualInsurance));
    const repairs = Math.max(0, num(car.annualRepairs));
    const tax = Math.max(0, num(car.annualTax));
    return {
      energy,
      maintenance,
      insurance,
      repairs,
      tax,
      total: energy + maintenance + insurance + repairs + tax,
    };
  }

  function scenarioLabel(row) {
    const name = String(row && row.carName ? row.carName : row && row.name ? row.name : "").trim() || "Unnamed option";
    const mode = row && row.mode === PAYMENT_MODES.finance ? "finance" : "upfront";
    return `${name} ${mode}`;
  }

  function possibleStatus(warnings) {
    if (warnings.some((warning) => warning.severity === "no")) return "No";
    if (warnings.length) return "Warning";
    return "Yes";
  }

  function shortSummary(row, winner) {
    if (row.possible === "No") return "Impossible: upfront exceeds cash";
    if (row.loanStillOwed > 0) return "Warning: loan not paid";
    if (row.budgetDeficit > 0) return "Loses: high monthly cost";
    if (winner && row.id === winner.id) {
      if (row.averageMonthlyInvested > 0 && row.resaleValue > row.upfrontPrice * 0.35) return "Strong: low cost + resale";
      return "Wins: more invested";
    }
    if (row.resaleRisk) return "Risk: resale assumption high";
    return row.averageMonthlyInvested < (winner ? winner.averageMonthlyInvested : row.averageMonthlyInvested) ? "Loses: high monthly cost" : "Loses: less invested";
  }

  function warning(id, severity, message, carKey, option) {
    return { id, severity, message, carKey, option };
  }

  function buildWarnings(row, car, assumptions, months) {
    const warnings = [];
    if (!String(car.name || "").trim()) warnings.push(warning("missing-name", "warning", "Car name is missing.", row.carKey, row.option));
    if (num(car.upfrontPrice) <= 0) warnings.push(warning("missing-price", "no", "Cash price is missing.", row.carKey, row.option));
    if (row.mode === PAYMENT_MODES.upfront && num(car.upfrontPrice) > num(assumptions.initialCashBudget)) {
      warnings.push(warning("upfront-cash", "no", "Upfront price exceeds initial cash.", row.carKey, row.option));
    }
    if (row.mode === PAYMENT_MODES.finance && num(car.downPayment) > num(assumptions.initialCashBudget)) {
      warnings.push(warning("down-cash", "no", "Down payment exceeds initial cash.", row.carKey, row.option));
    }
    if (row.maxMonthlyCarCost > num(assumptions.monthlyBudget)) {
      warnings.push(warning("monthly-budget", "warning", "Monthly cost exceeds monthly budget.", row.carKey, row.option));
    }
    if (row.mode === PAYMENT_MODES.finance && row.loanStillOwed > 0) {
      warnings.push(warning("loan-long", "warning", "Loan still active after selected years.", row.carKey, row.option));
    }
    if (row.resaleValue < 0 || !Number.isFinite(row.resaleValue)) {
      warnings.push(warning("resale-invalid", "no", "Resale value is missing or negative.", row.carKey, row.option));
    }
    if (row.resaleValue > num(car.carValue, car.upfrontPrice) * 0.9 && normalizeYears(assumptions.yearsOwned) >= 2) {
      warnings.push(warning("resale-high", "warning", "Resale value looks suspiciously high.", row.carKey, row.option));
    }
    return warnings;
  }

  function simulateScenario(carInput, assumptionsInput, modeInput, yearsInput, carKeyInput) {
    const assumptions = Object.assign({}, DEFAULT_ASSUMPTIONS, assumptionsInput || {});
    const years = normalizeYears(yearsInput === undefined ? assumptions.yearsOwned : yearsInput);
    const months = analysisMonths(years);
    const monthlyRate = monthlyInvestmentRate(assumptions.marketReturn);
    const car = withCarDefaults(carInput, carKeyInput);
    const mode = modeInput === PAYMENT_MODES.finance ? PAYMENT_MODES.finance : PAYMENT_MODES.upfront;
    const finance = financeSummary(car);
    const isFinance = mode === PAYMENT_MODES.finance;
    const initialSpent = isFinance ? finance.downPayment : Math.max(0, num(car.upfrontPrice));
    let investmentBalance = Math.max(0, num(assumptions.initialCashBudget) - initialSpent);
    let totalDeficits = Math.max(0, initialSpent - num(assumptions.initialCashBudget));
    let monthlyInvestedTotal = 0;
    let carPaymentsPaid = initialSpent;
    let runningPaid = 0;
    let maxMonthlyCarCost = 0;
    const running = annualRunningBreakdown(car, assumptions);
    const monthlyRunning = running.total / 12;
    const yearly = [];

    for (let month = 1; month <= months; month += 1) {
      investmentBalance *= 1 + monthlyRate;
      const monthlyCarPayment = isFinance && month <= finance.loanMonths ? finance.monthlyPayment : 0;
      const monthlyTotalCarCost = monthlyCarPayment + monthlyRunning;
      const monthlyInvested = Math.max(0, num(assumptions.monthlyBudget) - monthlyTotalCarCost);
      const monthlyDeficit = Math.max(0, monthlyTotalCarCost - num(assumptions.monthlyBudget));
      investmentBalance += monthlyInvested;
      monthlyInvestedTotal += monthlyInvested;
      totalDeficits += monthlyDeficit;
      carPaymentsPaid += monthlyCarPayment;
      runningPaid += monthlyRunning;
      maxMonthlyCarCost = Math.max(maxMonthlyCarCost, monthlyTotalCarCost);

      if (month % 12 === 0) {
        const year = month / 12;
        const resaleAtYear = effectiveResaleValue(car, year);
        const loanAtYear = isFinance ? loanBalance(car, month) : 0;
        yearly.push({
          year,
          finalMoney: investmentBalance + resaleAtYear - loanAtYear - totalDeficits,
          investmentBalance,
          resaleValue: resaleAtYear,
          loanLeft: loanAtYear,
          totalDeficits,
          runningPaid,
          carPaymentsPaid,
        });
      }
    }

    const resaleValue = effectiveResaleValue(car, years);
    const loanStillOwed = isFinance ? loanBalance(car, months) : 0;
    const finalMoney = investmentBalance + resaleValue - loanStillOwed - totalDeficits;
    const totalRunningCost = runningPaid;
    const totalPaid = carPaymentsPaid + totalRunningCost;
    const paidByEnd = isFinance ? carPaymentsPaid : num(car.upfrontPrice);
    const row = {
      id: "",
      carKey: carKeyInput || "",
      carName: car.name,
      option: "",
      mode,
      type: car.type,
      years,
      months,
      possible: "Yes",
      warnings: [],
      upfrontPrice: num(car.upfrontPrice),
      carValue: num(car.carValue, car.upfrontPrice),
      initialSpent,
      carPaidDisplay: isFinance && finance.loanMonths > months ? paidByEnd : (isFinance ? finance.financeTotal : num(car.upfrontPrice)),
      carPaidNote: isFinance && finance.loanMonths > months ? "paid by selected year" : (isFinance ? "full finance term" : "paid upfront"),
      carMonthlyPaymentDisplay: isFinance ? finance.monthlyPayment : 0,
      carTotalDisplay: isFinance ? finance.financeTotal : num(car.upfrontPrice),
      carPaymentsPaid,
      financeTotal: finance.financeTotal,
      financingCost: isFinance ? finance.financingCost : 0,
      monthlyRunningCost: monthlyRunning,
      extraMonth: monthlyRunning,
      extraTotal: totalRunningCost,
      totalPaid,
      investedResult: investmentBalance,
      investmentBalance,
      resaleValue,
      resaleSource: car.resaleCustom ? "custom" : "estimated",
      loanLeft: loanStillOwed,
      loanStillOwed,
      finalMoney,
      finalMoneyLeft: finalMoney,
      totalDeficits,
      budgetDeficit: totalDeficits,
      averageMonthlyInvested: months > 0 ? monthlyInvestedTotal / months : 0,
      averageMonthlyCarCost: months > 0 ? (carPaymentsPaid - initialSpent + totalRunningCost) / months : 0,
      maxMonthlyCarCost,
      running,
      runningPaid,
      energyPaid: running.energy / 12 * months,
      maintenancePaid: running.maintenance / 12 * months,
      insurancePaid: running.insurance / 12 * months,
      repairsPaid: running.repairs / 12 * months,
      taxPaid: running.tax / 12 * months,
      monthlyPaymentUsed: isFinance ? finance.monthlyPayment : 0,
      finance,
      yearly,
      resaleRisk: resaleValue > num(car.carValue, car.upfrontPrice) * 0.9 && years >= 2,
    };
    row.option = scenarioLabel(row);
    row.warnings = buildWarnings(row, car, assumptions, months);
    row.possible = possibleStatus(row.warnings);
    row.summary = shortSummary(row, null);
    return row;
  }

  function compareRows(a, b) {
    return a.finalMoney - b.finalMoney;
  }

  function analyze(input) {
    const assumptions = Object.assign({}, DEFAULT_ASSUMPTIONS, input && input.assumptions ? input.assumptions : {});
    assumptions.yearsOwned = normalizeYears(assumptions.yearsOwned);
    const cars = {
      car1: withCarDefaults(input && input.cars && input.cars.car1, "car1"),
      car2: withCarDefaults(input && input.cars && input.cars.car2, "car2"),
    };
    Object.values(cars).forEach((car) => {
      if (!car.resaleCustom) car.resaleValue = estimatedResaleValue(car, assumptions.yearsOwned);
    });
    const rows = Object.entries(cars).map(([carKey, car]) => {
      const row = simulateScenario(car, assumptions, car.paymentMode, assumptions.yearsOwned, carKey);
      row.id = `${carKey}_${row.mode}`;
      row.option = scenarioLabel(row);
      return row;
    });
    const winner = rows.slice().sort((a, b) => compareRows(b, a))[0] || null;
    rows.forEach((row) => {
      row.isWinner = Boolean(winner && row.id === winner.id);
      row.summary = shortSummary(row, winner);
    });
    const runnerUp = winner ? rows.filter((row) => row.id !== winner.id).sort((a, b) => compareRows(b, a))[0] : null;
    const warnings = rows.flatMap((row) => row.warnings);
    return {
      assumptions,
      cars,
      rows,
      scenarios: rows,
      winner,
      runnerUp,
      difference: winner && runnerUp ? winner.finalMoney - runnerUp.finalMoney : 0,
      warnings,
      stockReturn: num(assumptions.marketReturn, STOCK_RETURN),
    };
  }

  function rankCarDatabase(assumptionsInput, scoreWeightsInput) {
    const assumptions = Object.assign({}, DEFAULT_ASSUMPTIONS, assumptionsInput || {});
    assumptions.yearsOwned = normalizeYears(assumptions.yearsOwned);
    const scoreWeights = Object.assign({}, DEFAULT_SCORE_WEIGHTS, scoreWeightsInput || {});
    const totalScoreWeight = Object.keys(DEFAULT_SCORE_WEIGHTS).reduce((sum, field) => sum + Math.max(0, num(scoreWeights[field])), 0);
    const directQualityScore = (entry) => {
      if (totalScoreWeight <= 0) return 0;
      const scores = entry.scores || defaultScores(entry);
      return Object.keys(DEFAULT_SCORE_WEIGHTS).reduce((sum, field) => {
        return sum + clamp(scores[field], 0, 10) * Math.max(0, num(scoreWeights[field]));
      }, 0) / totalScoreWeight;
    };
    const directRetentionRate = (entry, years) => {
      const type = typeFromModel(entry);
      const profile = entry.depreciationProfile;
      if (!profile || !Number.isFinite(Number(profile.firstYearRetention)) || !Number.isFinite(Number(profile.annualRetention))) {
        return retentionRate(type, years);
      }
      const firstYearRetention = num(profile.firstYearRetention, retentionRate(type, 1));
      const annualRetention = num(profile.annualRetention, 0.9);
      const minRetention = num(profile.minRetention, 0.08);
      if (years <= 1) return Math.min(0.98, firstYearRetention + (1 - years) * 0.06);
      return clamp(firstYearRetention * Math.pow(annualRetention, years - 1), minRetention, 1.15);
    };
    const rows = CAR_DATABASE.map((entry) => {
      const type = typeFromModel(entry);
      const years = assumptions.yearsOwned;
      const months = analysisMonths(years);
      const monthlyRate = monthlyInvestmentRate(assumptions.marketReturn);
      const initialSpent = Math.max(0, num(entry.defaultUpfrontPrice));
      const energy = type === "ev"
        ? Math.max(0, num(assumptions.annualKm)) / 100 * Math.max(0, num(entry.realWorldKwhPer100km)) * Math.max(0, num(assumptions.electricityPrice))
        : Math.max(0, num(assumptions.annualKm)) / 100 * Math.max(0, num(entry.realWorldLitersPer100km)) * Math.max(0, num(assumptions.fuelPrice));
      const running = {
        energy,
        maintenance: Math.max(0, num(entry.maintenancePerYear)),
        insurance: Math.max(0, num(entry.insurancePerYear)),
        repairs: Math.max(0, num(entry.repairsPerYear)),
        tax: Math.max(0, num(entry.taxPerYear)),
      };
      running.total = running.energy + running.maintenance + running.insurance + running.repairs + running.tax;
      const monthlyRunning = running.total / 12;
      const startingInvestment = Math.max(0, num(assumptions.initialCashBudget) - initialSpent);
      const monthlyInvestment = Math.max(0, num(assumptions.monthlyBudget) - monthlyRunning);
      const growth = Math.pow(1 + monthlyRate, months);
      const contributionGrowth = monthlyRate === 0 ? months : (growth - 1) / monthlyRate;
      const investmentBalance = startingInvestment * growth + monthlyInvestment * contributionGrowth;
      const totalDeficits = Math.max(0, initialSpent - num(assumptions.initialCashBudget)) + Math.max(0, monthlyRunning - num(assumptions.monthlyBudget)) * months;
      const runningPaid = monthlyRunning * months;
      const resaleValue = Math.round(Math.max(0, num(entry.defaultUpfrontPrice) * directRetentionRate(entry, years)) / 100) * 100;
      const totalPaid = initialSpent + runningPaid;
      const finalMoney = investmentBalance + resaleValue - totalDeficits;
      const qualityScore = directQualityScore(entry);
      return {
        id: entry.id,
        modelId: entry.id,
        carKey: entry.id,
        carName: entry.displayName,
        option: entry.displayName,
        mode: PAYMENT_MODES.upfront,
        type,
        category: entry.category,
        categoryGroup: entry.categoryGroup || entry.category,
        categoryLabel: entry.categoryLabel || entry.categoryGroup || entry.category,
        years,
        months,
        possible: initialSpent > num(assumptions.initialCashBudget) ? "No" : totalDeficits > 0 ? "Warning" : "Yes",
        warnings: [],
        upfrontPrice: initialSpent,
        carValue: num(entry.defaultUpfrontPrice),
        initialSpent,
        carPaidDisplay: initialSpent,
        carPaidNote: "paid upfront",
        carMonthlyPaymentDisplay: 0,
        carTotalDisplay: initialSpent,
        carPaymentsPaid: initialSpent,
        financeTotal: initialSpent,
        financingCost: 0,
        monthlyRunningCost: monthlyRunning,
        extraMonth: monthlyRunning,
        extraTotal: runningPaid,
        totalPaid,
        investedResult: investmentBalance,
        investmentBalance,
        resaleValue,
        resaleSource: "estimated",
        loanLeft: 0,
        loanStillOwed: 0,
        finalMoney,
        finalMoneyLeft: finalMoney,
        totalDeficits,
        budgetDeficit: totalDeficits,
        averageMonthlyInvested: months > 0 ? Math.max(0, num(assumptions.monthlyBudget) - monthlyRunning) : 0,
        averageMonthlyCarCost: months > 0 ? runningPaid / months : 0,
        maxMonthlyCarCost: monthlyRunning,
        running,
        runningPaid,
        energyPaid: running.energy / 12 * months,
        maintenancePaid: running.maintenance / 12 * months,
        insurancePaid: running.insurance / 12 * months,
        repairsPaid: running.repairs / 12 * months,
        taxPaid: running.tax / 12 * months,
        monthlyPaymentUsed: 0,
        finance: {
          downPayment: 0,
          monthlyPayment: 0,
          loanMonths: 0,
          financeTotal: initialSpent,
          financeTotalPaid: initialSpent,
          financingCost: 0,
        },
        qualityScore,
        globalRank: 0,
        yearly: [],
        resaleRisk: resaleValue > num(entry.defaultUpfrontPrice) * 0.9 && years >= 2,
      };
    });
    return rows.sort((a, b) => b.finalMoney - a.finalMoney || a.carName.localeCompare(b.carName)).map((row, index) => Object.assign(row, { globalRank: index + 1 }));
  }

  function formatEuro(value) {
    return `€${Math.round(num(value)).toLocaleString("en-IE")}`;
  }

  return {
    STOCK_RETURN,
    PAYMENT_MODES,
    VEHICLE_TYPES,
    CAR_DATABASE,
    CAR_BY_ID,
    DEFAULT_ASSUMPTIONS,
    DEFAULT_SCORE_WEIGHTS,
    TYPE_DEFAULTS,
    DEFAULT_CARS,
    TYPE_FIELDS,
    clone,
    num,
    defaultCar,
    weightedQualityScore,
    carModelById,
    carDefaultsFromModel,
    applyCarModelDefaults,
    displayCarName,
    applyTypeDefaults,
    markCustom,
    clearCustom,
    monthlyInvestmentRate,
    retentionRate,
    modelRetentionRate,
    estimatedResaleValue,
    effectiveResaleValue,
    financeSummary,
    loanBalance,
    weightedElectricityPrice,
    annualEnergyCost,
    annualRunningBreakdown,
    simulateScenario,
    analyze,
    rankCarDatabase,
    scenarioLabel,
    formatEuro,
  };
});
