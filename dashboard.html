    function helpText(key) { return dynamicHelpText(key) || HELP[key] || ""; }
    function helpAttrs(key) {
      return helpText(key) ? ` data-help-key="${key}"` : "";
    }
    function fieldLabel(carKey, field, label) {
      const id = `${carKey}-${field}`;
      return `<label class="field-label help-target" for="${id}"${helpAttrs(`${carKey}.${field}`)}>${escapeHtml(label)}</label>`;
    }
    function carTitle(carKey) {
      return escapeHtml(M.displayCarName(state.cars[carKey]));
    }

    function init() {
      renderStaticIcons();
      renderSetup();
      renderAllInputs();
      bindHelp();
      bindModelPickerDismiss();
      bindPanelFeedback();
      update();
    }

    function renderSetup() {
      document.getElementById("setupInputs").innerHTML = setupFields.map(([field, label, min, max, step]) => `
        <div class="setup-field">
          <label class="field-label help-target" for="setup-${field}"${helpAttrs(field)}>${escapeHtml(label)}</label>
          <input id="setup-${field}" data-assumption="${field}" type="number" min="${min}" max="${max}" step="${step}" value="${state.assumptions[field]}">
        </div>
      `).join("");
      document.getElementById("setupInputs").querySelectorAll("[data-assumption]").forEach((input) => {
        input.addEventListener("input", () => {
          state.assumptions[input.dataset.assumption] = input.value === "" ? "" : Number(input.value);
          refreshAutoResale();
          renderCosts();
          update();
        });
      });
    }

    function renderAllInputs() {
      renderCars();
      renderPayment();
      renderCosts();
    }

    function carPanel(carKey, html) {
      return `<div class="car-panel" data-car-panel="${carKey}"><h3 class="help-target" ${helpAttrs(`${carKey}.panel`)}>${icon("car")}<span data-car-title="${carKey}">${carTitle(carKey)}</span></h3>${html}</div>`;
    }

    function renderCars() {
      document.getElementById("choiceInputs").innerHTML = ["car1", "car2"].map((carKey) => {
        const car = state.cars[carKey];
        const html = `
          ${inputRow(carKey, "modelId", "Car model", modelSearchControl(carKey, car))}
          ${numberInput(carKey, "carValue", "Car value", 100)}
          ${inputRow(carKey, "paymentMode", "Payment", `<select id="${carKey}-paymentMode" data-car="${carKey}" data-field="paymentMode"><option value="upfront" ${car.paymentMode === "upfront" ? "selected" : ""}>Upfront</option><option value="finance" ${car.paymentMode === "finance" ? "selected" : ""}>Finance</option></select>`)}
        `;
        return carPanel(carKey, html);
      }).join("");
      bindCarInputs("choiceInputs");
      bindCarSearchInputs();
      bindModelPickerInputs();
    }

    function modelSearchControl(carKey, car) {
      const open = Boolean(state.modelDropdownOpen[carKey]);
      const value = state.modelSearch[carKey] || "";
      return `<div class="model-picker ${open ? "open" : ""}" data-model-picker="${carKey}">
        <button class="model-trigger" id="${carKey}-modelId" type="button" data-car-select-toggle="${carKey}" aria-expanded="${open ? "true" : "false"}" aria-label="Choose car model">${escapeHtml(M.displayCarName(car))}</button>
        <input type="hidden" data-car="${carKey}" data-field="modelId" value="${escapeHtml(car.modelId || "")}">
        ${open ? `<div class="model-menu" data-car-dropdown="${carKey}">
          <label class="search-control" for="${carKey}-modelSearch"><span class="icon">${iconOnly("search")}</span><input id="${carKey}-modelSearch" data-car-search="${carKey}" type="search" placeholder="Search" value="${escapeHtml(value)}" autocomplete="off"></label>
          ${modelOptions(carKey, car)}
        </div>` : ""}
      </div>`;
    }

    function modelOptions(carKey, car) {
      const query = (state.modelSearch[carKey] || "").trim().toLowerCase();
      const allMatches = M.CAR_DATABASE.filter((item) => modelMatchesSearch(item, query) || item.id === car.modelId)
        .sort((a, b) => categoryOrder.indexOf(carCategoryGroup(a)) - categoryOrder.indexOf(carCategoryGroup(b)) || a.defaultUpfrontPrice - b.defaultUpfrontPrice || a.displayName.localeCompare(b.displayName));
      const visibleCars = query ? allMatches.slice(0, 120) : allMatches.slice(0, 80);
      const options = visibleCars.map((item) => `
        <button class="model-option ${car.modelId === item.id ? "selected" : ""}" type="button" data-car-option="${carKey}" data-model-id="${escapeHtml(item.id)}">
          <span>${escapeHtml(item.displayName)}</span>
          <small>${escapeHtml([item.brand, carCategoryGroup(item), item.powertrain].filter(Boolean).join(" · "))}</small>
        </button>
      `).join("");
      const more = allMatches.length > visibleCars.length ? `<div class="model-more">Showing ${visibleCars.length} of ${allMatches.length}. Type to narrow.</div>` : "";
      return options ? options + more : `<div class="model-more">No matches.</div>`;
    }

    function modelMatchesSearch(car, query) {
      if (!query) return true;
      const haystack = car.searchText || normalizeSearch([car.displayName, car.brand, car.model, car.year, car.yearRange, car.id, carCategoryGroup(car), car.category, car.powertrain, car.segment, car.energyType, car.fuelType, car.typicalMarket].filter(Boolean).join(" "));
      return normalizeSearch(query).split(/\s+/).filter(Boolean).every((term) => haystack.includes(term));
    }

    function normalizeSearch(value) {
      return String(value).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
    }

    function carCategoryGroup(car) {
      if (car.categoryGroup) return car.categoryGroup;
      if (car.energyType === "electricity") {
        if (/suv|crossover|pickup|off-road/i.test(car.segment || car.model || car.displayName || "")) return "EV SUV";
        if (/sedan|saloon|model 3|model s|seal|taycan|air|eqs|eqe/i.test(car.segment || car.model || car.displayName || "")) return "EV sedan";
        return "EV hatchback";
      }
      if (car.category === "supercar") return "Supercar";
      if (car.category === "luxury") return /suv/i.test(car.segment || car.model || car.displayName || "") ? "Luxury SUV" : "Luxury sedan";
      if (car.category === "pickup") return "Pickup";
      if (car.defaultUpfrontPrice <= 9000 || /panda|aygo|picanto|i10|up|206/i.test(car.id)) return "City car";
      if (car.defaultUpfrontPrice <= 14500 || /fiesta|clio|sandero|corsa|ibiza|fabia|micra|208/i.test(car.id)) return "Supermini";
      return "Hatchback";
    }

    function renderPayment() {
      document.getElementById("financeInputs").innerHTML = ["car1", "car2"].map((carKey) => {
        const car = state.cars[carKey];
        const fields = paymentFields[car.paymentMode] || paymentFields.upfront;
        const rows = fields.map(([field, label, step]) => numberInput(carKey, field, label, step)).join("");
        const actions = `<div class="offer-actions"><button class="small-button" type="button" data-offer-action="save" data-car="${carKey}">Save</button><button class="small-button" type="button" data-offer-action="reset" data-car="${carKey}">Reset</button></div>`;
        return carPanel(carKey, rows + actions);
      }).join("");
      bindCarInputs("financeInputs");
      bindOfferActions();
    }

    function offerSnapshot(car) {
      return {
        paymentMode: car.paymentMode,
        upfrontPrice: car.upfrontPrice,
        downPayment: car.downPayment,
        monthlyPayment: car.monthlyPayment,
        loanMonths: car.loanMonths,
      };
    }

    function saveOffer(carKey) {
      const car = state.cars[carKey];
      if (!car || !car.modelId) return;
      state.savedOffers[carKey][car.modelId] = offerSnapshot(car);
      showToast("Saved");
    }

    function resetOffer(carKey) {
      const current = state.cars[carKey];
      const defaults = M.carDefaultsFromModel(current.modelId);
      ["upfrontPrice", "downPayment", "monthlyPayment", "loanMonths"].forEach((field) => {
        current[field] = defaults[field];
      });
      renderPayment();
      update();
      showToast("Reset");
    }

    function bindOfferActions() {
      if (!document.querySelectorAll) return;
      document.querySelectorAll("[data-offer-action]").forEach((button) => {
        if (button.dataset.offerBound) return;
        button.dataset.offerBound = "1";
        button.addEventListener("click", () => {
          if (button.dataset.offerAction === "save") {
            saveOffer(button.dataset.car);
            buttonFeedback(button, "Saved");
          }
          if (button.dataset.offerAction === "reset") {
            resetOffer(button.dataset.car);
            buttonFeedback(button, "Reset");
          }
        });
      });
    }

    function renderCosts() {
      refreshAutoResale();
      const market = `<div class="info-block"><h3>Market</h3><div class="controls">${marketFields.map(([field, label, step]) => marketInput(field, label, step)).join("")}</div></div>`;
      const carInfo = `<div class="info-block"><h3>Car</h3><div class="grid two">${["car1", "car2"].map((carKey) => {
        const car = state.cars[carKey];
        const fields = (costFields[car.type] || costFields.combustion).concat(commonCostFields);
        const rows = fields.map(([field, label, step]) => numberInput(carKey, field, label, step)).join("");
        return carPanel(carKey, `${rows}<div class="meta" data-running-meta="${carKey}">${runningChips(car)}</div>`);
      }).join("")}</div></div>`;
      const scores = `<div class="info-block"><h3>Scores</h3><div class="grid two">${["car1", "car2"].map((carKey) => {
        const rows = scoreFields.map(([field, label]) => scoreInput(carKey, field, label)).join("");
        return carPanel(carKey, rows);
      }).join("")}</div><div class="weight-grid">${scoreFields.map(([field, label]) => scoreWeightInput(field, label)).join("")}</div></div>`;
      document.getElementById("runningInputs").innerHTML = market + carInfo + scores;
      bindCarInputs("runningInputs");
      bindMarketInputs();
      bindScoreWeightInputs();
    }

    function refreshAutoResale() {
      ["car1", "car2"].forEach((carKey) => {
        const car = state.cars[carKey];
        if (!car.resaleCustom) car.resaleValue = M.estimatedResaleValue(car, state.assumptions.yearsOwned);
      });
    }

    function numberInput(carKey, field, label, step, chips = "") {
      return inputRow(carKey, field, label, `<input id="${carKey}-${field}" data-car="${carKey}" data-field="${field}" type="number" step="${step}" value="${state.cars[carKey][field] ?? ""}">`, chips);
    }

    function marketInput(field, label, step) {
      return `<div class="setup-field"><label class="field-label help-target" for="market-${field}"${helpAttrs(field)}>${escapeHtml(label)}</label><input id="market-${field}" data-market="${field}" type="number" step="${step}" value="${state.assumptions[field] ?? ""}"></div>`;
    }

    function scoreInput(carKey, field, label) {
      const value = state.cars[carKey].scores?.[field] ?? 0;
      return inputRow(carKey, `score-${field}`, label, `<input id="${carKey}-score-${field}" data-car="${carKey}" data-score="${field}" type="number" min="0" max="10" step="1" value="${value}">`);
    }

    function scoreWeightInput(field, label) {
      return `<label>${escapeHtml(label)} weight<input data-score-weight="${field}" type="number" min="0" max="100" step="1" value="${state.scoreWeights[field] ?? 0}"></label>`;
    }

    function inputRow(carKey, field, label, control, chips = "") {
      return `<div class="field-row"><div class="field-copy">${fieldLabel(carKey, field, label)}${chips}</div><div>${control}</div></div>`;
    }

    function chip(text, tone = "") {
      return `<span class="pill ${tone}">${escapeHtml(text)}</span>`;
    }

    function runningChips(car) {
      const running = M.annualRunningBreakdown(car, state.assumptions);
      const energyLabel = car.type === "ev" ? "Electricity" : "Fuel";
      return [
        chip(`${energyLabel}: ${euro(running.energy / 12)}/mo`),
        chip(`Monthly running: ${euro(running.total / 12)}`),
        chip(`Annual running: ${euro(running.total)}`),
      ].join("");
    }

    function updateCarTitles(carKey) {
      if (!document.querySelectorAll) return;
      document.querySelectorAll(`[data-car-title="${carKey}"]`).forEach((node) => {
        node.textContent = M.displayCarName(state.cars[carKey]);
      });
    }

    function bindMarketInputs() {
      if (!document.querySelectorAll) return;
      document.querySelectorAll("[data-market]").forEach((input) => {
        if (input.dataset.marketBound) return;
        input.dataset.marketBound = "1";
        input.addEventListener("input", () => {
          state.assumptions[input.dataset.market] = input.value === "" ? "" : Number(input.value);
          updateRunningMeta("car1");
          updateRunningMeta("car2");
          update();
        });
      });
    }

    function bindScoreWeightInputs() {
      if (!document.querySelectorAll) return;
      document.querySelectorAll("[data-score-weight]").forEach((input) => {
        if (input.dataset.weightBound) return;
        input.dataset.weightBound = "1";
        input.addEventListener("input", () => {
          state.scoreWeights[input.dataset.scoreWeight] = input.value === "" ? "" : Number(input.value);
          renderRanking();
        });
      });
    }

    function bindCarSearchInputs() {
      if (!document.querySelectorAll) return;
      document.querySelectorAll("[data-car-search]").forEach((input) => {
        if (input.dataset.searchBound) return;
        input.dataset.searchBound = "1";
        input.addEventListener("input", () => {
          const carKey = input.dataset.carSearch;
          state.modelSearch[carKey] = input.value;
          const activeId = input.id;
          const cursor = input.selectionStart;
          renderCars();
          bindHelp();
          const next = document.getElementById(activeId);
          if (next) {
            next.focus();
            if (Number.isFinite(cursor)) next.setSelectionRange(cursor, cursor);
          }
        });
      });
    }

    function bindModelPickerInputs() {
      if (!document.querySelectorAll) return;
      document.querySelectorAll("[data-car-select-toggle]").forEach((button) => {
        if (button.dataset.pickerBound) return;
        button.dataset.pickerBound = "1";
        button.addEventListener("click", () => toggleModelDropdown(button.dataset.carSelectToggle));
      });
      document.querySelectorAll("[data-car-option]").forEach((button) => {
        if (button.dataset.optionBound) return;
        button.dataset.optionBound = "1";
        button.addEventListener("click", () => selectModel(button.dataset.carOption, button.dataset.modelId));
      });
    }

    function toggleModelDropdown(carKey, forceOpen) {
      state.modelDropdownOpen[carKey] = typeof forceOpen === "boolean" ? forceOpen : !state.modelDropdownOpen[carKey];
      if (!state.modelDropdownOpen[carKey]) state.modelSearch[carKey] = "";
      renderCars();
      bindHelp();
      if (state.modelDropdownOpen[carKey]) {
        const input = document.getElementById(`${carKey}-modelSearch`);
        if (input) input.focus();
      }
    }

    function selectModel(carKey, modelId) {
      if (!modelId) return;
      state.cars[carKey] = M.applyCarModelDefaults(state.cars[carKey], modelId, { keepPayment:true });
      const saved = state.savedOffers[carKey][modelId];
      if (saved) Object.assign(state.cars[carKey], saved);
      state.modelDropdownOpen[carKey] = false;
      state.modelSearch[carKey] = "";
      refreshAutoResale();
      renderAllInputs();
      bindHelp();
      update();
    }

    function bindModelPickerDismiss() {
      if (!document.addEventListener) return;
      document.addEventListener("pointerdown", (event) => {
        if (!state.modelDropdownOpen.car1 && !state.modelDropdownOpen.car2) return;
        const target = event.target;
        const inside = target && target.closest && target.closest("[data-model-picker]");
        if (inside) return;
        state.modelDropdownOpen.car1 = false;
        state.modelDropdownOpen.car2 = false;
        state.modelSearch.car1 = "";
        state.modelSearch.car2 = "";
        renderCars();
      });
    }

    function showToast(message) {
      const toast = document.getElementById("toast");
      if (!toast) return;
      toast.textContent = message;
      toast.classList.add("show");
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => toast.classList.remove("show"), 1200);
    }

    function buttonFeedback(button, text) {
      if (!button) return;
      const original = button.dataset.originalText || button.textContent;
      button.dataset.originalText = original;
      button.textContent = text;
      button.classList.add("is-feedback");
      clearTimeout(button._feedbackTimer);
      button._feedbackTimer = setTimeout(() => {
        button.textContent = original;
        button.classList.remove("is-feedback");
      }, 1000);
    }

    function bindPanelFeedback() {
      if (!document.querySelectorAll) return;
      document.querySelectorAll("details.panel > summary").forEach((summary) => {
        if (summary.dataset.panelFeedbackBound) return;
        summary.dataset.panelFeedbackBound = "1";
        summary.addEventListener("click", () => {
          const panel = summary.parentElement;
          setTimeout(() => showToast(panel?.open ? "Opened" : "Closed"), 0);
        });
      });
    }

    function updateRunningMeta(carKey) {
      if (!document.querySelectorAll) return;
      document.querySelectorAll(`[data-running-meta="${carKey}"]`).forEach((node) => {
        node.innerHTML = runningChips(state.cars[carKey]);
      });
    }

    function syncAutoResaleInput(carKey) {
      const input = document.getElementById(`${carKey}-resaleValue`);
      if (input && document.activeElement !== input) input.value = state.cars[carKey].resaleValue ?? "";
    }

    function dynamicHelpText(key) {
      const result = latestResult || M.analyze(state);
      const years = number(result.assumptions.yearsOwned, 1);
      const budget = euro(result.assumptions.monthlyBudget);
      const cars = result.cars || state.cars;
      const rows = Object.fromEntries((result.rows || []).map((row) => [row.carKey, row]));
      if (key === "heroWinner") return heroComparisonText("winner");
      if (key === "heroCostDiff") return heroComparisonText("cost");
      if (key === "heroNetWorthDiff") return heroComparisonText("net");
      if (key === "setup") return `You are comparing ${carName("car1", cars)} and ${carName("car2", cars)} over ${years} years with ${euro(result.assumptions.initialCashBudget)} initial cash and a ${budget}/month budget.`;
      if (key === "cars") return `${carName("car1", cars)} is ${typeLabel(cars.car1)} and ${carName("car2", cars)} is ${typeLabel(cars.car2)}. Names shown here are used everywhere in the results and help text.`;
      if (key === "payment") return `${carName("car1", cars)} is ${paymentLabel(cars.car1)} at ${euro(cars.car1.upfrontPrice)}. ${carName("car2", cars)} is ${paymentLabel(cars.car2)} at ${euro(cars.car2.upfrontPrice)}.`;
      if (key === "costs") return `${carName("car1", cars)} running cost is ${euro(rows.car1?.monthlyRunningCost || 0)}/month. ${carName("car2", cars)} running cost is ${euro(rows.car2?.monthlyRunningCost || 0)}/month at ${number(result.assumptions.annualKm, 0)} km/year.`;
      if (key === "results") return heroComparisonText("winner");
      if (key === "initialCashBudget") return `${euro(result.assumptions.initialCashBudget)} is available at the start. Upfront purchases or finance down payments are taken from this before leftover cash is invested.`;
      if (key === "monthlyBudget") return `${budget}/month is available for car payments and running costs. Anything left after those costs keeps working in the background.`;
      if (key === "yearsOwned") return `The model runs for ${years} years. Resale, loan left, total paid, and final money all update when this changes.`;
      if (key === "annualKm") return `${number(result.assumptions.annualKm, 0)} km/year drives the current electricity/fuel running totals.`;
      if (key === "fuelPrice") return `${euroPrecise(result.assumptions.fuelPrice)}/L for fuel and hybrid cars.`;
      if (key === "electricityPrice") return `${euroPrecise(result.assumptions.electricityPrice)}/kWh for EVs. Assumes 100% home charging.`;
      if (key === "marketReturn") return `${number(result.assumptions.marketReturn, 1)}% annual return for leftover money.`;
      const carField = key.match(/^(car[12])\.(.+)$/);
      if (carField) return carFieldHelp(carField[1], carField[2], cars, rows, result);
      const rowMatch = key.match(/^row\.(car[12])\.(.+)$/);
      if (rowMatch) return rowHelp(rowMatch[1], rowMatch[2], rows, result);
      return "";
    }

    function carName(carKey, cars = state.cars) {
      return M.displayCarName(cars[carKey]);
    }

    function typeLabel(car) {
      if (car?.category === "supercar") return "a supercar";
      if (car?.category === "luxury") return car?.type === "ev" ? "a luxury EV" : "a luxury car";
      if (car?.category === "pickup") return "a pickup";
      return ({ ev:"an EV", hybrid:"a hybrid", combustion:"a combustion car" }[car?.type] || "a car");
    }

    function paymentLabel(car) {
      return car?.paymentMode === "finance"
        ? `financed with ${euro(car.downPayment)} down and ${euro(car.monthlyPayment)}/month for ${number(car.loanMonths, 0)} months`
        : `paid upfront`;
    }

    function carFieldHelp(carKey, field, cars, rows, result) {
      const car = cars[carKey];
      const row = rows[carKey];
      const name = carName(carKey, cars);
      const years = number(result.assumptions.yearsOwned, 1);
      const running = M.annualRunningBreakdown(car, result.assumptions);
      const map = {
        panel: `${name} is ${typeLabel(car)}, ${paymentLabel(car)}, and currently leaves ${euro(row?.finalMoney || 0)} after ${years} years.`,
        modelId: `${name} is loaded from the local car database as ${typeLabel(car)}. Selecting a different model reloads realistic defaults for price, energy use, maintenance, insurance, repairs, tax, and resale.`,
        carValue: `${name} car value is ${euro(car.carValue)}. It is used for default resale; the offer price can be different.`,
        paymentMode: `${name} is currently ${paymentLabel(car)}.`,
        upfrontPrice: `${name} upfront offer is ${euro(car.upfrontPrice)}. This is the cash paid at month 0 for an upfront deal.`,
        downPayment: `${name} down payment is ${euro(car.downPayment)}.`,
        monthlyPayment: `${name} finance payment is ${euro(car.monthlyPayment)}/month while the loan is active.`,
        loanMonths: `${name} loan term is ${number(car.loanMonths, 0)} months. If it extends beyond ${years} years, loan left is subtracted from net worth.`,
        kwhPer100Km: `${name} uses ${number(car.kwhPer100Km, 1)} kWh/100 km. Current electricity cost is ${euro(running.energy / 12)}/month.${sourceText(car, "electricity use")}`,
        litersPer100Km: `${name} uses ${number(car.litersPer100Km, 1)} L/100 km. Current fuel cost is ${euro(running.energy / 12)}/month.${sourceText(car, "fuel use")}`,
        annualMaintenance: `${name} maintenance is ${euro(car.annualMaintenance)}/year.${sourceText(car, "maintenance")}`,
        annualInsurance: `${name} insurance is ${euro(car.annualInsurance)}/year.${sourceText(car, "insurance")}`,
        annualRepairs: `${name} repair reserve is ${euro(car.annualRepairs)}/year.${sourceText(car, "repairs")}`,
        annualTax: `${name} road tax is ${euro(car.annualTax)}/year.${sourceText(car, "Portugal IUC/tax")}`,
        resaleValue: `${name} resale after ${years} years is ${euro(car.resaleValue)}. Net worth includes this value.${sourceText(car, "depreciation/resale")}`,
      };
      return map[field] || "";
    }

    function sourceText(car, fieldLabel) {
      if (!car.loadedFromDatabase) return "";
      return ` ${car.modelDisplayName || car.name} ${fieldLabel} is based on: ${car.sourceNotes || "local database assumptions"}. It may differ with trim, year, mileage, driver profile, location, battery health, and service history.`;
    }

    function rowHelp(carKey, field, rows, result) {
      const row = rows[carKey];
      const other = (result.rows || []).find((item) => item.carKey !== carKey);
      if (!row) return "";
      const name = row.option;
      const otherName = other?.option || "the other option";
      const map = {
        option: `${name} leaves ${euro(row.finalMoney)} after ${number(row.years, 1)} years. ${otherName} leaves ${euro(other?.finalMoney || 0)}.`,
        carMonth: `${name} car payment is ${euro(row.carMonthlyPaymentDisplay)}/month while active.`,
        carTotal: `${name} car total is ${euro(row.carTotalDisplay)}. Paid during selected years: ${euro(row.carPaymentsPaid)}.`,
        costsMonth: `${name} running costs are ${euro(row.monthlyRunningCost)}/month.`,
        costsTotal: `${name} running costs total ${euro(row.extraTotal)} over ${number(row.years, 1)} years.`,
        totalPaid: `${name} total paid during the selected years is ${euro(row.totalPaid)}.`,
        netWorth: `${name} leaves ${euro(row.finalMoney)} after resale, investments, deficits, and any loan left.`,
      };
      return map[field] || "";
    }

    function bindCarInputs(rootId) {
      document.getElementById(rootId).querySelectorAll("[data-car][data-field], [data-car][data-score]").forEach((input) => {
        const handleInput = () => {
          const carKey = input.dataset.car;
          const car = state.cars[carKey];
          const field = input.dataset.field;
          if (input.dataset.score) {
            car.scores = car.scores || {};
            car.scores[input.dataset.score] = input.value === "" ? "" : Number(input.value);
            update();
            return;
          }
          if (input.tagName === "SELECT" || input.type === "text") {
            if (field === "modelId") {
              state.cars[carKey] = M.applyCarModelDefaults(car, input.value, { keepPayment:true });
              const saved = state.savedOffers[carKey][input.value];
              if (saved) Object.assign(state.cars[carKey], saved);
              refreshAutoResale();
              renderAllInputs();
              bindHelp();
            } else if (field === "paymentMode") {
              car[field] = input.value;
              renderPayment();
              bindHelp();
            } else {
              car[field] = input.value;
              car.name = M.displayCarName(car);
              updateCarTitles(carKey);
            }
          } else {
            car[field] = input.value === "" ? "" : Number(input.value);
            if (field === "resaleValue") car.resaleCustom = true;
            else M.markCustom(car, field);
            if (field === "carValue" && !car.resaleCustom) {
              refreshAutoResale();
              syncAutoResaleInput(carKey);
            }
            if (["carValue", "upfrontPrice", "resaleValue", "kwhPer100Km", "litersPer100Km", "annualMaintenance", "annualInsurance", "annualRepairs", "annualTax"].includes(field)) updateRunningMeta(carKey);
          }
          update();
        };
        input.addEventListener("input", handleInput);
        if (input.tagName === "SELECT") input.addEventListener("change", handleInput);
      });
    }

    function bindHelp() {
      if (!document.querySelectorAll) return;
      document.querySelectorAll(".help-target").forEach((node) => {
        if (node.dataset.helpBound) return;
        node.dataset.helpBound = "1";
        const openOnHover = () => {
          if (!helpPinned) showHelp(node, false);
        };
        const closeOnLeave = () => {
          if (!helpPinned) hideHelp(true);
        };
        node.addEventListener("mouseenter", openOnHover);
        node.addEventListener("mouseover", openOnHover);
        node.addEventListener("mouseleave", closeOnLeave);
        node.addEventListener("mouseout", closeOnLeave);
        node.addEventListener("pointerdown", (event) => {
          const key = node.dataset.helpKey;
          if (!key) return;
          if (helpPinned && activeHelpKey === key) hideHelp(true);
          else showHelp(node, true);
          event.stopPropagation();
        });
      });
      if (document.body && !document.body.dataset.helpDismissBound) {
        document.body.dataset.helpDismissBound = "1";
        document.addEventListener("pointerdown", (event) => {
          const bubble = document.getElementById("floatingHelp");
          if (!bubble || !activeHelpTarget) return;
          if (bubble.contains(event.target) || activeHelpTarget.contains(event.target)) return;
          hideHelp(true);
        }, true);
        window.addEventListener("scroll", () => {
          if (activeHelpTarget) positionHelp(activeHelpTarget);
        }, { passive:true });
        window.addEventListener("resize", () => {
          if (activeHelpTarget) positionHelp(activeHelpTarget);
        });
      }
    }

    let activeHelpTarget = null;
    let activeHelpKey = "";
    let helpPinned = false;

    function showHelp(node, pinned) {
      const text = helpText(node.dataset.helpKey);
      if (!text || !document.createElement) return;
      let bubble = document.getElementById("floatingHelp");
      if (!bubble) {
        bubble = document.createElement("div");
        bubble.id = "floatingHelp";
        bubble.className = "help-bubble";
        (document.body || node.parentNode).appendChild(bubble);
      }
      activeHelpTarget = node;
      activeHelpKey = node.dataset.helpKey || "";
      helpPinned = pinned;
      bubble.textContent = text;
      positionHelp(node);
      bubble.classList.add("show");
    }

    function positionHelp(node) {
      const bubble = document.getElementById("floatingHelp");
      if (!bubble || !node.getBoundingClientRect) return;
      const rect = node.getBoundingClientRect();
      const bubbleRect = bubble.getBoundingClientRect ? bubble.getBoundingClientRect() : { width:260, height:50 };
      const margin = 12;
      const width = bubbleRect.width || 260;
      const height = bubbleRect.height || 50;
      const left = Math.min(window.innerWidth - width - margin, Math.max(margin, rect.left + rect.width / 2 - width / 2));
      const above = rect.top - height - 9;
      const top = above > margin ? above : Math.min(window.innerHeight - height - margin, rect.bottom + 9);
      bubble.style.left = `${left}px`;
      bubble.style.top = `${Math.max(margin, top)}px`;
    }

    function hideHelp(force = false) {
      if (helpPinned && !force) return;
      const bubble = document.getElementById("floatingHelp");
      if (bubble) bubble.classList.remove("show");
      activeHelpTarget = null;
      activeHelpKey = "";
      helpPinned = false;
    }

    function update() {
      refreshAutoResale();
      const result = M.analyze(state);
      latestResult = result;
      renderHero(result);
      renderRanking(result);
      renderWarnings(result);
      renderMobileResults(result);
      renderTable(result);
    }

    function renderHero(result) {
      const winner = result.winner;
      const runnerUp = result.runnerUp;
      document.getElementById("heroSummary").innerHTML = winner ? `
        <div class="hero-metric help-target flow" ${helpAttrs("heroWinner")}><span>${icon("winner")}Winner</span><strong>${escapeHtml(winner.option)}</strong></div>
        <div class="hero-metric help-target flow" ${helpAttrs("heroCostDiff")}><span>${icon("budget")}Cost difference</span><strong>${formatCostDifferencePct(winner, runnerUp)}</strong></div>
        <div class="hero-metric help-target flow" ${helpAttrs("heroNetWorthDiff")}><span>${icon("car")}Net worth difference</span><strong>${formatNetWorthDifferencePct(winner, runnerUp)}</strong></div>
      ` : "";
      bindRankButton();
      bindHelp();
    }

    function bindRankButton() {
      if (!document.querySelectorAll) return;
      document.querySelectorAll("[data-rank-toggle]").forEach((button) => {
        button.textContent = state.rankingOpen ? "Hide rank" : "Rank";
        if (button.dataset.rankBound) return;
        button.dataset.rankBound = "1";
        button.addEventListener("click", () => {
          const opening = !state.rankingOpen;
          toggleRanking();
          button.dataset.originalText = opening ? "Hide rank" : "Rank";
          buttonFeedback(button, opening ? "Shown" : "Hidden");
          showToast(opening ? "Ranking shown" : "Ranking hidden");
        });
      });
      const close = document.getElementById("rankingClose");
      if (close && !close.dataset.rankBound) {
        close.dataset.rankBound = "1";
        close.addEventListener("click", () => {
          toggleRanking(false);
          buttonFeedback(close, "Hidden");
          showToast("Ranking hidden");
        });
      }
    }

    function toggleRanking(forceOpen) {
      state.rankingOpen = typeof forceOpen === "boolean" ? forceOpen : !state.rankingOpen;
      if (!state.rankingOpen) state.rankingControlsRendered = false;
      update();
      const panel = document.getElementById("rankingPanel");
      if (state.rankingOpen && panel && panel.scrollIntoView) panel.scrollIntoView({ behavior:"smooth", block:"start" });
    }

    function renderRankingControls() {
      const tools = document.getElementById("rankingTools");
      if (!tools) return;
      if (state.rankingControlsRendered && tools.querySelector("[data-ranking-filter]")) return;
      tools.innerHTML = `
        <label class="search-control" for="rankingSearch"><span class="icon">${iconOnly("search")}</span><input id="rankingSearch" data-ranking-filter="search" type="search" placeholder="Search" value="${escapeHtml(state.rankingFilters.search)}"></label>
        <button class="small-button" id="rankingClose" type="button">Hide</button>
      `;
      state.rankingControlsRendered = true;
      bindRankingControls();
      bindRankButton();
    }

    function bindRankingControls() {
      if (!document.querySelectorAll) return;
      document.querySelectorAll("[data-ranking-filter]").forEach((input) => {
        if (input.dataset.filterBound) return;
        input.dataset.filterBound = "1";
        const eventName = input.tagName === "SELECT" ? "change" : "input";
        input.addEventListener(eventName, () => {
          state.rankingFilters[input.dataset.rankingFilter] = input.value;
          state.rankingVisibleCount = rankingPageSize;
          state.rankingShowAll = false;
          renderRankingResults();
        });
        if (input.dataset.rankingFilter === "search") {
          input.addEventListener("keydown", (event) => {
            if (event.key === "Enter") input.blur();
          });
        }
      });
      document.querySelectorAll("[data-ranking-sort]").forEach((button) => {
        if (button.dataset.sortBound) return;
        button.dataset.sortBound = "1";
        button.addEventListener("click", () => setRankingSort(button.dataset.rankingSort));
      });
      document.querySelectorAll("[data-ranking-page]").forEach((button) => {
        if (button.dataset.pageBound) return;
        button.dataset.pageBound = "1";
        button.addEventListener("click", () => {
          if (button.dataset.rankingPage === "more") {
            state.rankingVisibleCount += rankingPageSize;
            showToast("More shown");
          } else {
            state.rankingShowAll = true;
            showToast("All shown");
          }
          buttonFeedback(button, button.dataset.rankingPage === "more" ? "Shown" : "All");
          renderRankingResults();
        });
      });
    }

    function setRankingSort(field) {
      if (state.rankingSort.field === field) {
        state.rankingSort.direction = state.rankingSort.direction === "asc" ? "desc" : "asc";
      } else {
        state.rankingSort.field = field;
        state.rankingSort.direction = field === "totalPaid" ? "asc" : "desc";
      }
      renderRankingResults();
    }

    function renderRanking() {
      const panel = document.getElementById("rankingPanel");
      if (!panel) return;
      panel.hidden = !state.rankingOpen;
      if (!state.rankingOpen) return;
      renderRankingControls();
      renderRankingResults();
    }

    function renderRankingResults() {
      const panel = document.getElementById("rankingPanel");
      const table = document.getElementById("rankingTable");
      const summary = document.getElementById("rankingSummary");
      if (!panel || !table || panel.hidden || !state.rankingOpen) return;
      const orderedRows = rankRowsForCurrentSort(M.rankCarDatabase(state.assumptions, state.scoreWeights));
      const rows = orderedRows.filter((row) => {
        const model = M.carModelById(row.modelId) || row;
        return rankingRowMatches(row, model);
      });
      const visibleRows = state.rankingShowAll ? rows : rows.slice(0, state.rankingVisibleCount);
      const top = orderedRows[0];
      const total = M.CAR_DATABASE.length;
      if (summary) summary.textContent = rows.length ? `${rows.length}/${total} cars. Showing ${visibleRows.length}. Best: #${top.globalRank} ${top.carName}.` : "No matches.";
      table.innerHTML = `<table><thead><tr>
        <th>Rank</th>
        <th>Car</th>
        <th>Category</th>
        ${rankingHeader("totalPaid", "Total paid")}
        ${rankingHeader("finalMoney", "Net worth")}
        ${rankingHeader("score", "Score")}
      </tr></thead><tbody>${visibleRows.map((row, index) => `
        <tr>
          <td>#${row.globalRank}</td>
          <td><strong class="${row.globalRank === 1 ? "winner" : ""}">${escapeHtml(row.carName)}</strong></td>
          <td>${escapeHtml(carCategoryGroup(M.carModelById(row.modelId) || row))}</td>
          <td>${euro(row.totalPaid)}</td>
          <td class="${row.globalRank === 1 ? "winner" : ""}">${euro(row.finalMoney)}</td>
          <td>${number(row.qualityScore, 1)}/10</td>
        </tr>
      `).join("")}</tbody></table>${rankingPager(rows.length, visibleRows.length)}`;
      bindRankingControls();
    }

    function rankingRowMatches(row, model) {
      const filters = state.rankingFilters;
      const query = (filters.search || "").trim().toLowerCase();
      if (query && !modelMatchesSearch(model, query)) return false;
      return true;
    }

    function rankRowsForCurrentSort(rows) {
      const field = state.rankingSort.field;
      const direction = state.rankingSort.direction === "desc" ? -1 : 1;
      const getters = {
        totalPaid: (row) => row.totalPaid,
        finalMoney: (row) => row.finalMoney,
        score: (row) => row.qualityScore,
      };
      const getter = getters[field] || getters.finalMoney;
      return rows.slice().sort((a, b) => {
        const av = getter(a);
        const bv = getter(b);
        return (av - bv) * direction || a.carName.localeCompare(b.carName);
      }).map((row, index) => Object.assign({}, row, { globalRank: index + 1 }));
    }

    function rankingHeader(field, label) {
      const active = state.rankingSort.field === field;
      const arrow = active ? (state.rankingSort.direction === "asc" ? " ↑" : " ↓") : "";
      return `<th><button class="sort-button" type="button" data-ranking-sort="${field}" aria-label="Sort by ${escapeHtml(label)}">${escapeHtml(label)}${arrow}</button></th>`;
    }

    function rankingPager(totalRows, visibleCount) {
      if (visibleCount >= totalRows) return "";
      return `<div class="ranking-pager"><button class="small-button" type="button" data-ranking-page="more">Show more</button><button class="small-button" type="button" data-ranking-page="all">Show all</button></div>`;
    }

    function formatPct(value) {
      return `${value >= 0 ? "+" : ""}${number(value, 1)}%`;
    }

    function percentageDifference(a, b) {
      const base = Math.abs(finite(b));
      return base > 0 ? (finite(a) - finite(b)) / base * 100 : 0;
    }

    function formatCostDifferencePct(winner, runnerUp) {
      if (!winner || !runnerUp) return "+0.0%";
      return formatPct(percentageDifference(winner.totalPaid, runnerUp.totalPaid));
    }

    function formatNetWorthDifferencePct(winner, runnerUp) {
      if (!winner || !runnerUp) return "+0.0%";
      return formatPct(percentageDifference(winner.finalMoney, runnerUp.finalMoney));
    }

    function euroDifference(a, b) {
      const diff = finite(a) - finite(b);
      const sign = diff >= 0 ? "+" : "";
      return `${sign}${euro(diff)}`;
    }

    function signedEuro(value) {
      const amount = finite(value);
      return `${amount >= 0 ? "+" : ""}${euro(amount)}`;
    }

    function heroComparisonText(topic) {
      const result = latestResult || M.analyze(state);
      const winner = result.winner;
      const other = result.runnerUp;
      if (!winner || !other) return "";
      const years = number(result.assumptions.yearsOwned, 1);
      const netDiff = winner.finalMoney - other.finalMoney;
      const paidDiff = winner.totalPaid - other.totalPaid;
      const paidDirection = paidDiff <= 0 ? "cheaper" : "more expensive";
      const base = `${winner.option} leaves ${euro(winner.finalMoney)} after ${years} years. ${other.option} leaves ${euro(other.finalMoney)}. Net worth difference: ${signedEuro(netDiff)}. Total paid: ${winner.option} ${euro(winner.totalPaid)}, ${other.option} ${euro(other.totalPaid)}. Cost difference: ${signedEuro(paidDiff)}.`;
      if (topic === "cost") return `${winner.option} is ${Math.abs(percentageDifference(winner.totalPaid, other.totalPaid)).toLocaleString("en-IE", { maximumFractionDigits:1 })}% ${paidDirection} on total paid. ${base}`;
      if (topic === "net") return `${winner.option} leaves ${formatNetWorthDifferencePct(winner, other)} more net worth than ${other.option}. ${base}`;
      return base;
    }

    function renderWarnings(result) {
      const seen = new Set();
      const warnings = result.warnings.filter((item) => {
        const key = `${item.option}-${item.message}`;
        if (seen.has(key)) return false;
        seen.add(key);
        return true;
      });
      document.getElementById("warningBox").innerHTML = warnings.length ? warnings.map((item) => `
        <div class="notice ${item.severity === "no" ? "no" : ""}">${icon("warning")}<span>${escapeHtml(item.message)}</span></div>
      `).join("") : "";
    }

    function renderMobileResults(result) {
      document.getElementById("mobileResultCards").innerHTML = result.rows.map((row) => `
        <article class="mobile-card help-target" ${helpAttrs(`row.${row.carKey}.option`)}>
          <strong class="${row.isWinner ? "winner" : ""}">${escapeHtml(row.option)}</strong>
          <p>${euro(row.finalMoney)} net worth</p>
          <div class="meta">${rowBadges(row)}</div>
        </article>
      `).join("");
    }

    function renderTable(result) {
      document.getElementById("primaryTable").innerHTML = `<table><thead><tr>
        <th>Option</th>
        <th>Car/month</th>
        <th>Car total</th>
        <th>Costs/month</th>
        <th>Costs total</th>
        <th>Total paid</th>
        <th>Net worth</th>
      </tr></thead><tbody>${result.rows.map((row) => `
        <tr>
          <td class="help-target" ${helpAttrs(`row.${row.carKey}.option`)}><strong class="${row.isWinner ? "winner" : ""}">${escapeHtml(row.option)}</strong><div class="meta">${rowBadges(row)}</div></td>
          <td class="help-target" ${helpAttrs(`row.${row.carKey}.carMonth`)}>${euro(row.carMonthlyPaymentDisplay)}/mo</td>
          <td class="help-target" ${helpAttrs(`row.${row.carKey}.carTotal`)}>${euro(row.carTotalDisplay)}${row.loanStillOwed > 0 ? `<br><span class="pill warn">loan continues</span>` : ""}</td>
          <td class="help-target" ${helpAttrs(`row.${row.carKey}.costsMonth`)}>${euro(row.monthlyRunningCost)}/mo</td>
          <td class="help-target" ${helpAttrs(`row.${row.carKey}.costsTotal`)}>${euro(row.extraTotal)}</td>
          <td class="help-target" ${helpAttrs(`row.${row.carKey}.totalPaid`)}>${euro(row.totalPaid)}</td>
          <td class="help-target ${row.isWinner ? "winner" : ""}" ${helpAttrs(`row.${row.carKey}.netWorth`)}>${euro(row.finalMoney)}</td>
        </tr>
      `).join("")}</tbody></table>`;
      bindHelp();
    }

    function rowBadges(row) {
      const badges = [];
      const warningIds = new Set(row.warnings.map((warning) => warning.id));
      if (warningIds.has("missing-name") || warningIds.has("missing-price") || warningIds.has("resale-invalid")) badges.push(chip("Missing value", "no"));
      if (warningIds.has("upfront-cash") || warningIds.has("down-cash")) badges.push(chip("Initial cash not enough", "no"));
      if (warningIds.has("monthly-budget")) badges.push(chip("Monthly budget exceeded", "warn"));
      if (warningIds.has("loan-long")) badges.push(chip("Loan continues", "warn"));
      return badges.join("");
    }

    init();
  </script>
</body>
</html>
