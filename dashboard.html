<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Car Value Studio</title>
  <style>
    :root {
      color-scheme: light;
      --bg:#f7f8f6;
      --surface:rgba(255,255,255,.78);
      --solid:#ffffff;
      --ink:#111416;
      --muted:#687178;
      --soft:#eef1ee;
      --line:rgba(20,24,26,.12);
      --line-strong:rgba(20,24,26,.2);
      --green:#2f6253;
      --blue:#355f8d;
      --gold:#9a6b20;
      --rose:#94515d;
      --good:#167253;
      --warn:#986a13;
      --bad:#a9443c;
      --shadow:0 22px 70px rgba(23,27,30,.1);
      --shadow-soft:0 12px 34px rgba(23,27,30,.08);
      --radius:8px;
      --pill:999px;
      --max:1180px;
      font-family:-apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", Inter, Segoe UI, ui-sans-serif, system-ui, sans-serif;
      color:var(--ink);
      background:var(--bg);
    }
    * { box-sizing:border-box; }
    html { min-width:320px; background:var(--bg); scroll-behavior:smooth; }
    body {
      margin:0;
      min-width:320px;
      color:var(--ink);
      background:
        linear-gradient(135deg, rgba(255,255,255,.95) 0%, rgba(244,247,248,.92) 42%, rgba(240,239,234,.92) 100%),
        repeating-linear-gradient(90deg, rgba(17,20,22,.025) 0 1px, transparent 1px 80px);
      font-size:15px;
      line-height:1.45;
    }
    body::before {
      content:"";
      position:fixed;
      inset:0;
      pointer-events:none;
      background:linear-gradient(180deg, rgba(255,255,255,.72), rgba(255,255,255,0) 360px);
      z-index:-1;
    }
    a { color:inherit; text-decoration:none; }
    button, input, select { font:inherit; }
    button { cursor:pointer; }
    h1, h2, h3, p { margin:0; }
    h1 { font-size:clamp(42px,7vw,82px); line-height:.92; letter-spacing:0; font-weight:690; }
    h2 { font-size:clamp(26px,4vw,44px); line-height:1; letter-spacing:0; font-weight:680; }
    h3 { font-size:18px; line-height:1.15; font-weight:670; }
    img { max-width:100%; display:block; }
    .shell { width:min(var(--max), calc(100% - clamp(22px,5vw,72px))); margin:0 auto; }
    .topbar {
      position:sticky;
      top:10px;
      z-index:30;
      margin:10px auto 18px;
      padding:8px;
      border:1px solid var(--line);
      border-radius:var(--pill);
      background:rgba(255,255,255,.72);
      box-shadow:0 8px 24px rgba(17,20,22,.06);
      backdrop-filter:blur(22px) saturate(1.18);
      -webkit-backdrop-filter:blur(22px) saturate(1.18);
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:8px;
    }
    .brand { display:flex; align-items:center; gap:9px; padding:8px 12px; font-weight:720; letter-spacing:0; }
    .brand-mark { width:24px; height:24px; border-radius:50%; background:linear-gradient(145deg,var(--ink),#49545c); box-shadow:inset 0 1px 0 rgba(255,255,255,.35); }
    .nav { display:flex; align-items:center; gap:3px; }
    .nav a, .mobile-nav a {
      min-height:36px;
      padding:8px 13px;
      border-radius:var(--pill);
      color:#3b4348;
      font-size:13px;
      font-weight:680;
    }
    .nav a.active, .mobile-nav a.active { background:var(--ink); color:white; }
    main { padding:8px 0 84px; }
    .page { animation:fadeUp .28s ease both; }
    @keyframes fadeUp { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
    .hero {
      min-height:min(740px, calc(100vh - 96px));
      display:grid;
      grid-template-columns:minmax(0,1fr) minmax(310px,.86fr);
      align-items:center;
      gap:26px;
      padding:28px 0 36px;
    }
    .hero-copy { display:grid; gap:24px; align-content:center; }
    .eyebrow { display:inline-flex; width:max-content; align-items:center; gap:8px; color:var(--green); font-size:12px; text-transform:uppercase; font-weight:760; letter-spacing:.08em; }
    .hero p, .section-lead { max-width:640px; color:#5e6870; font-size:clamp(16px,2vw,20px); line-height:1.45; }
    .actions { display:flex; flex-wrap:wrap; gap:10px; align-items:center; }
    .button, .icon-button, .chip, .mode-button {
      border:1px solid var(--line-strong);
      background:rgba(255,255,255,.82);
      color:var(--ink);
      box-shadow:0 1px 0 rgba(255,255,255,.8) inset;
      transition:transform .16s ease, box-shadow .16s ease, border-color .16s ease, background .16s ease;
    }
    .button {
      min-height:44px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:9px;
      padding:11px 16px;
      border-radius:var(--pill);
      font-weight:720;
    }
    .button.primary { background:var(--ink); border-color:var(--ink); color:white; }
    .button:hover, .icon-button:hover, .chip:hover, .mode-button:hover, .card:hover { transform:translateY(-2px); box-shadow:var(--shadow-soft); }
    .button:focus-visible, .icon-button:focus-visible, input:focus-visible, select:focus-visible, .card:focus-visible, .chip:focus-visible, .mode-button:focus-visible {
      outline:3px solid rgba(53,95,141,.2);
      outline-offset:2px;
      border-color:var(--blue);
    }
    .icon-button {
      width:42px;
      height:42px;
      display:inline-grid;
      place-items:center;
      border-radius:50%;
    }
    .icon-button svg, .button svg, .tool-icon svg, .eyebrow svg { width:18px; height:18px; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
    .glass {
      border:1px solid var(--line);
      background:var(--surface);
      box-shadow:var(--shadow-soft);
      backdrop-filter:blur(24px) saturate(1.16);
      -webkit-backdrop-filter:blur(24px) saturate(1.16);
    }
    .feature-stage {
      min-height:500px;
      border-radius:28px;
      overflow:hidden;
      display:grid;
      grid-template-rows:minmax(260px,1fr) auto;
    }
    .car-art {
      min-height:260px;
      background:#eef1ef;
      display:grid;
      place-items:center;
      position:relative;
      overflow:hidden;
    }
    .car-art img { width:100%; height:100%; object-fit:cover; }
    .feature-caption { padding:18px; display:grid; gap:12px; }
    .caption-top { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; }
    .muted { color:var(--muted); }
    .mini { color:var(--muted); font-size:12px; font-weight:560; }
    .stats { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px; }
    .stat, .score-card, .metric {
      border:1px solid var(--line);
      border-radius:var(--radius);
      background:rgba(255,255,255,.64);
      padding:12px;
      min-width:0;
    }
    .stat span, .metric span { display:block; color:var(--muted); font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; }
    .stat strong, .metric strong { display:block; margin-top:4px; font-size:17px; line-height:1.12; letter-spacing:0; overflow-wrap:anywhere; }
    .section { padding:42px 0; }
    .section-head { display:flex; align-items:end; justify-content:space-between; gap:18px; margin-bottom:18px; }
    .grid { display:grid; gap:14px; }
    .cards { grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); }
    .car-grid { grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); }
    .card {
      border:1px solid var(--line);
      border-radius:var(--radius);
      background:rgba(255,255,255,.72);
      box-shadow:0 1px 0 rgba(255,255,255,.85) inset;
      overflow:hidden;
      transition:transform .16s ease, box-shadow .16s ease, border-color .16s ease;
    }
    .card-body { padding:15px; display:grid; gap:13px; }
    .card-art { height:150px; background:#edf0ef; }
    .card-art img { width:100%; height:100%; object-fit:cover; }
    .card-title { display:flex; align-items:flex-start; justify-content:space-between; gap:10px; }
    .tag-row { display:flex; flex-wrap:wrap; gap:7px; }
    .tag, .chip {
      display:inline-flex;
      align-items:center;
      min-height:28px;
      border-radius:var(--pill);
      padding:6px 10px;
      font-size:12px;
      font-weight:650;
    }
    .tag { color:#4b555c; background:#edf1f0; border:1px solid rgba(17,20,22,.06); }
    .tag.green { background:#e6f2ed; color:var(--green); }
    .tag.blue { background:#e8eef7; color:var(--blue); }
    .tag.gold { background:#f5eddd; color:var(--gold); }
    .tag.rose { background:#f3e8eb; color:var(--rose); }
    .toolbar {
      display:grid;
      grid-template-columns:minmax(180px,1fr) minmax(150px,240px) auto;
      gap:10px;
      align-items:center;
      margin:0 0 16px;
    }
    input, select {
      width:100%;
      min-height:44px;
      border:1px solid var(--line-strong);
      border-radius:var(--pill);
      padding:10px 14px;
      background:rgba(255,255,255,.84);
      color:var(--ink);
      box-shadow:0 1px 0 rgba(255,255,255,.8) inset;
    }
    select { appearance:auto; }
    label { display:grid; gap:7px; color:#333c42; font-size:13px; font-weight:650; }
    .label-row { display:flex; align-items:center; justify-content:space-between; gap:10px; }
    .form-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:12px; }
    .panel {
      border:1px solid var(--line);
      border-radius:var(--radius);
      background:rgba(255,255,255,.72);
      padding:16px;
      box-shadow:var(--shadow-soft);
    }
    .wide-layout { display:grid; grid-template-columns:minmax(0,.82fr) minmax(0,1.18fr); gap:16px; align-items:start; }
    .tool-layout { display:grid; grid-template-columns:minmax(260px,.78fr) minmax(0,1.22fr); gap:16px; align-items:start; }
    .compact-row { display:grid; grid-template-columns:1fr auto; gap:10px; align-items:center; }
    .compare-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px; }
    .comparison-table { display:grid; gap:8px; }
    .compare-line {
      display:grid;
      grid-template-columns:minmax(110px,.7fr) repeat(var(--cols,2),minmax(0,1fr));
      gap:8px;
      align-items:stretch;
    }
    .compare-line > div {
      min-width:0;
      min-height:42px;
      border:1px solid var(--line);
      border-radius:var(--radius);
      padding:10px;
      background:rgba(255,255,255,.64);
      overflow:hidden;
      text-overflow:ellipsis;
      overflow-wrap:anywhere;
    }
    .score-bar {
      height:8px;
      border-radius:var(--pill);
      background:#e7ebe9;
      overflow:hidden;
      margin-top:8px;
    }
    .score-bar i { display:block; height:100%; width:var(--w,50%); background:linear-gradient(90deg,var(--green),var(--blue)); border-radius:inherit; }
    .detail-hero {
      display:grid;
      grid-template-columns:minmax(0,1fr) minmax(300px,.92fr);
      gap:18px;
      align-items:stretch;
      padding:18px 0 24px;
    }
    .detail-title { display:grid; align-content:center; gap:18px; padding:28px; border-radius:28px; min-height:320px; }
    .detail-art { border-radius:28px; overflow:hidden; min-height:320px; }
    .spec-strip { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; }
    .ranking-list { display:grid; gap:10px; }
    .rank-row {
      display:grid;
      grid-template-columns:54px minmax(190px,1.1fr) repeat(4,minmax(110px,.7fr));
      gap:8px;
      align-items:center;
      border:1px solid var(--line);
      border-radius:var(--radius);
      background:rgba(255,255,255,.72);
      padding:10px;
    }
    .rank-num { font-size:22px; font-weight:720; color:var(--blue); }
    .mode-bar { display:flex; flex-wrap:wrap; gap:8px; }
    .mode-button { min-height:38px; border-radius:var(--pill); padding:8px 12px; font-weight:680; }
    .mode-button.active { background:var(--ink); border-color:var(--ink); color:white; }
    .mobile-nav {
      display:none;
      position:fixed;
      left:10px;
      right:10px;
      bottom:10px;
      z-index:35;
      padding:7px;
      border:1px solid var(--line);
      border-radius:var(--pill);
      background:rgba(255,255,255,.82);
      box-shadow:0 12px 32px rgba(17,20,22,.14);
      backdrop-filter:blur(22px);
      -webkit-backdrop-filter:blur(22px);
      justify-content:space-between;
    }
    .empty { padding:24px; text-align:center; color:var(--muted); }
    [hidden] { display:none !important; }
    @media (max-width:860px) {
      .nav { display:none; }
      .mobile-nav { display:flex; }
      .topbar { top:0; margin-top:0; border-radius:0 0 18px 18px; width:100%; }
      .hero, .wide-layout, .tool-layout, .detail-hero { grid-template-columns:1fr; }
      .hero { min-height:auto; padding-top:18px; }
      .feature-stage, .detail-title, .detail-art { min-height:300px; }
      .toolbar { grid-template-columns:1fr; }
      .compare-line { grid-template-columns:1fr; }
      .rank-row { grid-template-columns:42px minmax(0,1fr); }
      .rank-row .hide-mobile { display:none; }
      .section-head { display:grid; align-items:start; }
    }
    @media (max-width:520px) {
      .shell { width:min(100% - 20px, var(--max)); }
      h1 { font-size:42px; }
      .stats, .spec-strip { grid-template-columns:1fr 1fr; }
      .card-art { height:132px; }
      .actions .button { width:100%; }
    }
  </style>
</head>
<body>
  <header class="topbar shell" aria-label="Main navigation">
    <a class="brand" href="#home" aria-label="Car Value Studio home"><span class="brand-mark" aria-hidden="true"></span><span>Car Value Studio</span></a>
    <nav class="nav">
      <a href="#home" data-nav="home">Home</a>
      <a href="#cars" data-nav="cars">Cars</a>
      <a href="#tools" data-nav="tools">Tools</a>
      <a href="#ranking" data-nav="ranking">Ranking</a>
    </nav>
  </header>
  <main id="app" class="shell"></main>
  <nav class="mobile-nav" aria-label="Mobile navigation">
    <a href="#home" data-nav="home">Home</a>
    <a href="#cars" data-nav="cars">Cars</a>
    <a href="#tools" data-nav="tools">Tools</a>
    <a href="#ranking" data-nav="ranking">Rank</a>
  </nav>
  <datalist id="carChoices"></datalist>
  <script>
(function initCarDatabase(root, factory) {
  const cars = factory();
  if (typeof module !== "undefined" && module.exports) module.exports = cars;
  root.CarCompareDatabase = cars;
})(typeof globalThis !== "undefined" ? globalThis : this, function buildCarDatabase() {
  "use strict";

  // Assumption basis, May 2026:
  // - Values are source-informed estimates, not scraped live listings. They use official/WLTP/EPA/spec baselines,
  //   EU real-world consumption evidence, Portugal used-market bands, and owner/reliability heuristics.
  // - Portuguese used-price sanity checks used Standvirtual/OLX/PiscaPisca/AutoScout24/AutoUncle-style market ranges.
  // - EV consumption uses WLTP/spec baselines adjusted toward EV Database/Green NCAP/owner-report mixed use.
  // - Portugal IUC is estimated from fuel type, displacement/CO2 bands, and EV exemption context; exact values vary
  //   by registration date, import status, engine, CO2, municipality, and legal changes.
  // - Insurance uses Portugal market ranges by value/class, then scales for luxury, repair complexity, theft, and performance.

  // - resaleRetentionEstimate is the approximate retained share after the app default 7-year ownership period.
  const SHARED_SOURCE_NOTES = {
    ev: "Official WLTP/spec baseline plus EV Database/Green NCAP/owner-report style real-world adjustment; Portugal EV IUC assumed exempt.",
    mainstream: "Official mixed-cycle baseline adjusted above brochure/WLTP using European real-world fuel-use evidence and owner reports; Portugal IUC estimated by typical trim band.",
    luxury: "Official/spec baseline adjusted for heavy real-world use; Portugal costs estimated from premium insurance, dealer maintenance, and reliability/owner-cost reports.",
    supercar: "Low-confidence Europe/global owner-cost estimate using specialist service, tire/brake, insurance, and collector-market reports; Portugal-specific data is sparse.",
    classic: "Older-car estimate using owner-report economy and age-related repair reserve; resale may be collector-driven rather than ordinary depreciation.",
  };

  function profile(firstYearRetention, annualRetention, minRetention, note) {
    return { firstYearRetention, annualRetention, minRetention, note };
  }

  function extra(id, displayName, categoryGroup, category, price, energyType, fuelType, kwh, liters, maintenance, insurance, repairs, tax, profileValues, resale, notes, confidence, sourceNotes, market = "Portugal/EU") {
    return {

      displayName,
      brand: "",
      model: displayName,
      generation: "",
      yearRange: "",

      segment: categoryGroup,
      marketContext: market,
      typicalMarket: market,
      defaultUpfrontPrice: price,
      energyType,
      fuelType,
      realWorldKwhPer100km: kwh,
      realWorldLitersPer100km: liters,
      maintenancePerYear: maintenance,
      insurancePerYear: insurance,
      repairsPerYear: repairs,
      taxPerYear: tax,

      confidence,

  const EXTRA_CARS = [
    extra("toyota-aygo", "Toyota Aygo", "Cheap city cars", "combustion", 7000, "fuel", "petrol", 0, 5.1, 390, 270, 360, 65, [0.80, 0.91, 0.16, "Cheap city car with strong Toyota reliability and low tax."], 0.42, "Simple city car; realistic mixed use above brochure figures.", "medium", SHARED_SOURCE_NOTES.mainstream),
    extra("hyundai-i10", "Hyundai i10", "Cheap city cars", "combustion", 8000, "fuel", "petrol", 0, 5.3, 400, 290, 380, 70, [0.78, 0.90, 0.14, "Budget city car with low running costs."], 0.38, "Small petrol estimate; motorway use raises consumption.", "medium", SHARED_SOURCE_NOTES.mainstream),
    extra("kia-picanto", "Kia Picanto", "Cheap city cars", "combustion", 8500, "fuel", "petrol", 0, 5.4, 400, 290, 380, 70, [0.78, 0.90, 0.14, "Low-cost city car with simple maintenance."], 0.38, "Portugal/EU city-car estimate.", "medium", SHARED_SOURCE_NOTES.mainstream),
    extra("volkswagen-up", "Volkswagen Up!", "Cheap city cars", "combustion", 8500, "fuel", "petrol", 0, 5.2, 430, 300, 390, 70, [0.80, 0.91, 0.15, "Small VW with steady used demand."], 0.41, "Older small VW estimate; parts are modestly above Dacia/Fiat.", "medium", SHARED_SOURCE_NOTES.mainstream),

    extra("seat-leon", "SEAT Leon", "Common family cars", "combustion", 15500, "fuel", "petrol/diesel", 0, 5.9, 620, 430, 580, 150, [0.78, 0.90, 0.15, "Common VW-group family hatch with good parts availability."], 0.37, "Iberian-market family hatch estimate.", "high", SHARED_SOURCE_NOTES.mainstream),

    extra("ford-focus", "Ford Focus", "Common family cars", "combustion", 13500, "fuel", "petrol/diesel", 0, 6.1, 610, 410, 620, 150, [0.76, 0.89, 0.13, "Common family hatch with average residuals."], 0.35, "Portugal/EU mixed-use estimate.", "medium", SHARED_SOURCE_NOTES.mainstream),

  function generated(id, displayName, group, category, price, energyType, fuelType, kwh, liters, reliabilityBias = 0) {
    const ev = energyType === "electricity";
    const hybrid = category === "hybrid";
    const premium = group === "Premium cars" || group === "Premium EVs" || group === "Luxury cars";
    const sports = group === "Sports cars";
    const city = group === "Cheap city cars";
    const valueBand = Math.max(0, price / 10000);
    const maintenance = Math.round((ev ? 260 : city ? 380 : hybrid ? 520 : 500) + valueBand * (premium ? 130 : sports ? 115 : 42));
    const insurance = Math.round((city ? 260 : ev ? 390 : 330) + valueBand * (premium ? 145 : sports ? 120 : 45));
    const repairs = Math.round((ev ? 420 : city ? 380 : hybrid ? 460 : 500) + valueBand * (premium ? 170 : sports ? 150 : 55) - reliabilityBias * 30);
    const tax = ev ? 0 : Math.round((city ? 65 : hybrid ? 110 : 120) + valueBand * (premium ? 38 : sports ? 32 : 18));
    const first = ev ? 0.72 : hybrid ? 0.81 : premium ? 0.74 : sports ? 0.82 : 0.78;
    const annual = ev ? 0.875 : hybrid ? 0.915 : premium ? 0.89 : sports ? 0.93 : 0.90;
    const resale = Math.max(0.22, Math.min(0.52, first * Math.pow(annual, 6)));
    const source = ev ? SHARED_SOURCE_NOTES.ev : premium || sports ? SHARED_SOURCE_NOTES.luxury : SHARED_SOURCE_NOTES.mainstream;
    return extra(id, displayName, group, category, price, energyType, fuelType, kwh, liters, maintenance, insurance, repairs, tax, [first, annual, ev ? 0.09 : 0.14, `${group} estimate with conservative Portugal/EU ownership assumptions.`], Number(resale.toFixed(2)), "Generated daily-driver estimate from official/spec class baselines, European real-world adjustment, and Portugal ownership cost bands.", "medium", source);
  }

      const price = roundTo(price2024 * factor, 500);
      const displayName = `Tesla ${modelName} ${trim} ${year}`;
      rows.push(generated(`tesla-${slug(modelName)}-${slug(trim)}-${year}`, displayName, group, "ev", price, "electricity", null, kwh, 0, reliabilityBias));
    };

    [2019, 2020].forEach((year) => {
      add("Model 3", "Standard Range Plus", year, 30000, 16.2);
      add("Model 3", "Long Range", year, 36000, 17.0);
      add("Model 3", "Performance", year, 41000, 18.4, "Premium EVs", 0);

  function catalogRows() {
    const targetRows = 9500;
    const years = Array.from({ length: 19 }, (_, index) => {
      const year = 2026 - index;
      return [
        year,
        yearFactor(year),
        generationIndexForYear(year),
        year >= 2025 ? "new/current Portugal/EU value" : year >= 2020 ? "recent used Portugal/EU value" : year >= 2014 ? "older used Portugal/EU value" : "budget used Portugal/EU value",
      ];
    });
    const rows = [];
    const flatModels = Object.entries(BRAND_MODELS).flatMap(([brand, models]) => models.map((modelName) => [brand, modelName]));

      const meta = inferGroupAndPowertrain(brand, modelName);

      const price = roundTo(baseValueFor(meta.group, brand, modelName, generationIndex) * valueFactor, meta.group === "Sports cars" || meta.group === "Luxury cars" ? 5000 : 500);
      const ev = meta.energyType === "electricity";
      const ageLoad = Math.max(0, (2026 - year) * 0.03);
      const liters = ev ? 0 : Number((meta.group === "Sports cars" ? 8.5 + price / 70000 : meta.group === "Luxury cars" ? 8.2 + price / 90000 : meta.category === "hybrid" ? 4.7 + price / 60000 : meta.group === "Cheap city cars" ? 5.3 : meta.group === "SUVs" ? 6.7 : 6.0 + ageLoad).toFixed(1));

        const variantEnergy = variant.energyType || meta.energyType;

        const variantFuelType = variant.fuelType === undefined ? meta.fuelType : variant.fuelType;

        rows.push(generated(
          `${id}-${slug(variant.trim)}`,
          `${brand} ${modelName} ${variant.trim} ${year}`,
          variantGroup,
          variantCategory,
          Math.max(1000, Math.round(price * variant.priceFactor / 500) * 500),
          variantEnergy,
          variantFuelType,
          variantEv ? Number((kwh * variant.kwhFactor).toFixed(1)) : 0,
          variantEv ? 0 : Number((liters * variant.litersFactor).toFixed(1)),
          (/toyota|honda|lexus/.test(text) ? 2 : /alfa|jeep|land rover|mclaren/.test(text) ? -1 : 0) + variant.reliabilityBias
        ));
      });
    };
    flatModels.forEach(([brand, modelName]) => {
      years.forEach(([year, valueFactor, generationIndex, context]) => {
        addRow(brand, modelName, year, valueFactor, context, generationIndex);

    return rows;

  function categoryGroup(car) {

    const suv = /suv|x1|x3|x5|x7|xm|gl[a-z]|gle|gls|gla|glb|q2|q3|q4|q5|q7|q8|xc40|xc60|xc90|rav4|cr-v|hr-v|c-hr|yaris-cross|tucson|sportage|sorento|santa-fe|qashqai|x-trail|juke|captur|kadjar|austral|2008|3008|5008|mokka|grandland|puma|kuga|cx-3|cx-5|cx-30|cx-60|tiguan|t-roc|t-cross|ateca|arona|kamiq|karoq|kodiaq|duster|range-rover|defender|discovery|macan|cayenne|model-y|id4|enyaq|ev6|ioniq-5|niro|atto-3|zs-ev|ev9|ex30|i-pace|eletre|levante|stelvio|ur[us]|grecale|tonale|formentor/.test(text) || /SUVs/i.test(original);

      if (suv || offRoad || pickup) return "EV SUV";

  function clampNumber(value, min, max) {
    return Math.min(max, Math.max(min, Number(value) || 0));

    return Math.round((Number(value) || 0) / step) * step;

    const text = `${car.id} ${car.displayName}`.toLowerCase();
    return {
      toyotaHonda: /toyota|honda|lexus/.test(text),
      korean: /hyundai|kia/.test(text),

  function reviewedScores(car) {
    const group = categoryGroup(car);
    const signals = brandSignals(car);
    const price = Number(car.defaultUpfrontPrice) || 0;
    const ev = car.energyType === "electricity";
    const hybrid = car.category === "hybrid";
    const supercar = car.category === "supercar";
    const luxury = car.category === "luxury" || /^Luxury/.test(group);
    const premium = luxury || /^EV (sedan|SUV)$/.test(group) && price >= 36000 || price >= 45000;
    const cheap = price <= 9000;
    const oldCheap = price <= 6500 || /206|107|c2|punto|modus|ka|note|toledo/.test(car.id);
    const suvish = /SUV|Crossover|Estate|MPV|Van|Pickup|Off-road/.test(group);
    const city = group === "City car";

    let reliability = 6;
    if (signals.toyotaHonda) reliability += 2.2;
    if (signals.korean) reliability += 1.2;
    if (signals.simpleValue) reliability += 0.6;
    if (signals.germanPremium) reliability -= 0.4;
    if (signals.fragilePremium) reliability -= 1.4;
    if (oldCheap) reliability -= 1.3;
    if (supercar) reliability -= 2.0;
    if (ev && !signals.fragilePremium) reliability += 0.6;

    let comfort = 5.2 + (premium ? 2.0 : 0) + (luxury ? 1.0 : 0) + (suvish ? 0.8 : 0) + (/Sedan|Estate/.test(group) ? 0.5 : 0) - (city ? 1.2 : 0) - (oldCheap ? 0.6 : 0) - (supercar ? 1.3 : 0);

    const repairs = Math.max(0, num(car.annualRepairs));
    const tax = Math.max(0, num(car.annualTax));
    return {
      energy,
      maintenance,
      insurance,
      repairs,
      tax,
      total: energy + maintenance + insurance + repairs + tax,
    };
  }

  function scenarioLabel(row) {
    const name = String(row && row.carName ? row.carName : row && row.name ? row.name : "").trim() || "Unnamed option";
    const mode = row && row.mode === PAYMENT_MODES.finance ? "finance" : "upfront";
    return `${name} ${mode}`;
  }

  function possibleStatus(warnings) {
    if (warnings.some((warning) => warning.severity === "no")) return "No";
    if (warnings.length) return "Warning";
    return "Yes";
  }

  function shortSummary(row, winner) {
    if (row.possible === "No") return "Impossible: upfront exceeds cash";
    if (row.loanStillOwed > 0) return "Warning: loan not paid";
    if (row.budgetDeficit > 0) return "Loses: high monthly cost";
    if (winner && row.id === winner.id) {
      if (row.averageMonthlyInvested > 0 && row.resaleValue > row.upfrontPrice * 0.35) return "Strong: low cost + resale";
      return "Wins: more invested";
    }
    if (row.resaleRisk) return "Risk: resale assumption high";
    return row.averageMonthlyInvested < (winner ? winner.averageMonthlyInvested : row.averageMonthlyInvested) ? "Loses: high monthly cost" : "Loses: less invested";
  }

  function warning(id, severity, message, carKey, option) {
    return { id, severity, message, carKey, option };
  }

  function buildWarnings(row, car, assumptions, months) {
    const warnings = [];
    if (!String(car.name || "").trim()) warnings.push(warning("missing-name", "warning", "Car name is missing.", row.carKey, row.option));
    if (num(car.upfrontPrice) <= 0) warnings.push(warning("missing-price", "no", "Cash price is missing.", row.carKey, row.option));
    if (row.mode === PAYMENT_MODES.upfront && num(car.upfrontPrice) > num(assumptions.initialCashBudget)) {
      warnings.push(warning("upfront-cash", "no", "Upfront price exceeds initial cash.", row.carKey, row.option));
    }
    if (row.mode === PAYMENT_MODES.finance && num(car.downPayment) > num(assumptions.initialCashBudget)) {
      warnings.push(warning("down-cash", "no", "Down payment exceeds initial cash.", row.carKey, row.option));
    }
    if (row.maxMonthlyCarCost > num(assumptions.monthlyBudget)) {
      warnings.push(warning("monthly-budget", "warning", "Monthly cost exceeds monthly budget.", row.carKey, row.option));
    }
    if (row.mode === PAYMENT_MODES.finance && row.loanStillOwed > 0) {
      warnings.push(warning("loan-long", "warning", "Loan still active after selected years.", row.carKey, row.option));
    }
    if (row.resaleValue < 0 || !Number.isFinite(row.resaleValue)) {
      warnings.push(warning("resale-invalid", "no", "Resale value is missing or negative.", row.carKey, row.option));
    }
    if (row.resaleValue > num(car.carValue, car.upfrontPrice) * 0.9 && normalizeYears(assumptions.yearsOwned) >= 2) {
      warnings.push(warning("resale-high", "warning", "Resale value looks suspiciously high.", row.carKey, row.option));
    }
    return warnings;
  }

  function simulateScenario(carInput, assumptionsInput, modeInput, yearsInput, carKeyInput) {
    const assumptions = Object.assign({}, DEFAULT_ASSUMPTIONS, assumptionsInput || {});
    const years = normalizeYears(yearsInput === undefined ? assumptions.yearsOwned : yearsInput);
    const months = analysisMonths(years);
    const monthlyRate = monthlyInvestmentRate(assumptions.marketReturn);
    const car = withCarDefaults(carInput, carKeyInput);
    const mode = modeInput === PAYMENT_MODES.finance ? PAYMENT_MODES.finance : PAYMENT_MODES.upfront;
    const finance = financeSummary(car);
    const isFinance = mode === PAYMENT_MODES.finance;
    const initialSpent = isFinance ? finance.downPayment : Math.max(0, num(car.upfrontPrice));
    let investmentBalance = Math.max(0, num(assumptions.initialCashBudget) - initialSpent);
    let totalDeficits = Math.max(0, initialSpent - num(assumptions.initialCashBudget));
    let monthlyInvestedTotal = 0;
    let carPaymentsPaid = initialSpent;
    let runningPaid = 0;
    let maxMonthlyCarCost = 0;
    const running = annualRunningBreakdown(car, assumptions);
    const monthlyRunning = running.total / 12;
    const yearly = [];

    for (let month = 1; month <= months; month += 1) {
      investmentBalance *= 1 + monthlyRate;
      const monthlyCarPayment = isFinance && month <= finance.loanMonths ? finance.monthlyPayment : 0;
      const monthlyTotalCarCost = monthlyCarPayment + monthlyRunning;
      const monthlyInvested = Math.max(0, num(assumptions.monthlyBudget) - monthlyTotalCarCost);
      const monthlyDeficit = Math.max(0, monthlyTotalCarCost - num(assumptions.monthlyBudget));
      investmentBalance += monthlyInvested;
      monthlyInvestedTotal += monthlyInvested;
      totalDeficits += monthlyDeficit;
      carPaymentsPaid += monthlyCarPayment;
      runningPaid += monthlyRunning;
      maxMonthlyCarCost = Math.max(maxMonthlyCarCost, monthlyTotalCarCost);

      if (month % 12 === 0) {
        const year = month / 12;
        const resaleAtYear = effectiveResaleValue(car, year);
        const loanAtYear = isFinance ? loanBalance(car, month) : 0;
        yearly.push({
          year,
          finalMoney: investmentBalance + resaleAtYear - loanAtYear - totalDeficits,
          investmentBalance,
          resaleValue: resaleAtYear,
          loanLeft: loanAtYear,
          totalDeficits,
          runningPaid,
          carPaymentsPaid,
        });
      }
    }

    const resaleValue = effectiveResaleValue(car, years);
    const loanStillOwed = isFinance ? loanBalance(car, months) : 0;
    const finalMoney = investmentBalance + resaleValue - loanStillOwed - totalDeficits;
    const totalRunningCost = runningPaid;
    const totalPaid = carPaymentsPaid + totalRunningCost;
    const paidByEnd = isFinance ? carPaymentsPaid : num(car.upfrontPrice);
    const row = {
      id: "",
      carKey: carKeyInput || "",
      carName: car.name,
      option: "",
      mode,
      type: car.type,
      years,
      months,
      possible: "Yes",
      warnings: [],
      upfrontPrice: num(car.upfrontPrice),
      carValue: num(car.carValue, car.upfrontPrice),
      initialSpent,
      carPaidDisplay: isFinance && finance.loanMonths > months ? paidByEnd : (isFinance ? finance.financeTotal : num(car.upfrontPrice)),
      carPaidNote: isFinance && finance.loanMonths > months ? "paid by selected year" : (isFinance ? "full finance term" : "paid upfront"),
      carMonthlyPaymentDisplay: isFinance ? finance.monthlyPayment : 0,
      carTotalDisplay: isFinance ? finance.financeTotal : num(car.upfrontPrice),
      carPaymentsPaid,
      financeTotal: finance.financeTotal,
      financingCost: isFinance ? finance.financingCost : 0,
      monthlyRunningCost: monthlyRunning,
      extraMonth: monthlyRunning,
      extraTotal: totalRunningCost,
      totalPaid,
      investedResult: investmentBalance,
      investmentBalance,
      resaleValue,
      resaleSource: car.resaleCustom ? "custom" : "estimated",
      loanLeft: loanStillOwed,
      loanStillOwed,
      finalMoney,
      finalMoneyLeft: finalMoney,
      totalDeficits,
      budgetDeficit: totalDeficits,
      averageMonthlyInvested: months > 0 ? monthlyInvestedTotal / months : 0,
      averageMonthlyCarCost: months > 0 ? (carPaymentsPaid - initialSpent + totalRunningCost) / months : 0,
      maxMonthlyCarCost,
      running,
      runningPaid,
      energyPaid: running.energy / 12 * months,
      maintenancePaid: running.maintenance / 12 * months,
      insurancePaid: running.insurance / 12 * months,
      repairsPaid: running.repairs / 12 * months,
      taxPaid: running.tax / 12 * months,
      monthlyPaymentUsed: isFinance ? finance.monthlyPayment : 0,
      finance,
      yearly,
      resaleRisk: resaleValue > num(car.carValue, car.upfrontPrice) * 0.9 && years >= 2,
    };
    row.option = scenarioLabel(row);
    row.warnings = buildWarnings(row, car, assumptions, months);
    row.possible = possibleStatus(row.warnings);
    row.summary = shortSummary(row, null);
    return row;
  }

  function compareRows(a, b) {
    return a.finalMoney - b.finalMoney;
  }

  function analyze(input) {
    const assumptions = Object.assign({}, DEFAULT_ASSUMPTIONS, input && input.assumptions ? input.assumptions : {});
    assumptions.yearsOwned = normalizeYears(assumptions.yearsOwned);
    const cars = {
      car1: withCarDefaults(input && input.cars && input.cars.car1, "car1"),
      car2: withCarDefaults(input && input.cars && input.cars.car2, "car2"),
    };
    Object.values(cars).forEach((car) => {
      if (!car.resaleCustom) car.resaleValue = estimatedResaleValue(car, assumptions.yearsOwned);
    });
    const rows = Object.entries(cars).map(([carKey, car]) => {
      const row = simulateScenario(car, assumptions, car.paymentMode, assumptions.yearsOwned, carKey);
      row.id = `${carKey}_${row.mode}`;
      row.option = scenarioLabel(row);
      return row;
    });
    const winner = rows.slice().sort((a, b) => compareRows(b, a))[0] || null;
    rows.forEach((row) => {
      row.isWinner = Boolean(winner && row.id === winner.id);
      row.summary = shortSummary(row, winner);
    });
    const runnerUp = winner ? rows.filter((row) => row.id !== winner.id).sort((a, b) => compareRows(b, a))[0] : null;
    const warnings = rows.flatMap((row) => row.warnings);
    return {
      assumptions,
      cars,
      rows,
      scenarios: rows,
      winner,
      runnerUp,
      difference: winner && runnerUp ? winner.finalMoney - runnerUp.finalMoney : 0,
      warnings,
      stockReturn: num(assumptions.marketReturn, STOCK_RETURN),
    };
  }

  function rankCarDatabase(assumptionsInput, scoreWeightsInput) {
    const assumptions = Object.assign({}, DEFAULT_ASSUMPTIONS, assumptionsInput || {});
    assumptions.yearsOwned = normalizeYears(assumptions.yearsOwned);
    const scoreWeights = Object.assign({}, DEFAULT_SCORE_WEIGHTS, scoreWeightsInput || {});
    const totalScoreWeight = Object.keys(DEFAULT_SCORE_WEIGHTS).reduce((sum, field) => sum + Math.max(0, num(scoreWeights[field])), 0);
    const directQualityScore = (entry) => {
      if (totalScoreWeight <= 0) return 0;
      const scores = entry.scores || defaultScores(entry);
      return Object.keys(DEFAULT_SCORE_WEIGHTS).reduce((sum, field) => {
        return sum + clamp(scores[field], 0, 10) * Math.max(0, num(scoreWeights[field]));
      }, 0) / totalScoreWeight;
    };
    const directRetentionRate = (entry, years) => {
      const type = typeFromModel(entry);
      const profile = entry.depreciationProfile;
      if (!profile || !Number.isFinite(Number(profile.firstYearRetention)) || !Number.isFinite(Number(profile.annualRetention))) {
        return retentionRate(type, years);
      }
      const firstYearRetention = num(profile.firstYearRetention, retentionRate(type, 1));
      const annualRetention = num(profile.annualRetention, 0.9);
      const minRetention = num(profile.minRetention, 0.08);
      if (years <= 1) return Math.min(0.98, firstYearRetention + (1 - years) * 0.06);
      return clamp(firstYearRetention * Math.pow(annualRetention, years - 1), minRetention, 1.15);
    };
    const rows = CAR_DATABASE.map((entry) => {
      const type = typeFromModel(entry);
      const years = assumptions.yearsOwned;
      const months = analysisMonths(years);
      const monthlyRate = monthlyInvestmentRate(assumptions.marketReturn);
      const initialSpent = Math.max(0, num(entry.defaultUpfrontPrice));
      const energy = type === "ev"
        ? Math.max(0, num(assumptions.annualKm)) / 100 * Math.max(0, num(entry.realWorldKwhPer100km)) * Math.max(0, num(assumptions.electricityPrice))
        : Math.max(0, num(assumptions.annualKm)) / 100 * Math.max(0, num(entry.realWorldLitersPer100km)) * Math.max(0, num(assumptions.fuelPrice));
      const running = {
        energy,
        maintenance: Math.max(0, num(entry.maintenancePerYear)),
        insurance: Math.max(0, num(entry.insurancePerYear)),
        repairs: Math.max(0, num(entry.repairsPerYear)),
        tax: Math.max(0, num(entry.taxPerYear)),
      };
      running.total = running.energy + running.maintenance + running.insurance + running.repairs + running.tax;
      const monthlyRunning = running.total / 12;
      const startingInvestment = Math.max(0, num(assumptions.initialCashBudget) - initialSpent);
      const monthlyInvestment = Math.max(0, num(assumptions.monthlyBudget) - monthlyRunning);
      const growth = Math.pow(1 + monthlyRate, months);
      const contributionGrowth = monthlyRate === 0 ? months : (growth - 1) / monthlyRate;
      const investmentBalance = startingInvestment * growth + monthlyInvestment * contributionGrowth;
      const totalDeficits = Math.max(0, initialSpent - num(assumptions.initialCashBudget)) + Math.max(0, monthlyRunning - num(assumptions.monthlyBudget)) * months;
      const runningPaid = monthlyRunning * months;
      const resaleValue = Math.round(Math.max(0, num(entry.defaultUpfrontPrice) * directRetentionRate(entry, years)) / 100) * 100;
      const totalPaid = initialSpent + runningPaid;
      const finalMoney = investmentBalance + resaleValue - totalDeficits;
      const qualityScore = directQualityScore(entry);
      return {
        id: entry.id,
        modelId: entry.id,
        carKey: entry.id,
        carName: entry.displayName,
        option: entry.displayName,
        mode: PAYMENT_MODES.upfront,
        type,
        category: entry.category,
        categoryGroup: entry.categoryGroup || entry.category,
        categoryLabel: entry.categoryLabel || entry.categoryGroup || entry.category,
        years,
        months,
        possible: initialSpent > num(assumptions.initialCashBudget) ? "No" : totalDeficits > 0 ? "Warning" : "Yes",
        warnings: [],
        upfrontPrice: initialSpent,
        carValue: num(entry.defaultUpfrontPrice),
        initialSpent,
        carPaidDisplay: initialSpent,
        carPaidNote: "paid upfront",
        carMonthlyPaymentDisplay: 0,
        carTotalDisplay: initialSpent,
        carPaymentsPaid: initialSpent,
        financeTotal: initialSpent,
        financingCost: 0,
        monthlyRunningCost: monthlyRunning,
        extraMonth: monthlyRunning,
        extraTotal: runningPaid,
        totalPaid,
        investedResult: investmentBalance,
        investmentBalance,
        resaleValue,
        resaleSource: "estimated",
        loanLeft: 0,
        loanStillOwed: 0,
        finalMoney,
        finalMoneyLeft: finalMoney,
        totalDeficits,
        budgetDeficit: totalDeficits,
        averageMonthlyInvested: months > 0 ? Math.max(0, num(assumptions.monthlyBudget) - monthlyRunning) : 0,
        averageMonthlyCarCost: months > 0 ? runningPaid / months : 0,
        maxMonthlyCarCost: monthlyRunning,
        running,
        runningPaid,
        energyPaid: running.energy / 12 * months,
        maintenancePaid: running.maintenance / 12 * months,
        insurancePaid: running.insurance / 12 * months,
        repairsPaid: running.repairs / 12 * months,
        taxPaid: running.tax / 12 * months,
        monthlyPaymentUsed: 0,
        finance: {
          downPayment: 0,
          monthlyPayment: 0,
          loanMonths: 0,
          financeTotal: initialSpent,
          financeTotalPaid: initialSpent,
          financingCost: 0,
        },
        qualityScore,
        globalRank: 0,
        yearly: [],
        resaleRisk: resaleValue > num(entry.defaultUpfrontPrice) * 0.9 && years >= 2,
      };
    });
    return rows.sort((a, b) => b.finalMoney - a.finalMoney || a.carName.localeCompare(b.carName)).map((row, index) => Object.assign(row, { globalRank: index + 1 }));
  }

  function formatEuro(value) {
    return `€${Math.round(num(value)).toLocaleString("en-IE")}`;
  }

  return {
    STOCK_RETURN,
    PAYMENT_MODES,
    VEHICLE_TYPES,
    CAR_DATABASE,
    CAR_BY_ID,
    DEFAULT_ASSUMPTIONS,
    DEFAULT_SCORE_WEIGHTS,
    TYPE_DEFAULTS,
    DEFAULT_CARS,
    TYPE_FIELDS,
    clone,
    num,
    defaultCar,
    weightedQualityScore,
    carModelById,
    carDefaultsFromModel,
    applyCarModelDefaults,
    displayCarName,
    applyTypeDefaults,
    markCustom,
    clearCustom,
    monthlyInvestmentRate,
    retentionRate,
    modelRetentionRate,
    estimatedResaleValue,
    effectiveResaleValue,
    financeSummary,
    loanBalance,
    weightedElectricityPrice,
    annualEnergyCost,
    annualRunningBreakdown,
    simulateScenario,
    analyze,
    rankCarDatabase,
    scenarioLabel,
    formatEuro,
  };
});

      return `<input data-car-input="${escapeHtml(name)}" list="carChoices" type="search" placeholder="${escapeHtml(placeholder)}" value="${escapeHtml(car ? car.fullName || car.displayName : value || "")}">`;
    }

      return `<a class="card" href="#car/${escapeHtml(car.id)}" aria-label="Open ${escapeHtml(car.fullName || car.displayName)}">
        <div class="card-art"><img loading="lazy" alt="" src="${imageFor(car)}"></div>
        <div class="card-body">
          <div class="card-title">
            <div>
              <h3>${escapeHtml(car.fullName || car.displayName)}</h3>
              <p class="mini">${escapeHtml(car.categoryGroup || car.category)} · ${escapeHtml(car.powertrain || "")}</p>
            </div>
            <span class="tag blue">${money(car.defaultUpfrontPrice)}</span>
          </div>
          <div class="stats">
            <div class="stat"><span>Use</span><strong>${escapeHtml(energyLabel(car))}</strong></div>
            <div class="stat"><span>Score</span><strong>${number(avgScore(car), 1)}/10</strong></div>
            <div class="stat"><span>Run</span><strong>${money(runningMonthly(car))}/mo</strong></div>
          </div>
          ${compact ? "" : `<div class="tag-row"><span class="tag green">${escapeHtml(car.bodyStyle || car.categoryGroup || "")}</span><span class="tag">${number(car.horsepower, 0)} hp</span><span class="tag">${number(car.acceleration0to100, 1)}s</span></div>`}
        </div>
      </a>`;
    }

    function pageHome() {
      const featured = byId["tesla-model-3"] || cars.find((car) => /Tesla Model 3 2021/.test(car.fullName)) || cars[0];
      const previews = ["tesla-model-3", "toyota-corolla", "skoda-octavia", "porsche-cayman"].map((id) => byId[id]).filter(Boolean);
      const cats = ["EV sedan", "SUV", "City car", "Sports car", "Estate", "Luxury SUV"].filter((cat) => categoryList.includes(cat));
      return `<div class="page">
        <section class="hero">
          <div class="hero-copy">
            <span class="eyebrow">${svgIcon("car")} Car discovery and value</span>
            <h1>Find the car that makes sense.</h1>
            <p>Browse cars, inspect ownership costs, compare specs, model used offers, and rank the best value without turning the site into a spreadsheet.</p>
            <div class="actions">
              <a class="button primary" href="#cars">Explore Cars ${svgIcon("arrow")}</a>
              <a class="button" href="#tools">Open Tools</a>
              <a class="button" href="#ranking">Rank Cars</a>
            </div>
          </div>
          <a class="feature-stage glass" href="#car/${escapeHtml(featured.id)}">
            <div class="car-art"><img alt="" src="${imageFor(featured)}"></div>
            <div class="feature-caption">
              <div class="caption-top">
                <div><h3>${escapeHtml(featured.fullName)}</h3><p class="mini">${escapeHtml(featured.categoryGroup)} · ${escapeHtml(featured.powertrain)}</p></div>
                <span class="tag green">Featured</span>
              </div>
              <div class="stats">
                <div class="stat"><span>Value</span><strong>${money(featured.defaultUpfrontPrice)}</strong></div>
                <div class="stat"><span>Score</span><strong>${number(avgScore(featured), 1)}/10</strong></div>
                <div class="stat"><span>Run</span><strong>${money(runningMonthly(featured))}/mo</strong></div>
              </div>
            </div>
          </a>
        </section>
        <section class="section">
          <div class="section-head">
            <div><h2>Cars</h2><p class="section-lead">Search from the database or start with a category.</p></div>
            <a class="button" href="#cars">Explore all</a>
          </div>
          <div class="toolbar">
            <input data-home-search type="search" placeholder="Search brand, model, year">
            <select data-home-category>${cats.map((cat) => `<option>${escapeHtml(cat)}</option>`).join("")}</select>
            <button class="button primary" data-home-explore type="button">Search</button>
          </div>
          <div class="tag-row">${cats.map((cat) => `<a class="chip" href="#cars?category=${encodeURIComponent(cat)}">${escapeHtml(cat)}</a>`).join("")}</div>
          <div class="grid car-grid" style="margin-top:16px">${previews.map((car) => carCard(car, true)).join("")}</div>
        </section>
        <section class="section">
          <div class="section-head"><div><h2>Tools</h2><p class="section-lead">Money, specs, used-market risk, and total value.</p></div></div>
          ${toolCards()}
        </section>
      </div>`;
    }

    function toolCards() {
      const tools = [
        ["financial", "Financial Compare", "Which car leaves you with the most money?", "bolt"],
        ["spec", "Spec Compare", "Acceleration, power, range, efficiency, space, and scores.", "gauge"],
        ["used", "Used Market Compare", "Offer price, mileage, condition, battery, warranty, and risk.", "search"],
        ["value", "Value Compare", "Financial outcome plus quality and spec value.", "rank"],
      ];
      return `<div class="grid cards">${tools.map(([id, title, desc, icon]) => `<a class="card" href="#tools/${id}">
        <div class="card-body">
          <span class="tool-icon tag blue">${svgIcon(icon)}</span>
          <h3>${escapeHtml(title)}</h3>
          <p class="muted">${escapeHtml(desc)}</p>
        </div>
      </a>`).join("")}</div>`;
    }

    function pageCars() {
      const params = new URLSearchParams((location.hash.split("?")[1] || ""));
      if (params.get("category") && state.carCategory === "All") state.carCategory = params.get("category");
      const filtered = filteredCars();
      const visible = filtered.slice(0, state.carVisible);
      return `<div class="page">
        <section class="section">
          <div class="section-head">
            <div><span class="eyebrow">${svgIcon("search")} Browse</span><h2>Cars</h2><p class="section-lead">${filtered.length.toLocaleString("en-IE")} matches from ${cars.length.toLocaleString("en-IE")} cars.</p></div>
          </div>
          <div class="toolbar">
            <input data-cars-search type="search" placeholder="Search brand, model, year" value="${escapeHtml(state.carSearch)}">
            <select data-cars-category>${categoryList.map((cat) => `<option value="${escapeHtml(cat)}" ${cat === state.carCategory ? "selected" : ""}>${escapeHtml(cat)}</option>`).join("")}</select>
            <button class="button" data-view-toggle type="button">${state.carView === "grid" ? "Compact" : "Grid"}</button>
          </div>
          ${visible.length ? `<div class="grid ${state.carView === "grid" ? "car-grid" : ""}">${visible.map((car) => carCard(car, state.carView !== "grid")).join("")}</div>` : `<div class="empty panel">No cars match that search.</div>`}
          ${filtered.length > visible.length ? `<div class="actions" style="justify-content:center;margin-top:18px"><button class="button" data-show-more-cars type="button">Show more</button></div>` : ""}
        </section>
      </div>`;
    }

    function filteredCars() {
      const terms = normalize(state.carSearch).split(/\s+/).filter(Boolean);
      return cars.filter((car) => {
        if (state.carCategory !== "All" && (car.categoryGroup || car.categoryLabel || car.category) !== state.carCategory) return false;
        if (!terms.length) return true;
        const haystack = car.searchText || normalize([car.fullName, car.brand, car.model, car.year, car.categoryGroup, car.powertrain].join(" "));
        return terms.every((term) => haystack.includes(term));
      });
    }

    function pageCarDetail(id) {
      const car = byId[id] || cars[0];
      const scores = car.scores || {};
      const specs = [
        ["Value", money(car.defaultUpfrontPrice)],
        ["Powertrain", car.powertrain],
        ["Power", `${number(car.horsepower, 0)} hp`],
        ["0-100", `${number(car.acceleration0to100, 1)} s`],
        ["Top speed", `${number(car.topSpeed, 0)} km/h`],
        ["Range", car.rangeKm ? `${number(car.rangeKm, 0)} km` : "Fuel"],
        ["Consumption", energyLabel(car)],
        ["Drivetrain", car.drivetrain],
        ["Transmission", car.transmission],
        ["Seats", number(car.seats, 0)],
        ["Boot", `${number(car.bootLiters, 0)} L`],
      ];
      const ownership = [
        ["Energy/year", car.energyType === "electricity" ? money((car.realWorldKwhPer100km || 0) * state.assumptions.annualKm / 100 * state.assumptions.electricityPrice) : money((car.realWorldLitersPer100km || 0) * state.assumptions.annualKm / 100 * state.assumptions.fuelPrice)],
        ["Maintenance", money(car.maintenancePerYear)],
        ["Insurance", money(car.insurancePerYear)],
        ["Repairs", money(car.repairsPerYear)],
        ["Tax", money(car.taxPerYear)],
        ["Resale est.", money(car.resaleEstimate || car.defaultUpfrontPrice * car.resaleRetentionEstimate)],
        ["Depreciation", pct(car.depreciation)],
        ["Monthly run", `${money(runningMonthly(car))}/mo`],
      ];
      return `<div class="page">
        <section class="detail-hero">
          <div class="detail-title glass">
            <span class="eyebrow">${escapeHtml(car.categoryGroup)} · ${escapeHtml(car.powertrain)}</span>
            <h1>${escapeHtml(car.fullName || car.displayName)}</h1>
            <p class="section-lead">${escapeHtml(car.marketContext || car.typicalMarket || "Portugal/EU estimate")}</p>
            <div class="actions">
              <a class="button primary" href="#tools/financial?car=${encodeURIComponent(car.id)}">Compare financially</a>
              <a class="button" href="#tools/spec?car=${encodeURIComponent(car.id)}">Compare specs</a>
              <a class="button" href="#ranking">Add to ranking</a>
            </div>
          </div>
          <div class="detail-art glass"><img alt="" src="${imageFor(car)}"></div>
        </section>
        <section class="section"><div class="section-head"><h2>Main Specs</h2></div><div class="spec-strip">${specs.map(([label, value]) => metric(label, value)).join("")}</div></section>
        <section class="section"><div class="section-head"><h2>Ownership</h2></div><div class="spec-strip">${ownership.map(([label, value]) => metric(label, value)).join("")}</div></section>
        <section class="section"><div class="section-head"><h2>Scores</h2></div><div class="grid cards">
          ${scoreCard("Reliability", scores.reliability)}
          ${scoreCard("Comfort", scores.comfort)}
          ${scoreCard("Safety", scores.safety)}
          ${scoreCard("Practicality", scores.practicality)}
          ${scoreCard("Tech", scores.tech)}
          ${scoreCard("Driving", scores.drivingEnjoyment)}
        </div></section>
      </div>`;
    }

    function metric(label, value) {
      return `<div class="metric"><span>${escapeHtml(label)}</span><strong>${escapeHtml(value)}</strong></div>`;
    }

    function scoreCard(label, value) {
      const width = Math.max(0, Math.min(100, (Number(value) || 0) * 10));
      return `<div class="score-card"><span class="mini">${escapeHtml(label)}</span><strong>${number(value, 1)}/10</strong><div class="score-bar" style="--w:${width}%"><i></i></div></div>`;
    }

    function pageTools() {
      if (state.route.sub === "financial") return toolFinancial();
      if (state.route.sub === "spec") return toolSpec();
      if (state.route.sub === "used") return toolUsed();
      if (state.route.sub === "value") return toolValue();
      return `<div class="page"><section class="section"><div class="section-head"><div><span class="eyebrow">${svgIcon("tools")} Tools</span><h2>Decision tools</h2><p class="section-lead">Four focused ways to compare cars.</p></div></div>${toolCards()}</section></div>`;
    }

    function toolFinancial() {
      const result = M.analyze({ assumptions: state.assumptions, cars: state.financialCars });
      const rows = result.rows || [];
      return `<div class="page"><section class="section">
        <div class="section-head"><div><span class="eyebrow">${svgIcon("bolt")} Financial Compare</span><h2>Which car leaves more money?</h2><p class="section-lead">Budget, financing, running costs, resale, investments, and net worth.</p></div></div>
        <div class="tool-layout">
          <div class="panel">
            <h3>Setup</h3>
            <div class="form-grid" style="margin-top:12px">
              ${assumptionInput("initialCashBudget", "Initial budget", 500)}
              ${assumptionInput("monthlyBudget", "Monthly budget", 25)}
              ${assumptionInput("yearsOwned", "Years", .5)}
              ${assumptionInput("annualKm", "Km/year", 500)}
              ${assumptionInput("fuelPrice", "Fuel €/L", .05)}
              ${assumptionInput("electricityPrice", "Electric €/kWh", .01)}
            </div>
          </div>
          <div class="grid">
            <div class="compare-grid">${["car1", "car2"].map(financialCarPanel).join("")}</div>
            <div class="compare-grid">${rows.map(financialResultCard).join("")}</div>
          </div>
        </div>
      </section></div>`;
    }

    function assumptionInput(field, label, step) {
      return `<label>${escapeHtml(label)}<input data-assumption="${escapeHtml(field)}" type="number" step="${step}" value="${escapeHtml(state.assumptions[field])}"></label>`;
    }

    function financialCarPanel(key) {
      const car = state.financialCars[key];
      return `<div class="panel">
        <div class="label-row"><h3>${escapeHtml(key === "car1" ? "Car A" : "Car B")}</h3><select data-fin-mode="${key}"><option value="upfront" ${car.paymentMode === "upfront" ? "selected" : ""}>Upfront</option><option value="finance" ${car.paymentMode === "finance" ? "selected" : ""}>Finance</option></select></div>
        <div class="form-grid" style="margin-top:12px">
          <label>Model ${carInput(`fin:${key}`, car.modelId)}</label>
          <label>Value <input data-fin-field="${key}:upfrontPrice" type="number" step="500" value="${escapeHtml(car.upfrontPrice)}"></label>
          ${car.paymentMode === "finance" ? `<label>Down <input data-fin-field="${key}:downPayment" type="number" step="250" value="${escapeHtml(car.downPayment)}"></label><label>Monthly <input data-fin-field="${key}:monthlyPayment" type="number" step="25" value="${escapeHtml(car.monthlyPayment)}"></label><label>Months <input data-fin-field="${key}:loanMonths" type="number" step="1" value="${escapeHtml(car.loanMonths)}"></label>` : ""}
          <label>${car.type === "ev" ? "kWh/100km" : "L/100km"} <input data-fin-field="${key}:${car.type === "ev" ? "kwhPer100Km" : "litersPer100Km"}" type="number" step=".1" value="${escapeHtml(car.type === "ev" ? car.kwhPer100Km : car.litersPer100Km)}"></label>
          <label>Maintenance <input data-fin-field="${key}:annualMaintenance" type="number" step="25" value="${escapeHtml(car.annualMaintenance)}"></label>
          <label>Insurance <input data-fin-field="${key}:annualInsurance" type="number" step="25" value="${escapeHtml(car.annualInsurance)}"></label>
          <label>Repairs <input data-fin-field="${key}:annualRepairs" type="number" step="25" value="${escapeHtml(car.annualRepairs)}"></label>
          <label>Tax <input data-fin-field="${key}:annualTax" type="number" step="5" value="${escapeHtml(car.annualTax)}"></label>
        </div>
      </div>`;
    }

    function financialResultCard(row) {
      return `<div class="panel">
        <div class="label-row"><h3>${escapeHtml(row.option)}</h3>${row.isWinner ? `<span class="tag green">Winner</span>` : `<span class="tag">Option</span>`}</div>
        <div class="spec-strip" style="margin-top:12px">
          ${metric("Total paid", money(row.totalPaid))}
          ${metric("Net worth", money(row.finalMoney))}
          ${metric("Car/month", money(row.averageMonthlyCarCost))}
          ${metric("Resale", money(row.resaleValue))}
        </div>
      </div>`;
    }

    function selectedCars(ids) {
      return ids.map((id) => byId[id]).filter(Boolean);
    }

    function selectionPanel(kind, ids, max = 4) {
      const rows = Array.from({ length:max }, (_, index) => ids[index] || "");
      return `<div class="panel"><h3>Cars</h3><div class="form-grid" style="margin-top:12px">${rows.map((id, index) => `<label>Car ${index + 1}${carInput(`${kind}:${index}`, id)}</label>`).join("")}</div></div>`;
    }

    function toolSpec() {
      const chosen = selectedCars(state.specIds);
      const fields = [
        ["Power", (car) => `${number(car.horsepower, 0)} hp`],
        ["0-100", (car) => `${number(car.acceleration0to100, 1)} s`],
        ["Top speed", (car) => `${number(car.topSpeed, 0)} km/h`],
        ["Range", (car) => car.rangeKm ? `${number(car.rangeKm, 0)} km` : "Fuel"],
        ["Use", energyLabel],
        ["Boot", (car) => `${number(car.bootLiters, 0)} L`],
        ["Seats", (car) => number(car.seats, 0)],
        ["Safety", (car) => `${number(car.scores.safety, 1)}/10`],
        ["Tech", (car) => `${number(car.scores.tech, 1)}/10`],
        ["Comfort", (car) => `${number(car.scores.comfort, 1)}/10`],
        ["Practicality", (car) => `${number(car.scores.practicality, 1)}/10`],
        ["Driving", (car) => `${number(car.scores.drivingEnjoyment, 1)}/10`],
      ];
      return `<div class="page"><section class="section">
        <div class="section-head"><div><span class="eyebrow">${svgIcon("gauge")} Spec Compare</span><h2>Which car is stronger?</h2><p class="section-lead">Performance, range, efficiency, space, and core scores.</p></div></div>
        <div class="tool-layout">${selectionPanel("spec", state.specIds)}<div class="panel"><div class="comparison-table" style="--cols:${chosen.length}">${compareHeader(chosen)}${fields.map(([label, fn]) => compareLine(label, chosen, fn)).join("")}</div></div></div>
      </section></div>`;
    }

    function compareHeader(chosen) {
      return `<div class="compare-line" style="--cols:${chosen.length}"><div></div>${chosen.map((car) => `<div><strong>${escapeHtml(car.fullName)}</strong><p class="mini">${escapeHtml(car.categoryGroup)}</p></div>`).join("")}</div>`;
    }

    function compareLine(label, chosen, fn) {
      return `<div class="compare-line" style="--cols:${chosen.length}"><div><strong>${escapeHtml(label)}</strong></div>${chosen.map((car) => `<div>${escapeHtml(fn(car))}</div>`).join("")}</div>`;
    }

    function toolUsed() {
      const offers = state.usedOffers.map((offer) => Object.assign({ car: byId[offer.modelId] }, offer)).filter((offer) => offer.car);
      const ranked = offers.map(scoreUsedOffer).sort((a, b) => b.score - a.score);
      return `<div class="page"><section class="section">
        <div class="section-head"><div><span class="eyebrow">${svgIcon("search")} Used Market Compare</span><h2>Is the used offer good?</h2><p class="section-lead">Offer price, mileage, condition, battery health, warranty, service history, risk, and expected repairs.</p></div></div>
        <div class="wide-layout">
          <div class="grid">${state.usedOffers.map((offer, index) => usedOfferPanel(offer, index)).join("")}</div>
          <div class="grid">${ranked.map((offer, index) => `<div class="panel"><div class="label-row"><h3>${index + 1}. ${escapeHtml(offer.car.fullName)}</h3><span class="tag ${offer.score >= 0 ? "green" : "rose"}">${money(offer.score)}</span></div><div class="spec-strip" style="margin-top:12px">${metric("Offer", money(offer.offerPrice))}${metric("Adjusted value", money(offer.adjustedValue))}${metric("Risk reserve", money(offer.riskReserve))}${metric("Verdict", offer.score >= 0 ? "Good offer" : "Overpriced")}</div></div>`).join("")}</div>
        </div>
      </section></div>`;
    }

    function usedOfferPanel(offer, index) {
      return `<div class="panel"><h3>Offer ${index + 1}</h3><div class="form-grid" style="margin-top:12px">
        <label>Model ${carInput(`used:${index}:modelId`, offer.modelId)}</label>
        ${usedInput(index, "offerPrice", "Offer price", 500)}
        ${usedInput(index, "mileage", "Mileage", 5000)}
        ${usedInput(index, "condition", "Condition 1-10", 1)}
        ${usedInput(index, "batteryHealth", "Battery health %", 1)}
        ${usedInput(index, "warranty", "Warranty months", 1)}
        ${usedInput(index, "service", "Service history 1-10", 1)}
        ${usedInput(index, "risk", "Accident/import risk 0-10", 1)}
        ${usedInput(index, "repairs", "Expected repairs", 100)}
      </div></div>`;
    }

    function usedInput(index, field, label, step) {
      return `<label>${escapeHtml(label)}<input data-used-field="${index}:${field}" type="number" step="${step}" value="${escapeHtml(state.usedOffers[index][field])}"></label>`;
    }

    function scoreUsedOffer(offer) {
      const car = offer.car;
      const mileageFactor = Math.max(.58, 1 - Math.max(0, Number(offer.mileage) - 30000) / 260000);
      const conditionFactor = .78 + Math.max(1, Math.min(10, Number(offer.condition))) * .028;
      const batteryFactor = car.energyType === "electricity" ? Math.max(.72, Math.min(1.04, Number(offer.batteryHealth) / 100)) : 1;
      const warrantyBonus = Math.min(1800, Number(offer.warranty) * 80);
      const servicePenalty = (10 - Math.max(1, Math.min(10, Number(offer.service)))) * 260;
      const riskReserve = Number(offer.repairs) + Number(offer.risk) * 420 + servicePenalty;
      const adjustedValue = Math.round((car.defaultUpfrontPrice * mileageFactor * conditionFactor * batteryFactor + warrantyBonus - riskReserve) / 100) * 100;
      return Object.assign({}, offer, { adjustedValue, riskReserve, score: adjustedValue - Number(offer.offerPrice || 0) });
    }

    function toolValue() {
      const chosen = selectedCars(state.valueIds);
      const rows = valueRows(chosen);
      return `<div class="page"><section class="section">
        <div class="section-head"><div><span class="eyebrow">${svgIcon("rank")} Value Compare</span><h2>Best total value</h2><p class="section-lead">Transparent normalized score: financial outcome, quality, spec value, and reliability/practicality.</p></div></div>
        <div class="tool-layout">${selectionPanel("value", state.valueIds)}<div class="grid">${rows.map((row, index) => `<div class="panel"><div class="label-row"><h3>${index + 1}. ${escapeHtml(row.car.fullName)}</h3><span class="tag green">${number(row.valueScore, 0)}</span></div><div class="spec-strip" style="margin-top:12px">${metric("Financial", `${number(row.financial, 0)}`)}${metric("Quality", `${number(row.quality, 0)}`)}${metric("Spec value", `${number(row.spec, 0)}`)}${metric("Reliable/practical", `${number(row.life, 0)}`)}</div><p class="mini" style="margin-top:10px">Formula: 40% financial, 25% quality, 20% performance per euro, 15% reliability and practicality.</p></div>`).join("")}</div></div>
      </section></div>`;
    }

    function performanceScore(car) {
      const accel = Math.max(0, 100 - (Number(car.acceleration0to100) || 10) * 7);
      const power = Math.min(100, (Number(car.horsepower) || 0) / 5);
      const range = car.rangeKm ? Math.min(100, car.rangeKm / 5) : Math.max(20, 100 - (Number(car.realWorldLitersPer100km) || 7) * 8);
      return (accel + power + range) / 3;
    }

    function normalizeRows(rows, field, invert = false) {
      const values = rows.map((row) => row[field]);
      const min = Math.min(...values);
      const max = Math.max(...values);
      rows.forEach((row) => {
        const raw = max === min ? 70 : (row[field] - min) / (max - min) * 100;
        row[`${field}Norm`] = invert ? 100 - raw : raw;
      });
    }

    function valueRows(chosen) {
      const ranked = M.rankCarDatabase(state.assumptions);
      const byModel = Object.fromEntries(ranked.map((row) => [row.modelId, row]));
      const rows = chosen.map((car) => {
        const financialRow = byModel[car.id] || {};
        return {
          car,
          finalMoney: Number(financialRow.finalMoney) || 0,
          totalPaid: Number(financialRow.totalPaid) || car.defaultUpfrontPrice,
          qualityBase: avgScore(car) * 10,
          specBase: performanceScore(car) / Math.max(1, car.defaultUpfrontPrice / 30000),
          lifeBase: ((car.scores.reliability || 0) + (car.scores.practicality || 0)) * 5,
        };
      });
      normalizeRows(rows, "finalMoney");
      normalizeRows(rows, "totalPaid", true);
      rows.forEach((row) => {
        row.financial = row.finalMoneyNorm * .7 + row.totalPaidNorm * .3;
        row.quality = row.qualityBase;
        row.spec = Math.min(100, row.specBase);
        row.life = row.lifeBase;
        row.valueScore = row.financial * .4 + row.quality * .25 + row.spec * .2 + row.life * .15;
      });
      return rows.sort((a, b) => b.valueScore - a.valueScore);
    }

    function pageRanking() {
      const rows = rankingRows();
      const filtered = rows.filter((row) => rankingMatches(row));
      const visible = filtered.slice(0, state.rankingLimit);
      return `<div class="page"><section class="section">
        <div class="section-head"><div><span class="eyebrow">${svgIcon("rank")} Ranking</span><h2>Rank cars</h2><p class="section-lead">${filtered.length.toLocaleString("en-IE")} matches. Rank follows the active mode.</p></div></div>
        <div class="panel" style="margin-bottom:14px">
          <div class="mode-bar">${[
            ["cheap", "Cheapest"],
            ["net", "Highest net worth"],
            ["score", "Highest score"],
            ["value", "Best value"],
          ].map(([id, label]) => `<button class="mode-button ${state.rankingMode === id ? "active" : ""}" data-ranking-mode="${id}" type="button">${escapeHtml(label)}</button>`).join("")}</div>
          <div class="toolbar" style="margin:14px 0 0">
            <input data-ranking-search type="search" placeholder="Search ranking" value="${escapeHtml(state.rankingSearch)}">
            <select data-ranking-category>${categoryList.map((cat) => `<option value="${escapeHtml(cat)}" ${cat === state.rankingCategory ? "selected" : ""}>${escapeHtml(cat)}</option>`).join("")}</select>
            <button class="button" data-ranking-more type="button">Show more</button>
          </div>
        </div>
        <div class="ranking-list">${visible.map(rankingRow).join("")}</div>
      </section></div>`;
    }

    function rankingRows() {
      if (!state.rankingRows) {
        const rows = M.rankCarDatabase(state.assumptions);
        const minNet = Math.min(...rows.map((row) => row.finalMoney));
        const maxNet = Math.max(...rows.map((row) => row.finalMoney));
        const minPaid = Math.min(...rows.map((row) => row.totalPaid));
        const maxPaid = Math.max(...rows.map((row) => row.totalPaid));
        rows.forEach((row) => {
          const car = byId[row.modelId] || {};
          row.qualityScore = row.qualityScore || avgScore(car);
          row.performanceScore = performanceScore(car);
          const net = maxNet === minNet ? 70 : (row.finalMoney - minNet) / (maxNet - minNet) * 100;
          const paid = maxPaid === minPaid ? 70 : 100 - (row.totalPaid - minPaid) / (maxPaid - minPaid) * 100;
          row.valueScore = net * .4 + row.qualityScore * 10 * .25 + row.performanceScore * .2 + paid * .15;
        });
        state.rankingRows = rows;
      }
      const sorted = state.rankingRows;
      const rows = sorted.slice().sort((a, b) => {
        if (state.rankingMode === "cheap") return a.totalPaid - b.totalPaid || a.carName.localeCompare(b.carName);
        if (state.rankingMode === "net") return b.finalMoney - a.finalMoney || a.carName.localeCompare(b.carName);
        if (state.rankingMode === "score") return b.qualityScore - a.qualityScore || a.carName.localeCompare(b.carName);
        return b.valueScore - a.valueScore || a.carName.localeCompare(b.carName);
      });
      rows.forEach((row, index) => row.activeRank = index + 1);
      state.rankingRows = rows;
      return rows;
    }

    function rankingMatches(row) {
      const car = byId[row.modelId] || {};
      if (state.rankingCategory !== "All" && (car.categoryGroup || row.categoryGroup) !== state.rankingCategory) return false;
      const terms = normalize(state.rankingSearch).split(/\s+/).filter(Boolean);
      if (!terms.length) return true;
      const haystack = car.searchText || normalize([row.carName, row.categoryGroup, car.brand, car.model, car.year].join(" "));
      return terms.every((term) => haystack.includes(term));
    }

    function rankingRow(row) {
      const car = byId[row.modelId] || {};
      return `<a class="rank-row" href="#car/${escapeHtml(row.modelId)}">
        <div class="rank-num">${row.activeRank}</div>
        <div><strong>${escapeHtml(row.carName)}</strong><p class="mini">${escapeHtml(row.categoryGroup || car.categoryGroup || "")}</p></div>
        <div class="hide-mobile">${metric("Total paid", money(row.totalPaid))}</div>
        <div class="hide-mobile">${metric("Net worth", money(row.finalMoney))}</div>
        <div class="hide-mobile">${metric("Score", `${number(row.qualityScore, 1)}/10`)}</div>
        <div>${metric("Value", number(row.valueScore, 0))}</div>
      </a>`;
    }

    function handleClick(event) {
      const target = event.target.closest("[data-home-explore],[data-view-toggle],[data-show-more-cars],[data-ranking-mode],[data-ranking-more]");
      if (!target) return;
      if (target.dataset.homeExplore !== undefined) {
        const search = document.querySelector("[data-home-search]");
        const category = document.querySelector("[data-home-category]");
        state.carSearch = search ? search.value : "";
        state.carCategory = category ? category.value : "All";
        state.carVisible = 48;
        location.hash = "#cars";
      }
      if (target.dataset.viewToggle !== undefined) {
        state.carView = state.carView === "grid" ? "compact" : "grid";
        render();
      }
      if (target.dataset.showMoreCars !== undefined) {
        state.carVisible += 48;
        render();
      }
      if (target.dataset.rankingMode) {
        state.rankingMode = target.dataset.rankingMode;
        state.rankingLimit = 80;
        render();
      }
      if (target.dataset.rankingMore !== undefined) {
        state.rankingLimit += 80;
        render();
      }
    }

    function handleInput(event) {
      const el = event.target;
      if (el.dataset.carsSearch !== undefined) {
        state.carSearch = el.value;
        state.carVisible = 48;
        render();
      }
      if (el.dataset.carsCategory !== undefined) {
        state.carCategory = el.value;
        state.carVisible = 48;
        render();
      }
      if (el.dataset.rankingSearch !== undefined) {
        state.rankingSearch = el.value;
        state.rankingLimit = 80;
        render();
      }
      if (el.dataset.rankingCategory !== undefined) {
        state.rankingCategory = el.value;
        state.rankingLimit = 80;
        render();
      }
      if (el.dataset.assumption) {
        state.assumptions[el.dataset.assumption] = Number(el.value);
        state.rankingRows = null;
        render();
      }
      if (el.dataset.finField) {
        const [key, field] = el.dataset.finField.split(":");
        state.financialCars[key] = M.markCustom(Object.assign({}, state.financialCars[key], { [field]: Number(el.value) }), field);
        render();
      }
      if (el.dataset.finMode) {
        const key = el.dataset.finMode;
        state.financialCars[key].paymentMode = el.value;
        render();
      }
      if (el.dataset.usedField) {
        const [index, field] = el.dataset.usedField.split(":");
        state.usedOffers[Number(index)][field] = Number(el.value);
        render();
      }
    }

    function handleChange(event) {
      const el = event.target;
      if (el.dataset.carInput) {
        const car = findCarByInput(el.value);
        if (!car) return;
        const [kind, a, field] = el.dataset.carInput.split(":");
        if (kind === "fin") state.financialCars[a] = M.applyCarModelDefaults(state.financialCars[a], car.id);
        if (kind === "spec") state.specIds[Number(a)] = car.id;
        if (kind === "value") state.valueIds[Number(a)] = car.id;
        if (kind === "used") state.usedOffers[Number(a)][field || "modelId"] = car.id;
        render();
      }
    }

    function render() {
      state.route = parseRoute();
      setActiveNav();
      let html = "";
      if (state.route.page === "home") html = pageHome();
      else if (state.route.page === "cars") html = pageCars();
      else if (state.route.page === "car") html = pageCarDetail(state.route.id);
      else if (state.route.page === "tools") html = pageTools();
      else if (state.route.page === "ranking") html = pageRanking();
      else html = pageHome();
      document.getElementById("app").innerHTML = html;
      window.scrollTo({ top:0, behavior:"instant" in window ? "instant" : "auto" });
    }

    document.addEventListener("click", handleClick);
    document.addEventListener("input", handleInput);
    document.addEventListener("change", handleChange);
    window.addEventListener("hashchange", render);
    fillDatalist();
    render();
  </script>
</body>
</html>
